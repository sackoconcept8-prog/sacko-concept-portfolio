<style>
/* SACKO CONCEPT Pilotage · même famille que NettoPro, RH Pro, StockPro.

:root{
  --bg:#F7F7F9; --surface:#FFFFFF; --surface2:#EEEEF2; --fg:#16151A; --muted:#64636D; --line:#E2E2E8;

  --shadow:0 1px 2px rgba(22,21,26,.05),0 8px 24px rgba(22,21,26,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r:18px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:700} h3{font-size:15px;font-weight:600;font-family:var(--body);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 15px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}

.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--blue-soft);color:var(--blue)} .p-wip{background:var(--amber-soft);color:var(--amber)} .p-ok{background:var(--green-soft);color:var(--green)} .p-off{background:var(--surface2);color:var(--muted)} .p-gold{background:var(--gold-soft);color:var(--gold)} .p-vio{background:var(--violet-soft);color:var(--violet)} .p-red{background:var(--red-soft);color:var(--red)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface)}
.login{min-height:100vh;display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(closest-side at 25% 25%,rgba(217,178,94,.22),transparent),radial-gradient(closest-side at 80% 70%,rgba(44,99,168,.12),transparent),var(--bg)}

.err{color:var(--red);font-size:13px;min-height:1.2em}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto}

.tacts{display:flex;gap:8px}

.perm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{position:relative;flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 4px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--gold)}
.tab .badge{top:0;right:18%}

  .tabs{top:0;bottom:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:calc(20px + env(safe-area-inset-top,0px)) 10px 20px max(10px,env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line)}
  .tab{flex:none;max-width:none;padding:10px 4px}
  .shell{padding-left:calc(92px + 28px);padding-right:28px;padding-bottom:40px}
}
.hero{background:radial-gradient(circle at 0% 0%,rgba(236,88,98,.32),transparent 55%),radial-gradient(circle at 55% 0%,rgba(170,130,235,.22),transparent 50%),radial-gradient(circle at 100% 60%,rgba(110,180,255,.28),transparent 55%),#FFFFFF;color:var(--fg);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}

.pros-tpl{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.pros-tpl textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--surface)}
@media(max-width:420px){.pros-sum{gap:6px}.pros-sum div{padding:8px}.pros-sum b{font-size:18px}.pros-sum span{font-size:11px}.tab{font-size:10.5px;padding:6px 2px}}
.pc{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.pc-row{display:flex;align-items:center;gap:10px;min-width:0}
.pc-lab{flex:none;width:72px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pc-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pc-row .btn{flex:none}
.pros-tpl input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;background:var(--surface);width:100%}
.item .d.due{color:var(--red);font-weight:600}
.pc-row.task{background:var(--surface2);border-radius:10px;padding:8px 10px}
.pc-row.task.due{background:var(--red-soft)}
.pc-row.task .pc-val{white-space:normal}
.pros-tpl select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;background:var(--surface);width:100%}
</style>
</head>
<body>

<section class="login" id="login">
  <form class="login-card card" id="loginForm">
    <img src="../assets/sacko-logo-512.png" alt="">
    <h1>SACKO CONCEPT</h1>
    <p class="muted small" style="margin:0">Votre application de pilotage : CRM, devis, factures, ventes et statistiques.</p>
    <label for="code" style="position:absolute;left:-9999px">Code d'accès</label>
    <input id="code" type="password" placeholder="Code d'accès" autocomplete="current-password">
    <button class="btn dark" type="submit">Entrer</button>
    <button class="btn" type="button" id="demoBtn">Voir avec des exemples</button>
    <div class="err" id="loginErr" aria-live="polite"></div>
  </form>
</section>

<div id="app" hidden>
  <nav class="tabs" aria-label="Navigation">
    <button class="tab" data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button class="tab" data-v="crm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.6"/></svg>CRM<span class="badge" id="b-crm" hidden></span></button>
    <button class="tab" data-v="pros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>Prospects<span class="badge" id="b-pros" hidden></span></button>
    <button class="tab" data-v="req"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 9h8M8 12h5"/></svg>Demandes<span class="badge" id="b-req" hidden></span></button>
    <button class="tab" data-v="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/></svg>Ventes<span class="badge" id="b-sales" hidden></span></button>
    <button class="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  </nav>

  <div class="shell"><div class="wrap">
    <div class="top">
      <div class="who"><img src="../assets/sacko-logo-96.png" alt=""><div><h1 id="hello">Bonjour Hawa</h1><div class="sync" id="sync">Synchronisation…</div></div></div>
      <div class="tacts">
        <button class="iconbtn" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" id="bellDot" hidden>0</span></button>
        <button class="iconbtn" id="settings" aria-label="Mes informations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
        <button class="iconbtn" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      </div>
    </div>
    <div class="demo-bar" id="demoBar" hidden><span>Mode exemple : les données sont fictives.</span><button class="btn sm" id="exitDemo">Entrer mon code</button></div>
    <div class="perm-bar" id="permBar" hidden><span>Activez les notifications pour être prévenue même en arrière-plan.</span><button class="btn sm dark" id="allow">Activer</button></div>
    <main id="v-home"></main>
    <main id="v-crm" hidden></main>
    <main id="v-pros" hidden></main>
    <main id="v-req" hidden></main>
    <main id="v-sales" hidden></main>
    <main id="v-stats" hidden></main>
  </div></div>
  <div class="notifs" id="notifs" hidden></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="iconbtn" id="close" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
</aside>
<div class="toast" id="toast" hidden></div>

<script src="../sacko-config.js"></script>
<script src="../sacko-docs.js"></script>
<script src="prospects.js"></script>
<script src="app.js"></script>
</body>
</html>
