 hygiene:{sing:"Contrôle d'hygiène",ajout:"Nouveau contrôle",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"controle",l:"Contrôle",type:"select",options:["Température chambre froide","Propreté cuisine","Dates de péremption","Tenue du personnel","Nettoyage salle"]},{k:"resultat",l:"Résultat",type:"select",options:["Conforme","Non conforme"]},{k:"par",l:"Contrôlé par",type:"membre",auto:c=>c.moi?c.moi.id:""},{k:"obs",l:"Observations",type:"textarea"}],cols:["date","controle","resultat","par"],titreDe:r=>r.controle,sousDe:r=>fd(r.date)+" · "+r.resultat,

},
kpisGroupe:D=>({couverts:somme(D.commandes.filter(c=>c.statut==="Payée"||c.statut==="Servie"),"couverts"),prestations:D.traiteur.filter(t=>t.statut!=="Annulée").length,stock:D.stock.filter(s=>s.statut!=="Suffisant").length,satisfaction:91}),

  dash:{kpis:D=>{const p=D.commandes.filter(c=>c.date===AUJ&&c.statut==="Payée");return [["Recettes du jour",fcfa(somme(p,"montant")),"var(--green)"],["Commandes du jour",D.commandes.filter(c=>c.date===AUJ).length],["Couverts servis",somme(D.commandes.filter(c=>c.date===AUJ&&["Servie","Payée"].includes(c.statut)),"couverts")],["Articles en alerte",D.stock.filter(s=>s.statut!=="Suffisant").length,"var(--red)"],["Achats à valider",D.appro.filter(a=>a.statut==="Demandé").length,"var(--amber)"],["Prestations à venir",D.traiteur.filter(t=>t.statut==="Confirmée").length]]},

   listes:[{c:"commandes",titre:"Prêtes à servir",filtre:r=>r.statut==="Prête"},{c:"commandes",titre:"À encaisser",filtre:r=>r.statut==="Servie"}]},
  menu:[{c:"commandes",l:"🧾 Commandes",can:["add","edit"],preset:c=>({serveur:c.moi.id,statut:"Nouvelle",paiement:"—"}),etapes:["Servie","Payée"],badge:D=>D.commandes.filter(c=>c.statut==="Prête").length},{c:"carte",l:"📋 Carte"}]},

   listes:[{c:"stock",titre:"Stock en alerte",filtre:r=>r.statut!=="Suffisant"},{c:"appro",titre:"Achats à recevoir",filtre:r=>r.statut==="Validé"}]},
  menu:[{c:"stock",l:"📦 Stock",can:["add","edit"]},{c:"appro",l:"🚚 Achats",can:["add"],etapes:["Reçu"],apresEtape:(r,e,c)=>{if(e!=="Reçu")return;const s=c.D.stock.find(x=>x.nom.toLowerCase()===String(r.article).toLowerCase());if(s){s.qte=(+s.qte||0)+(+r.qte||0);s.statut=s.qte<=s.seuil?"Stock bas":"Suffisant";c.toast("Stock mis à jour : "+s.nom+" = "+s.qte)}}}]}
