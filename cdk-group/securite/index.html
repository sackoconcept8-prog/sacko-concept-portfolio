<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CDK GROUP</title>
<link rel="icon" href="../logo-cdk-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<script>
window.SECTEUR=()=>{
const eq=genEquipe("sec",[["Superviseur",2,"Superviseur"],["Agent de sécurité",10,"Agent"]]);
const ag=eq.filter(m=>m.fonction==="Agent de sécurité").map(m=>m.id),sup=eq.filter(m=>m.fonction==="Superviseur").map(m=>m.id);
const sites=[["s1","Site portuaire","Zone portuaire",3,4],["s2","Siège CDK GROUP","Centre-ville",2,2],["s3","Entrepôt logistique","Zone industrielle",1,2],["s4","Résidence des partenaires","Quartier résidentiel",1,1],["s5","Hôtel partenaire","Bord de mer",1,1]];
const planning=[],pointages=[];
for(let d=-1;d<=2;d++)ag.forEach((a,i)=>{const s=sites[i%sites.length][0],poste=i%2?"Nuit":"Jour";planning.push({date:J(d),site:s,agent:a,poste,statut:d<0?(i===3?"Absent":"Présent"):d===0?(i<6?"Présent":"Prévu"):"Prévu"});
  if(d<=0&&!(d<0&&i===3)&&(d<0||i<6))pointages.push({date:J(d),agent:a,site:s,arrivee:poste==="Jour"?HM(6,50+(i%3)*7):HM(18,45+(i%4)*6),depart:d<0?(poste==="Jour"?HM(18,5):HM(6,4)):"",zone:i===5?"Hors zone (420 m)":"Dans la zone",statut:d<0?"Terminé":"En poste"})});
return {id:"secu",nom:"CDK Sécurité",ico:"🛡️",c:"#1f6fe5",sous:"Logiciel de gestion de la sécurité : sites, agents, planning jour et nuit, pointage, rondes, main courante et alertes SOS.",
collections:{
 equipe:colEquipe(["Superviseur","Agent de sécurité"],eq),
 sites:{sing:"Site",ajout:"Nouveau site",champs:[{k:"nom",l:"Nom du site",req:1},{k:"lieu",l:"Lieu"},{k:"jour",l:"Agents de jour",type:"number"},{k:"nuit",l:"Agents de nuit",type:"number"},{k:"consignes",l:"Consignes",type:"textarea"},{k:"statut",l:"Statut",type:"select",options:["Actif","Suspendu"]}],cols:["nom","lieu","jour","nuit"],statut:ST(["Actif","Suspendu"],{Actif:"p-green",Suspendu:"p-grey"}),titreDe:r=>r.nom,sousDe:r=>r.lieu,
   seed:sites.map(([id,nom,lieu,j,n])=>({id,nom,lieu,jour:j,nuit:n,consignes:"Contrôle des entrées, ronde toutes les 2 heures, registre des visiteurs.",statut:"Actif"}))},
 planning:{sing:"Affectation",ajout:"Nouvelle affectation",champs:[{k:"date",l:"Date",type:"date",req:1,defaut:AUJ},{k:"poste",l:"Poste",type:"select",options:["Jour","Nuit"]},{k:"site",l:"Site",type:"ref",ref:"sites",req:1},{k:"agent",l:"Agent",type:"membre",fonction:"Agent de sécurité",req:1},{k:"statut",l:"Statut",type:"select",options:["Prévu","Présent","Absent","Remplacé"]}],cols:["date","poste","site","agent"],statut:ST(["Prévu","Présent","Absent","Remplacé"],{Prévu:"p-blue",Présent:"p-green",Absent:"p-red",Remplacé:"p-amber"}),titreDe:r=>(membre(r.agent)||{}).nom+" · "+nomDe("sites",r.site),sousDe:r=>fd(r.date)+" · "+r.poste,tri:(a,b)=>b.date.localeCompare(a.date),seed:planning},
 pointages:{sing:"Pointage",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"agent",l:"Agent",type:"membre",fonction:"Agent de sécurité"},{k:"site",l:"Site",type:"ref",ref:"sites"},{k:"arrivee",l:"Arrivée",type:"time"},{k:"depart",l:"Départ",type:"time"},{k:"zone",l:"Position",type:"select",options:["Dans la zone","Hors zone (420 m)","Pointage de secours"]},{k:"statut",l:"Statut",type:"select",options:["En poste","Terminé"]}],cols:["date","agent","site","arrivee","depart","zone"],statut:ST(["En poste","Terminé"],{"En poste":"p-green",Terminé:"p-grey"}),titreDe:r=>(membre(r.agent)||{}).nom+" · "+r.arrivee,sousDe:r=>nomDe("sites",r.site)+" · "+r.zone,tri:(a,b)=>(b.date+b.arrivee).localeCompare(a.date+a.arrivee),seed:pointages},
 rondes:{sing:"Ronde",ajout:"Nouvelle ronde",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"heure",l:"Heure",type:"time",defaut:maintenant},{k:"agent",l:"Agent",type:"membre",fonction:"Agent de sécurité"},{k:"site",l:"Site",type:"ref",ref:"sites"},{k:"points",l:"Points de contrôle vérifiés",type:"number",defaut:6},{k:"obs",l:"Observations",type:"textarea"},{k:"statut",l:"Statut",type:"select",options:["Complète","Incomplète"]}],cols:["date","heure","agent","site","points"],statut:ST(["Complète","Incomplète"],{Complète:"p-green",Incomplète:"p-amber"}),titreDe:r=>"Ronde · "+nomDe("sites",r.site),sousDe:r=>fd(r.date)+" "+r.heure+" · "+(membre(r.agent)||{}).nom,
   seed:ag.slice(0,6).map((a,i)=>({date:J(-(i%2)),heure:HM(20+i%4,10),agent:a,site:sites[i%5][0],points:6-(i===2?2:0),obs:i===2?"Porte arrière non verrouillée, signalée.":"RAS",statut:i===2?"Incomplète":"Complète"}))},
 incidents:{sing:"Incident",ajout:"Signaler un incident",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"heure",l:"Heure",type:"time",defaut:maintenant},{k:"site",l:"Site",type:"ref",ref:"sites",req:1},{k:"type",l:"Type",type:"select",options:["Intrusion","Vol","Dégradation","Accès refusé","Incendie","Accident","Autre"]},{k:"gravite",l:"Gravité",type:"select",options:["Faible","Moyenne","Grave"]},{k:"description",l:"Description",type:"textarea",req:1},{k:"par",l:"Signalé par",type:"membre"},{k:"statut",l:"Statut",type:"select",options:["Ouvert","Pris en charge","Clôturé"]}],cols:["date","heure","site","type","gravite"],statut:ST(["Ouvert","Pris en charge","Clôturé"],{Ouvert:"p-red","Pris en charge":"p-amber",Clôturé:"p-green"}),titreDe:r=>r.type+" · "+nomDe("sites",r.site),sousDe:r=>fd(r.date)+" "+r.heure+" · gravité "+String(r.gravite).toLowerCase(),tri:(a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure),
   seed:[{date:J(0),heure:HM(2,14),site:"s1",type:"Intrusion",gravite:"Moyenne",description:"Tentative d'entrée par la clôture nord, individu en fuite.",par:ag[0],statut:"Pris en charge"},{date:J(-1),heure:HM(15,40),site:"s3",type:"Accès refusé",gravite:"Faible",description:"Livreur sans bon de livraison.",par:ag[2],statut:"Clôturé"},{date:J(-3),heure:HM(23,5),site:"s4",type:"Dégradation",gravite:"Faible",description:"Éclairage du portail cassé.",par:ag[3],statut:"Ouvert"}]},
 visites:{sing:"Visite de contrôle",ajout:"Nouvelle visite",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"heure",l:"Heure",type:"time",defaut:maintenant},{k:"site",l:"Site",type:"ref",ref:"sites",req:1},{k:"superviseur",l:"Superviseur",type:"membre",fonction:"Superviseur",auto:c=>c.moi?c.moi.id:""},{k:"agent",l:"Agent contrôlé",type:"membre",fonction:"Agent de sécurité"},{k:"note",l:"Note de l'agent",type:"select",options:["5 - Excellent","4 - Bien","3 - Correct","2 - Insuffisant","1 - Grave"]},{k:"tenue",l:"Tenue et présentation",type:"select",options:["Conforme","À corriger"]},{k:"obs",l:"Observations",type:"textarea"}],cols:["date","heure","site","agent","note"],titreDe:r=>"Visite · "+nomDe("sites",r.site),sousDe:r=>fd(r.date)+" · "+(membre(r.superviseur)||{}).nom,
   seed:[{date:J(0),heure:HM(1,30),site:"s1",superviseur:sup[0],agent:ag[0],note:"5 - Excellent",tenue:"Conforme",obs:"Agent vigilant, registre à jour."},{date:J(-1),heure:HM(22,15),site:"s3",superviseur:sup[1],agent:ag[2],note:"3 - Correct",tenue:"À corriger",obs:"Badge non porté."}]},
 sos:{sing:"Alerte SOS",champs:[{k:"date",l:"Date",type:"date",defaut:AUJ},{k:"heure",l:"Heure",type:"time",defaut:maintenant},{k:"agent",l:"Agent",type:"membre"},{k:"site",l:"Site",type:"ref",ref:"sites"},{k:"statut",l:"Statut",type:"select",options:["En cours","Pris en charge","Clôturé"]}],cols:["date","heure","agent","site"],statut:ST(["En cours","Pris en charge","Clôturé"],{"En cours":"p-red","Pris en charge":"p-amber",Clôturé:"p-green"}),titreDe:r=>"🚨 SOS · "+(membre(r.agent)||{}).nom,sousDe:r=>nomDe("sites",r.site)+" · "+fd(r.date)+" "+r.heure,seed:[]}
},
kpisGroupe:D=>{const m=AUJ.slice(0,7),p=D.pointages;return {agents:D.equipe.filter(x=>x.fonction==="Agent de sécurité"&&x.statut==="Actif").length,sites:D.sites.filter(s=>s.statut==="Actif").length,incidents:D.incidents.filter(i=>i.date.slice(0,7)===m).length,ponctualite:p.length?Math.round(100*p.filter(x=>x.zone==="Dans la zone").length/p.length):100}},
roles:[
 {id:"resp",poste:"Responsable CDK Sécurité",ico:"🛡️",desc:"Sites, agents, planning, contrôle de tout le dispositif.",
  dash:{kpis:D=>[["Agents actifs",D.equipe.filter(x=>x.fonction==="Agent de sécurité"&&x.statut==="Actif").length],["Sites sécurisés",D.sites.filter(s=>s.statut==="Actif").length],["En poste maintenant",D.pointages.filter(p=>p.statut==="En poste").length,"var(--green)"],["Absences aujourd'hui",D.planning.filter(p=>p.date===AUJ&&p.statut==="Absent").length,"var(--red)"],["Incidents ouverts",D.incidents.filter(i=>i.statut!=="Clôturé").length,"var(--amber)"],["SOS en cours",D.sos.filter(s=>s.statut==="En cours").length,"var(--red)"]],
   listes:[{c:"sos",titre:"🚨 Alertes SOS",filtre:r=>r.statut!=="Clôturé"},{c:"incidents",titre:"Main courante · incidents ouverts",filtre:r=>r.statut!=="Clôturé"},{c:"pointages",titre:"Derniers pointages",max:5}]},
  menu:[{c:"sites",l:"🏢 Sites",can:["add","edit"]},{c:"equipe",l:"👥 Agents et superviseurs",can:["add","edit"]},{c:"planning",l:"📅 Planning",can:["add","edit","del"],etapes:["Présent","Absent","Remplacé"]},{c:"pointages",l:"⏱️ Pointages",can:["edit"]},{c:"rondes",l:"🔦 Rondes"},{c:"incidents",l:"📕 Main courante",can:["add","edit"],etapes:["Pris en charge","Clôturé"],badge:D=>D.incidents.filter(i=>i.statut==="Ouvert").length},{c:"visites",l:"✅ Visites de contrôle"},{c:"sos",l:"🚨 Alertes SOS",etapes:["Pris en charge","Clôturé"],badge:D=>D.sos.filter(s=>s.statut==="En cours").length}]},
 {id:"sup",poste:"Superviseur",ico:"🧭",desc:"Tournées, visites de contrôle, notes des agents, alertes.",personne:"Superviseur",
  dash:{info:"Votre tournée : visitez les sites, notez les agents présents et traitez les alertes. Le pointage de secours sert pour un agent dont le téléphone ne marche pas.",
   actions:[{ico:"✅",l:"Nouvelle visite",run:c=>c.nouveau("visites",{superviseur:c.moi.id},{})},{ico:"⏱️",l:"Pointage de secours",run:c=>c.nouveau("pointages",{date:AUJ,arrivee:maintenant(),zone:"Pointage de secours",statut:"En poste"},{})},{ico:"📕",l:"Signaler un incident",run:c=>c.nouveau("incidents",{par:c.moi.id,statut:"Ouvert"},{})}],
   kpis:(D,c)=>[["Agents en poste",D.pointages.filter(p=>p.statut==="En poste").length,"var(--green)"],["Absences aujourd'hui",D.planning.filter(p=>p.date===AUJ&&p.statut==="Absent").length,"var(--red)"],["Mes visites",D.visites.filter(v=>v.superviseur===c.moi.id).length],["Alertes en cours",D.sos.filter(s=>s.statut==="En cours").length,"var(--red)"]],
   listes:[{c:"sos",titre:"🚨 Alertes SOS",filtre:r=>r.statut!=="Clôturé"},{c:"planning",titre:"Affectations du jour",filtre:r=>r.date===AUJ,max:10}]},
  menu:[{c:"planning",l:"📅 Planning",etapes:["Présent","Absent","Remplacé"]},{c:"pointages",l:"⏱️ Pointages"},{c:"visites",l:"✅ Mes visites",can:["add","edit"],filtre:(r,c)=>r.superviseur===c.moi.id},{c:"rondes",l:"🔦 Rondes"},{c:"incidents",l:"📕 Main courante",can:["add"],etapes:["Pris en charge","Clôturé"]},{c:"sos",l:"🚨 Alertes SOS",etapes:["Pris en charge","Clôturé"],badge:D=>D.sos.filter(s=>s.statut==="En cours").length},{c:"equipe",l:"👥 Agents"}]},
 {id:"agent",poste:"Agent de sécurité",ico:"👮",desc:"Pointage, rondes, incidents et bouton SOS sur le téléphone.",personne:"Agent de sécurité",
  dash:{info:"Sur votre téléphone : pointez à l'arrivée et au départ (votre position est vérifiée), faites vos rondes et signalez tout incident. En cas de danger, appuyez sur SOS.",
   actions:[{ico:"🟢",l:"Pointer mon arrivée",run:c=>{const p=c.D.planning.find(x=>x.agent===c.moi.id&&x.date===AUJ);if(c.D.pointages.some(x=>x.agent===c.moi.id&&x.statut==="En poste"))return c.toast("Vous êtes déjà en poste");c.D.pointages.unshift({id:uid(),date:AUJ,agent:c.moi.id,site:p?p.site:c.D.sites[0].id,arrivee:maintenant(),depart:"",zone:"Dans la zone",statut:"En poste"});if(p)p.statut="Présent";c.save();c.toast("Arrivée enregistrée à "+maintenant()+" · position vérifiée");c.ouvrir("dash")}},
    {ico:"🔴",l:"Pointer mon départ",run:c=>{const x=c.D.pointages.find(p=>p.agent===c.moi.id&&p.statut==="En poste");if(!x)return c.toast("Aucun pointage d'arrivée en cours");x.depart=maintenant();x.statut="Terminé";c.save();c.toast("Départ enregistré à "+x.depart);c.ouvrir("dash")}},
    {ico:"🔦",l:"Faire une ronde",run:c=>{const p=c.D.planning.find(x=>x.agent===c.moi.id&&x.date===AUJ);c.nouveau("rondes",{agent:c.moi.id,site:p?p.site:"",statut:"Complète"},{})}},
    {ico:"📕",l:"Signaler un incident",run:c=>{const p=c.D.planning.find(x=>x.agent===c.moi.id&&x.date===AUJ);c.nouveau("incidents",{par:c.moi.id,site:p?p.site:"",statut:"Ouvert"},{})}},
    {ico:"🚨",l:"SOS",danger:1,run:c=>{if(!confirm("Envoyer une alerte SOS au superviseur et au responsable ?"))return;const p=c.D.planning.find(x=>x.agent===c.moi.id&&x.date===AUJ);c.D.sos.unshift({id:uid(),date:AUJ,heure:maintenant(),agent:c.moi.id,site:p?p.site:"",statut:"En cours"});c.save();c.toast("🚨 Alerte envoyée. Restez en sécurité.");c.ouvrir("dash")}}],
   kpis:(D,c)=>{const p=D.planning.find(x=>x.agent===c.moi.id&&x.date===AUJ),e=D.pointages.find(x=>x.agent===c.moi.id&&x.statut==="En poste");return [["Mon poste aujourd'hui",p?p.poste+" · "+esc(nomDe("sites",p.site)):"Repos"],["Statut",e?"En poste depuis "+e.arrivee:"Pas encore pointé",e?"var(--green)":"var(--amber)"],["Mes rondes",D.rondes.filter(r=>r.agent===c.moi.id).length]]},
   listes:[{c:"planning",titre:"Mon planning",filtre:(r,c)=>r.agent===c.moi.id&&r.date>=AUJ}]},
  menu:[{c:"planning",l:"📅 Mon planning",filtre:(r,c)=>r.agent===c.moi.id},{c:"pointages",l:"⏱️ Mes pointages",filtre:(r,c)=>r.agent===c.moi.id},{c:"rondes",l:"🔦 Mes rondes",can:["add"],filtre:(r,c)=>r.agent===c.moi.id,preset:c=>({agent:c.moi.id})},{c:"incidents",l:"📕 Mes signalements",can:["add"],filtre:(r,c)=>r.par===c.moi.id,preset:c=>({par:c.moi.id,statut:"Ouvert"})}]}
]}};
</script>
</body>
</html>
