@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.splash img,.splash .p,.splash .n{animation:none;opacity:1}}
.pitch{background:linear-gradient(145deg,#0E0E0E,#1E1A12);color:#F2E6C6;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pitch .eyebrow{color:#E2BC69}
.note{background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.note svg{width:20px;height:20px;flex:none}
button.kpi{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.paper p{margin:8px 0}
.sheet .paper{margin-top:4px}
input[type=file]{font:inherit;font-size:13px;color:var(--muted);width:100%;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:13px;margin-right:10px;padding:9px 14px;border:0;border-radius:10px;background:var(--forest);color:var(--on-forest);cursor:pointer}
input[type=file]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ptile{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.ptile:disabled{opacity:.5;cursor:not-allowed}
.ptile .ph{position:relative;aspect-ratio:1.5;border-radius:12px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.ptile .ph img{width:100%;height:100%;object-fit:cover}
.ptile .pn{font-weight:600;font-size:13.5px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .row{gap:6px}
.incart{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--forest);color:var(--gold);font:800 12px var(--body);display:grid;place-items:center;padding:0 6px}
.sold,.few{position:absolute;left:6px;bottom:6px;font:700 11px var(--body);padding:3px 8px;border-radius:99px}
.sold{background:var(--red);color:#fff}.few{background:var(--gold);color:#fff}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.thumb.big{width:72px;height:72px;font-size:38px;border-radius:18px}
.thumb img{width:100%;height:100%;object-fit:cover}
.step{display:inline-flex;align-items:center;gap:8px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface2);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer}
.cartbar{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:14px -16px calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:18px 18px 0 0}
.cartbar .btn:disabled{opacity:.5}
.invq,.poq{width:70px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 8px;font:600 15px var(--body);text-align:center;flex:none}
.mark svg{width:26px;height:26px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.imeis{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.imsel{display:block;margin-top:5px;width:100%;font:12px var(--body);border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--surface);color:var(--fg)}
nav.tabs a{font-size:10.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 2px;font:600 12px var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.mtab{width:100%;border-collapse:collapse;font-size:13.5px}
.mtab th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.mtab td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
</style>
</head>

function paintSheet0(){const sc=$(".sheet")?$(".sheet").scrollTop:0;$("#layer").innerHTML=`<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${sheetFn()}</div></div>`;const s=$(".sheet");if(s)s.scrollTop=sc;bindInputs()}
function closeSheet(){sheetFn=null;$("#layer").innerHTML=""}
function refresh(){if(sheetFn)paintSheet();render()}
function header(eyebrow,title){const n=notifs().length;const who=mode==="admin"?S.settings.owner:first((mate(UI.me)||{}).name);return`${demoBar()}<div class="top"><div class="grow"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="row" style="gap:8px"><button class="iconbtn" data-act="notifs" aria-label="Alertes">${svg("bell")}${n?`<span class="badge">${n}</span>`:""}</button><button class="avatar" data-act="menu" aria-label="Menu">${esc((who||"?")[0])}</button></div></div>`}
const pitch=()=>`<div class="pitch"><div class="eyebrow">Version complète</div><h2 style="color:#fff">PhonePro à votre nom, pour votre boutique de téléphones</h2><div class="small" style="opacity:.85">Votre logo, vos couleurs, vos téléphones et accessoires importés, votre catalogue en ligne pour vos clients. Application Android et iPhone en option.</div><button class="btn gold" data-act="offer">Voir les offres</button></div>`;
const missionDone=k=>{S.tour=S.tour||{};if(!S.tour[k]){S.tour[k]=1;save();const n=TOUR.filter(t=>S.tour[t[0]]).length;setTimeout(()=>toast("✓ Mission découverte "+n+"/"+TOUR.length),700)}};
const TOUR=[["sale","Vendez un téléphone avec son IMEI"],["in","Réceptionnez un arrivage par IMEI"],["troc","Faites un troc pendant une vente"],["warr","Vérifiez une garantie par IMEI"],["cli","Passez côté client et commandez"],["rep","Regardez vos bénéfices du mois"]];

function notifs(){
 const n=[];
 const nw=S.orders.filter(o=>o.status==="Nouvelle");if(nw.length)n.push({ic:"bag",t:pl(nw.length,"nouvelle commande client","nouvelles commandes clients"),s:"À préparer",go:mode==="cli"?null:(mode==="vend"?"v-commandes":"commandes"),c:"p-blue"});
 S.products.filter(p=>p.min>0&&p.stock<=0).forEach(p=>n.push({ic:"alert",t:p.name+" en rupture",s:"Plus aucune pièce en stock",act:"prod",id:p.id,c:"p-red"}));
 S.products.filter(p=>p.stock>0&&p.stock<=p.min).forEach(p=>n.push({ic:"box",t:p.name+" · stock bas",s:"Reste "+p.stock+", seuil "+p.min,act:"prod",id:p.id,c:"p-amber"}));
 expiring(30).forEach(p=>n.push({ic:"clock",t:p.name+" · péremption",s:diff(p.exp)<0?"Périmé depuis le "+fd(p.exp):"Expire le "+fd(p.exp)+" ("+p.stock+" en stock)",act:"prod",id:p.id,c:"p-amber"}));
 if(mode==="admin"){pendingPerms().forEach(p=>n.push({ic:"cal",t:"Permission demandée par "+first((mate(p.member)||{}).name),s:(p.from===p.to?fd(p.from):fd(p.from)+" → "+fd(p.to))+" · "+p.reason,act:"etab",id:"",v:"perm",c:"p-gold"}));
  const tc=teamDay(today());if(tc.abs)n.push({ic:"users",t:pl(tc.abs,"absent aujourd'hui","absents aujourd'hui"),s:"Voir l'équipe du jour",go:"equipe",c:"p-red"});}
 if(mode==="admin"){S.flags.filter(f=>!f.done).forEach(f=>n.push({ic:"msg",t:"Signalement de "+first((mate(f.by)||{}).name),s:f.text,act:"flag",id:f.id,c:"p-gold"}));
  S.clients.filter(c=>c.credit>0).forEach(c=>n.push({ic:"cash",t:c.name+" doit "+money(c.credit),s:"Crédit client à encaisser",act:"client",id:c.id,c:"p-grey"}))}
 return mode==="cli"?[]:n}

 return`${header(dayLabel(),"Bonjour "+esc(S.settings.owner))}${tour}

 <div class="bars">${vals.map((v,i)=>`<i class="${i===6?"on":""}" style="height:${Math.max(6,v/mx*100)}%"></i>`).join("")}</div><div class="blabels">${days.map(d=>`<span>${JOURS[new Date(d+"T12:00:00").getDay()]}</span>`).join("")}</div></div>

 <div class="section"><div class="kpis">
  <button class="kpi ${nw.length?"":""}" data-go="commandes"><span class="eyebrow">Commandes à préparer</span><span class="v">${nw.length}</span><span class="xs muted">catalogue en ligne</span></button>
  <button class="kpi ${lw.length?"alert":""}" data-act="stab" data-v="alertes"><span class="eyebrow">Alertes stock</span><span class="v">${lw.length}</span><span class="xs muted">${lows().filter(p=>p.stock<=0).length} en rupture</span></button>
  <button class="kpi" data-go="troc"><span class="eyebrow">Trocs du mois</span><span class="v">${S.trades.filter(t=>t.date>=off(-29)).length}</span><span class="xs muted">${tradeStock().length} occasion(s) en stock</span></button>
  <button class="kpi ${cr?"alert":""}" data-go="clients"><span class="eyebrow">Crédits clients</span><span class="v">${money(cr)}</span><span class="xs muted">${S.clients.filter(c=>c.credit>0).length} clients à relancer</span></button></div></div>
 <div class="section">${teamCard()}</div>
 ${lw.length?`<div class="section"><div class="row between"><h2>À réapprovisionner</h2>${link("stock","Tout voir")}</div><div class="card list">${lw.slice(0,4).map(p=>`<button class="item" data-act="prod" data-id="${p.id}">${thumb(p)}<span class="grow"><span class="t" style="display:block">${esc(p.name)}</span><span class="xs muted">Reste ${p.stock} · seuil ${p.min} · ${esc((sup(p.sup)||{}).name||"")}</span></span><span class="pill ${status(p)[1]}">${status(p)[0]}</span></button>`).join("")}</div><button class="btn dark block" data-act="autopo">${svg("truck")}Préparer les bons de commande</button></div>`:""}
 ${S.trades.length?`<div class="section"><div class="row between"><h2>Derniers trocs</h2>${link("troc","Tout voir")}</div><div class="card list">${S.trades.slice(-3).reverse().map(tradeItem).join("")}</div></div>`:""}

 <div class="section"><div class="row between"><h2>Dernières ventes</h2>${link("ventes","Historique")}</div><div class="card list">${ts.slice(-4).reverse().map(saleItem).join("")||`<div class="empty">Aucune vente aujourd'hui</div>`}</div></div>
 <div class="section">${pitch()}</div>`}

function vProduits(){

function sProd(id){const p=prod(id);if(!p)return"";const sp=sup(p.sup);const st=status(p);
 const hist=[...S.moves.filter(m=>m.pid===id).map(m=>({d:m.date,t:m.time,l:m.type+" · "+m.reason,q:m.qty})),...S.sales.filter(s=>s.items.some(i=>i.pid===id)).slice(-8).map(s=>({d:s.date,t:s.time,l:"Vente N° "+s.no,q:-s.items.find(i=>i.pid===id).qty}))].sort((a,b)=>(b.d+b.t).localeCompare(a.d+a.t)).slice(0,8);

function doSale(){
 if(UI.pay==="Crédit"&&!UI.saleCli){toast("Choisissez le client pour une vente à crédit");return}
 for(const c of UI.cart){const p=prod(c.pid);if(p&&p.imei&&c.imeis.some(x=>!p.imeis.includes(x))){toast("Un IMEI n'est plus en stock : vérifiez la vente");return}if(!p||c.qty>p.stock){toast("Stock insuffisant pour "+(p?p.name:"un produit"));return}}
 const sub=cartTotal(),disc=Math.min(+UI.disc||0,sub);
 if(UI.trade&&S.products.some(p=>(p.imeis||[]).includes(UI.trade.imei))){toast("L'IMEI du troc est déjà en stock");return}
 const sale={id:uid(),no:Math.max(1000,...S.sales.map(s=>s.no))+1,date:today(),time:nowHM(),items:UI.cart.map(c=>{const p=prod(c.pid);const it={pid:p.id,name:p.name,qty:c.qty,price:p.sell,buy:p.buy};if(p.imei){it.imeis=[...c.imeis];it.warr=p.warr||0}return it}),pay:UI.pay||"Espèces",client:UI.saleCli||"",seller:mode==="vend"?UI.me:"t1",disc};
 const crossed=[];sale.items.forEach(i=>{const p=prod(i.pid);const was=p.stock;if(p.imei){p.imeis=p.imeis.filter(x=>!i.imeis.includes(x));p.stock=p.imeis.length}else p.stock-=i.qty;if(was>p.min&&p.stock<=p.min)crossed.push(p.name)});
 if(UI.trade)sale.trade={value:+UI.trade.value,label:UI.trade.model+" "+UI.trade.storage+" · grade "+UI.trade.grade,imei:UI.trade.imei};
 if(sale.pay==="Crédit"){sale.dep=Math.min(total(sale),Math.max(0,+UI.dep||0));const c=cli(sale.client);c.credit=Math.round((c.credit+total(sale)-sale.dep)*100)/100}
 if(UI.trade){const tr=regTrade(S,{...UI.trade,date:sale.date,time:sale.time},sale.id);sale.trade.no=tr.no;missionDone("troc")}
 S.sales.push(sale);save();UI.cart=[];UI.disc="";UI.cash="";UI.saleCli="";UI.pay="Espèces";UI.trade=null;UI.dep="";saveUI();missionDone("sale");
 sheet(()=>sReceipt(sale.id));render();if(crossed.length)setTimeout(()=>toast("⚠ Stock bas : "+crossed.join(", ")),900)}

function vRapports(){missionDone("rep");const per=UI.rper||"30";const n=+per;const from=off(-(n-1));const L=salesFrom(from);const ca=sum(L,total),pf=sum(L,profit);

 <div class="kpis" style="margin-top:12px"><div class="kpi"><span class="eyebrow">Chiffre d'affaires</span><span class="v">${money(ca)}</span>${caP?`<span class="xs" style="color:${ev>=0?"var(--accent)":"var(--red)"}">${ev>=0?"▲":"▼"} ${pct(Math.abs(ev))} vs période d'avant</span>`:`<span class="xs muted">${pl(L.length,"vente","ventes")}</span>`}</div><div class="kpi"><span class="eyebrow">Bénéfice brut</span><span class="v" style="color:var(--gold)">${money(pf)}</span><span class="xs muted">marge ${pct(ca?pf/ca*100:0)}</span></div><div class="kpi"><span class="eyebrow">Panier moyen</span><span class="v">${money(L.length?ca/L.length:0)}</span><span class="xs muted">${pl(L.length,"vente","ventes")}</span></div><div class="kpi ${losses?"alert":""}"><span class="eyebrow">Pertes et casse</span><span class="v">${money(losses)}</span><span class="xs muted">au prix d'achat</span></div><div class="kpi"><span class="eyebrow">Téléphones vendus</span><span class="v">${sum(L,s=>sum(s.items.filter(i=>i.imeis),i=>i.qty))}</span><span class="xs muted">dont ${sum(L,s=>sum(s.items.filter(i=>i.imeis&&(prod(i.pid)||{}).cat==="Occasion"),i=>i.qty))} occasion(s)</span></div><div class="kpi"><span class="eyebrow">Trocs et rachats</span><span class="v">${S.trades.filter(t=>t.date>=from).length}</span><span class="xs muted">repris pour ${money(sum(S.trades.filter(t=>t.date>=from),t=>t.value))}</span></div></div>

 return`<button class="card pad stack" data-go="equipe" style="border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%"><div class="row between"><span class="eyebrow">Équipe aujourd'hui</span><span class="small" style="color:var(--accent);font-weight:700">Gérer ›</span></div><div class="row" style="gap:10px;align-items:baseline"><b class="num" style="font-family:var(--display);font-size:28px">${c.here}/${c.total}</b><span class="small muted">présents</span></div><div class="meter"><i style="width:${pct}%"></i></div><div class="row wrap" style="gap:6px">${c.late?`<span class="pill p-amber">${c.late} en retard</span>`:""}${c.abs?`<span class="pill p-red">${c.abs} absent${c.abs>1?"s":""}</span>`:""}${c.perm?`<span class="pill p-blue">${c.perm} en permission</span>`:""}${c.none?`<span class="pill p-grey">${c.none} pas encore pointé${c.none>1?"s":""}</span>`:""}${pendingPerms().length?`<span class="pill p-gold">${pendingPerms().length} demande(s) à valider</span>`:""}</div></button>`}

 const tabs=[["jour","Aujourd'hui"],["perm","Permissions",pendingPerms().length],["livr","Livreurs"],["mois","Bilan du mois"],["membres","Membres"]];

 if(tab==="perm"){const P=(S.perms||[]).slice().reverse();body=`<div class="card list">${P.map(p=>{const t=mate(p.member)||{name:"?"};return`<div class="item static" style="flex-wrap:wrap"><span class="avatar av-s">${esc(ini(t.name))}</span><span class="grow"><span class="t" style="display:block">${esc(t.name)} · ${p.from===p.to?fd(p.from):fd(p.from)+" → "+fd(p.to)}</span><span class="xs muted">${esc(p.reason)} · demandé le ${fd(p.date)}</span></span><span class="pill ${p.status==="Acceptée"?"p-green":p.status==="Refusée"?"p-red":"p-gold"}">${p.status}</span>

 if(tab==="livr"){const D=S.team.filter(t=>t.role==="Livreur");const open=S.orders.filter(o=>o.mode==="Livraison"&&o.status!=="Livrée"&&o.status!=="Annulée");
  body=`<div class="card list">${D.map(t=>{const a=attOf(d,t.id);const cur=open.filter(o=>o.driver===t.id);const done=S.orders.filter(o=>o.driver===t.id&&o.doneDate===d);return`<div class="item static"><span class="avatar av-s">${esc(ini(t.name))}</span><span class="grow"><span class="t" style="display:block">${esc(t.name)}</span><span class="xs muted">${a?a.st:"Pas pointé"} · ${pl(cur.length,"course en cours","courses en cours")} · ${pl(done.length,"livrée","livrées")} aujourd'hui</span></span>${waBtn(t.phone,"Bonjour "+first(t.name)+", ici "+S.settings.owner+".","","sm")}</div>`}).join("")||`<div class="empty">Aucun livreur : ajoutez-en un dans « Membres »</div>`}</div>
  <div class="section"><h2>Livraisons à attribuer</h2><div class="stack">${open.map(orderCard).join("")||`<div class="card empty">Aucune livraison en attente</div>`}</div></div>`}
 if(tab==="mois"){const m=perRange()[2];body=`<div class="chips">${[["prev","Mois dernier"],["cur","Mois en cours"],["30","30 derniers jours"]].map(x=>`<button class="chip ${x[0]===(UI.mper||"prev")?"on":""}" data-act="mper" data-v="${x[0]}">${x[1]}</button>`).join("")}</div><div class="card pad" style="margin-top:10px"><h3>Bilan · ${esc(m)}</h3><div class="tw" style="margin-top:8px"><table class="mtab"><thead><tr><th>Membre</th><th>Présent</th><th>Retards</th><th>Absent</th><th>Perm.</th></tr></thead><tbody>${T.map(t=>{const r=monthStats(t.id);return`<tr><td><b>${esc(first(t.name))}</b><br><span class="xs muted">${esc(t.role)}</span></td><td>${r.p} j</td><td>${r.l}</td><td style="${r.a?"color:var(--red);font-weight:700":""}">${r.a}</td><td>${r.perm}</td></tr>`}).join("")}</tbody></table></div></div>
  <button class="btn block" style="margin-top:12px" data-act="attexport">${svg("download")}Exporter le bilan (Excel)</button><div class="note small" style="margin-top:12px">Pratique pour payer votre équipe : vous avez les jours de présence de chacun, sans calcul compliqué.</div>`}
 if(tab==="membres"){body=`<div class="card list">${S.team.map(t=>{const L=salesOn(today()).filter(s=>s.seller===t.id);return`<div class="item static"><span class="avatar av-s">${esc(ini(t.name))}</span><span class="grow"><span class="t" style="display:block">${esc(t.name)}</span><span class="xs muted">${esc(t.role)}${t.role==="Livreur"?"":" · aujourd'hui "+pl(L.length,"vente","ventes")}</span></span><span class="pill ${t.role.startsWith("Gérant")?"p-gold":"p-grey"}">${t.role.startsWith("Gérant")?"Accès complet":t.role==="Livreur"?"Livraisons":"Vente et stock"}</span></div>`}).join("")}</div>

  case"pocreate":{const P=S.products.filter(p=>p.sup===v);const items=P.map(p=>({pid:p.id,qty:+(UI.poq[p.id]??(p.stock<=p.min?Math.max(p.min*2-p.stock,p.min):0))||0,cost:p.buy})).filter(i=>i.qty>0);if(!items.length){toast("Indiquez au moins une quantité");return}const po={id:"po"+uid(),no:"BC-"+String(108+S.pos.length).padStart(4,"0"),sup:v,date:today(),status:"Envoyé",items};S.pos.push(po);save();sheet(()=>sPo(po.id));render()}break;
  case"poview":{const po=S.pos.find(x=>x.id===id);if(po.status==="Brouillon"){po.status="Envoyé";save()}sheet(()=>sPo(id));render()}break;
  case"poreceive":{const po=S.pos.find(x=>x.id===id);po.items.forEach(i=>{const p=prod(i.pid);if(!p)return;if(p.imei){for(let k=0;k<i.qty;k++)p.imeis.push(newImei());p.stock=p.imeis.length}else p.stock+=i.qty;p.buy=i.cost;S.moves.push({id:uid(),pid:p.id,type:"Entrée",qty:i.qty,reason:"Réception "+po.no,date:today(),time:nowHM(),by:S.settings.owner})});po.status="Reçu";save();missionDone("in");paintSheet();render();toast(po.items.some(i=>(prod(i.pid)||{}).imei)?"Stock mis à jour ✓ · démo : IMEI générés (en vrai, vous les scannez)":"Stock mis à jour ✓")}break;
  case"sup":sheet(()=>sSup(id));break;
  case"client":sheet(()=>sClient(id));break;
  case"repay":{const c=cli(id),m=Math.min(c.credit,Math.max(0,+$("#rb-amt").value||0));if(!m)return;c.credit=Math.round((c.credit-m)*100)/100;save();paintSheet();render();toast("Remboursement de "+money(m)+" encaissé")}break;
  case"flag":{const f=S.flags.find(x=>x.id===id);sheet(()=>`<h2>Signalement</h2><p>${esc(f.text)}</p><p class="small muted">${esc((mate(f.by)||{}).name||"")} · ${fdy(f.date)}</p><div class="btns">${f.pid?`<button class="btn" data-act="prod" data-id="${f.pid}">Voir le produit</button>`:""}<button class="btn primary" data-act="flagdone" data-id="${f.id}">${svg("check")}Traité</button></div>`)}break;
  case"flagdone":{const f=S.flags.find(x=>x.id===id);f.done=true;save();closeSheet();render();toast("Signalement traité")}break;
  case"flagform":sheet(()=>sFlag(id));break;
  case"oprep":{const o=S.orders.find(x=>x.id===id);o.status="Préparée";save();missionDone("order");render();toast("Commande "+o.no+" préparée · prévenez le client")}break;
  case"ocancel":if(confirm("Refuser cette commande ?")){const o=S.orders.find(x=>x.id===id);o.status="Annulée";save();render()}break;
  case"odeliver":UI.opay="Espèces";sheet(()=>sDeliver(id));break;
  case"opay":UI.opay=v;saveUI();paintSheet();break;
  case"odone":{const o=S.orders.find(x=>x.id===id);for(const i of o.items){const p=prod(i.pid);if(!p||p.stock<i.qty){toast("Stock insuffisant pour "+(p?p.name:"un produit"));return}}
   const sale={id:uid(),no:Math.max(1000,...S.sales.map(s=>s.no))+1,date:today(),time:nowHM(),items:o.items.map(i=>{const p=prod(i.pid);const it={pid:p.id,name:p.name,qty:i.qty,price:p.sell,buy:p.buy};if(p.imei){it.imeis=p.imeis.slice(0,i.qty);it.warr=p.warr||0;p.imeis=p.imeis.slice(i.qty);p.stock=p.imeis.length}else p.stock-=i.qty;return it}),pay:UI.opay||"Espèces",client:(S.clients.find(c=>c.phone.replace(/\D/g,"")===o.phone.replace(/\D/g,""))||{}).id||"",seller:mode==="vend"?UI.me:"t1",disc:0};
   S.sales.push(sale);o.status="Livrée";o.doneDate=today();save();missionDone("order");sheet(()=>sReceipt(sale.id));render()}break;
  case"cprod":sheet(()=>sCProd(id));break;
  case"badd":{const p=prod(id);const b=UI.basket.find(x=>x.pid===id);const q=(b?b.qty:0)+1;if(q>p.stock){toast("Plus que "+p.stock+" disponible"+(p.stock>1?"s":""));return}if(b)b.qty=q;else UI.basket.push({pid:id,qty:1});saveUI();closeSheet();render();toast("Ajouté au panier ✓")}break;
  case"bplus":{const p=prod(id),b=UI.basket.find(x=>x.pid===id);if(b.qty+1>p.stock){toast("Plus que "+p.stock+" disponible"+(p.stock>1?"s":""));return}b.qty++;saveUI();render()}break;
  case"bminus":{const b=UI.basket.find(x=>x.pid===id);b.qty--;if(b.qty<=0)UI.basket=UI.basket.filter(x=>x!==b);saveUI();render()}break;
  case"cmode":{const keep={n:($("#of-name")||{}).value,p:($("#of-phone")||{}).value};UI.cmode=v;saveUI();render();if($("#of-name"))$("#of-name").value=keep.n||"";if($("#of-phone"))$("#of-phone").value=keep.p||""}break;
  case"notify":toast("C'est noté : la boutique vous préviendra sur WhatsApp");closeSheet();break;
  case"import":sheet(sImport);break;
  case"tpl":download("modele-import-stockpro.csv",csv([["Nom","Catégorie","Prix d'achat","Prix de vente","Stock","Seuil","Code-barres"],["Écouteurs Bluetooth","Accessoires","4500","10000","25","8","6970000000011"],["Câble USB-C 1 m","Accessoires","600","2000","40","10",""]]));toast("Modèle téléchargé");break;
  case"exportp":download("stock-"+today()+".csv",csv([["Nom","Catégorie","Prix d'achat","Prix de vente","Stock","Seuil","Code-barres","Valeur d'achat"],...S.products.map(p=>[p.name,p.cat,p.buy,p.sell,p.stock,p.min,p.code,Math.max(0,p.stock)*p.buy])]));toast("Export prêt");break;
  case"exports":{const n=+(UI.rper||30);download("ventes-"+today()+".csv",csv([["N°","Date","Heure","Articles","Paiement","Vendeur","Client","Total","Bénéfice"],...salesFrom(off(-(n-1))).map(s=>[s.no,s.date,s.time,s.items.map(i=>i.qty+" × "+i.name).join(" + "),s.pay,(mate(s.seller)||{}).name||"",(cli(s.client)||{}).name||"",total(s),Math.round(profit(s)*100)/100])]));toast("Export prêt")}break;
  case"reset":if(confirm("Remettre toutes les données d'exemple ?")){S=seed();UI={cart:[],basket:[],mode};save();saveUI();render();toast("Démo remise à zéro")}break;
 }});
function barcode(code){const s=String(code||"0000");let x=0,bars="";for(const ch of s){const d=+ch||0;[1,0,1+(d%2),0,1+(d>4?1:0),0].forEach((w,i)=>{if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w*1.4}" height="40" fill="#1d2a25"/>`;x+=w*1.4+1})}return`<svg viewBox="0 0 ${x} 40" style="width:180px;height:44px;display:block;margin:6px auto 2px" aria-hidden="true">${bars}</svg>`}
function sMenu(){const adm=mode==="admin";
 return`<h2>${adm?esc(S.settings.name):"Menu"}</h2><div class="tools" style="margin-top:12px">${adm?[["fournisseurs","truck","Fournisseurs"],["clients","users","Clients"],["rapports","chart","Rapports"],["equipe","users","Équipe"],["reglages","gear","Réglages"]].concat([["stock","layers","Stock"]]).map(x=>`<button data-go="${x[0]}">${svg(x[1])}${x[2]}</button>`).join(""):[["v-vendre","cart","Vendre"],["v-stock","phone","Stock"],["v-troc","recycle","Troc"],["v-commandes","bag","Commandes"]].map(x=>`<button data-go="${x[0]}">${svg(x[1])}${x[2]}</button>`).join("")}</div>
 <div class="stack" style="margin-top:14px"><button class="btn block" data-act="logout">${svg("swap")}Changer d'espace</button><button class="btn gold block" data-act="offer">${svg("star")}PhonePro pour ma boutique</button></div>`}
function sNotifs(){const n=notifs();return`<h2>Alertes</h2><div class="card list" style="margin-top:12px">${n.map(x=>`<button class="item" ${x.go?`data-go="${x.go}"`:`data-act="${x.act}" data-id="${x.id}"${x.v?` data-v="${x.v}"`:""}`}><span class="pill ${x.c}" style="width:34px;height:34px;justify-content:center;padding:0">${svg(x.ic).replace('aria-hidden','style="width:18px;height:18px" aria-hidden')}</span><span class="grow"><span class="t" style="display:block">${esc(x.t)}</span><span class="xs muted">${esc(x.s)}</span></span></button>`).join("")||`<div class="empty">Aucune alerte 👌</div>`}</div>`}
function sOffer(){return`<div class="pitch"><div class="eyebrow">PhonePro par SACKO CONCEPT</div><h2 style="color:#fff">Votre application de boutique de téléphones, à votre nom</h2><div class="small" style="opacity:.9">Nous la personnalisons avec votre logo, vos couleurs, vos téléphones et accessoires importés et votre catalogue en ligne. Application web dès la formule Standard, Android et iPhone avec Premium.</div></div>
 <div class="stack" style="margin-top:12px"><a class="btn primary block" href="../fcfa/">Voir les offres en francs CFA</a><a class="btn block" href="../">Voir les offres en euros</a><a class="btn block" href="../dollars/">Voir les offres en dollars</a>${waBtn("15054642331","Bonjour Hawa, j'ai testé la démo PhonePro et je souhaite un devis pour ma boutique.\nNom de la boutique : \nVille et pays : \nNombre de boutiques : \nTroc et rachat d'occasions (oui/non) : ","Demander mon devis sur WhatsApp","gold block")}</div>`}

/* ================= DÉMARRAGE ================= */
const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp||!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(sp){if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2400)}}
view=location.hash.slice(1);syncMode();render();
})();

</script>
