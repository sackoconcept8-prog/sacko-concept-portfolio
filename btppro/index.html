<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#1F2A37;--mut:#6B7280;--line:#E8E4DB;--acc:#E8730C;--acc2:#FFF1E3;--ok:#15803D;--okb:#E7F6EC;--warn:#B45309;--warnb:#FEF3C7;--bad:#B91C1C;--badb:#FDE8E8;--blue:#1D4ED8;--blueb:#E6EEFF}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3,.brand{font-family:Sora,Inter,sans-serif;margin:0}
button{font-family:inherit;cursor:pointer}
/* splash */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#fff 0%,#FFF1E3 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.logo{width:96px;height:96px;border-radius:26px;background:var(--acc);display:grid;place-items:center;box-shadow:0 18px 40px rgba(232,115,12,.35);animation:pop 1.1s ease}
.logo svg{width:58px;height:58px}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
#splash h1{font-size:34px;margin-top:22px}#splash h1 span{color:var(--acc)}
#splash p{color:var(--mut);margin:6px 0 0}
.road{width:220px;height:8px;border-radius:8px;background:#2B3440;margin-top:28px;position:relative;overflow:hidden}
.road:after{content:"";position:absolute;top:3px;left:-60%;width:60%;height:2px;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 26px);animation:run 1.4s linear infinite}
@keyframes run{to{left:100%}}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{max-width:880px;width:100%}
.loginbox .top{text-align:center;margin-bottom:26px}
.loginbox h1{font-size:30px}.loginbox h1 span{color:var(--acc)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.role{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;transition:.15s}
.role:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,42,55,.08)}
.role .ic{width:42px;height:42px;border-radius:12px;background:var(--acc2);display:grid;place-items:center;font-size:20px;margin-bottom:10px}
.role b{display:block;font-size:15px;font-family:Sora}.role small{color:var(--mut)}
/* app */
#app{display:none;min-height:100vh}
.side{width:240px;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column}
.brand{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center}.brand i svg{width:20px;height:20px}
.brand span{color:var(--acc)}
.co{color:var(--mut);font-size:12px;margin:0 0 18px 44px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--ink);text-align:left;font-weight:500}
.nav button:hover{background:var(--bg)}.nav button.on{background:var(--acc2);color:#9A4A04;font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.me small{color:var(--mut);display:block}
.me button{margin-top:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:13px}
main{margin-left:240px;padding:26px 30px 60px;max-width:1280px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:24px}.head p{margin:4px 0 0;color:var(--mut)}
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;border-radius:10px;padding:10px 16px;font-size:14px}
.btn.sm{padding:6px 10px;font-size:12px}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.c2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.kpi small{color:var(--mut);font-weight:500}.kpi b{display:block;font-family:Sora;font-size:26px;margin:4px 0 2px}.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-blue{background:var(--blueb);color:var(--blue)}.c-g{background:#F0EEE8;color:#555}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #F1EEE7;vertical-align:middle}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.bar{height:8px;background:#EFECE5;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--acc)}
.bar.g i{background:var(--ok)}.bar.b i{background:var(--blue)}.bar.r i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F1EEE7}.alert:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.proj{cursor:pointer;transition:.15s}.proj:hover{border-color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:12px}
/* linéaire */
.lin{margin-top:6px}.lin .l{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:9px 0}
.track{height:16px;background:#EFECE5;border-radius:5px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.pk{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;font-size:11px;color:var(--mut)}
.pk div{display:flex;justify-content:space-between}
.ouv{position:relative;height:26px;margin:0 80px 0 160px}
.ouv span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{font-size:12px;font-weight:600;color:var(--mut);display:block}
input,select,textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;background:#fff;color:var(--ink)}
.full{grid-column:1/-1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#fff;border:1px solid var(--ok);color:var(--ok);font-weight:600;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:.3s;z-index:40}
.toast.on{transform:translateX(-50%)}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:#D8D4CA;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.foot{margin-top:30px;color:var(--mut);font-size:12px;text-align:center}.foot a{color:var(--acc);font-weight:600}
@media(max-width:860px){
 .side{position:sticky;top:0;width:auto;bottom:auto;flex-direction:row;align-items:center;gap:8px;padding:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;z-index:20}
 .co,.me small{display:none}.brand{margin:0;font-size:16px}.nav{display:flex;gap:4px}.nav button{white-space:nowrap;padding:8px 10px}
 .me{margin:0;border:0;padding:0}.me b{display:none}.me button{margin:0;white-space:nowrap}
 main{margin:0;padding:18px 14px 50px}.c2{grid-template-columns:1fr}
 .lin .l,.pk{grid-template-columns:96px 1fr 52px}.ouv{margin:0 62px 0 106px}
}
</style>
</head>

}
const V={
dash(){
 const att=D.dec.filter(d=>d.st!=='Payé').reduce((s,d)=>s+d.m,0),dispo=D.engins.filter(e=>e.st==='En service'||e.st==='Disponible').length;
 const km=D.chantiers.reduce((s,c)=>s+c.c[5],0),low=D.mat.filter(m=>m.q<m.min);
 const al=[...low.map(m=>['var(--bad)',`Stock bas : ${m.n}`,`${fr(m.q)} ${m.u} restants, soit ${Math.floor(m.q/m.j)} jours de travail`]),
  ...D.engins.filter(e=>e.st==='En panne').map(e=>['var(--bad)',`Engin en panne : ${e.nom}`,`${e.code} · ${ch(e.ch).lieu} — le compactage est ralenti`]),
  ...D.dec.filter(d=>d.st==='En retard').map(d=>['var(--warn)',`Décompte ${d.n} impayé depuis ${d.j} jours`,`${F(d.m)} · ${ch(d.ch).mo}`]),
  ...D.essais.filter(e=>!e[6]).map(e=>['var(--warn)',`Essai non conforme : ${e[3]}`,`${ch(e[1]).lieu} · ${e[2]} — résultat ${e[4]} (exigé ${e[5]})`])];
 return head(`Bonjour ${ROLES[role].u}`,'Situation de l\'entreprise au 12 novembre 2026')+
 `<div class="grid k4">${kpi('Chantiers en cours',D.chantiers.length,F(D.chantiers.reduce((s,c)=>s+c.montant,0))+' de marchés')}
 ${kpi('Enrobé posé (cumul)',String(km.toFixed(1)).replace('.',',')+' km','+ 2,9 km cette semaine','up')}
 ${kpi('Engins opérationnels',dispo+' / '+D.engins.length,D.engins.length-dispo+' à l\'arrêt',dispo<D.engins.length?'wn':'up')}
 ${kpi('Décomptes à encaisser',F(att),D.dec.filter(d=>d.st==='En retard').length+' en retard de paiement','dn')}
 ${kpi('Effectif sur chantiers',fr(D.chantiers.reduce((s,c)=>s+c.eff,0)),'dont 61 % de journaliers')}
 ${kpi('Jours sans accident',D.hse.jours,'Record : 203 jours','up')}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h3>Avancement physique et financier</h3>
 ${D.chantiers.map(c=>`<div style="margin-bottom:14px"><div class="row"><b class="sm">${c.nom}</b><span class="sm mut">${c.lieu}</span></div>
 <div class="row sm" style="margin-top:6px"><span style="width:76px">Travaux</span><div class="bar" style="flex:1"><i style="width:${c.phys}%"></i></div><b style="width:38px;text-align:right">${c.phys}%</b></div>
 <div class="row sm" style="margin-top:4px"><span style="width:76px">Encaissé</span><div class="bar g" style="flex:1"><i style="width:${c.fin}%"></i></div><b style="width:38px;text-align:right">${c.fin}%</b></div></div>`).join('')}
 <p class="sm mut">Quand la barre « Travaux » dépasse « Encaissé », l'entreprise avance l'argent du chantier.</p></div>
 <div class="card"><h3>Alertes à traiter (${al.length})</h3>${al.map(a=>`<div class="alert"><i class="dot" style="background:${a[0]}"></i><div><b>${a[1]}</b><div class="sm mut">${a[2]}</div></div></div>`).join('')}</div></div>`;
},
chantiers(){
 const c=ch(sel);
 return head('Chantiers','Avancement réel, couche par couche et kilomètre par kilomètre')+
 `<div class="grid k4">${D.chantiers.map(x=>`<div class="card proj" data-act="sel" data-id="${x.id}" style="${x.id===sel?'border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)':''}"><span class="chip c-g">${x.lieu}</span><b style="display:block;margin:8px 0 10px">${x.nom}</b><div class="bar"><i style="width:${x.phys}%"></i></div><div class="row sm" style="margin-top:6px"><span class="mut">${String(x.km).replace('.',',')} km</span><b>${x.phys}%</b></div></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><div class="row" style="flex-wrap:wrap"><h3 style="margin:0">${c.nom}</h3><span class="chip c-blue">${F(c.montant)}</span></div>
 <p class="sm mut" style="margin:6px 0 12px">${c.mo} · ${c.delai} · Chef de chantier : ${c.chef} · ${c.eff} personnes</p>
 <h3>Schéma d'avancement linéaire</h3>${lineaire(c)}</div>`;
},
journal(){
 return head('Rapports journaliers','Le chef de chantier saisit sa journée depuis son téléphone, même sans connexion')+
 `<div class="card"><h3>Nouveau rapport du jour</h3><form class="f" id="fj">
 <label>Chantier<select name="ch">${D.chantiers.map(c=>`<option value="${c.id}">${c.lieu} — ${c.nom.slice(0,34)}…</option>`).join('')}</select></label>
 <label>Météo<select name="meteo"><option>Ensoleillé</option><option>Nuageux</option><option>Pluie (arrêt partiel)</option><option>Pluie (journée perdue)</option></select></label>
 <label>Couche réalisée<select name="couche">${COUCHES.map((k,i)=>`<option value="${i}">${k[0]}</option>`).join('')}</select></label>
 <label>Du PK (km)<input name="de" type="number" step="0.1" value="28" required></label>
 <label>Au PK (km)<input name="a" type="number" step="0.1" value="28.6" required></label>
 <label>Quantité (t ou m³)<input name="q" value="1 150 t" required></label>
 <label>Effectif présent<input name="eff" type="number" value="210" required></label>
 <label class="full">Observations (pannes, incidents, visites)<textarea name="obs" rows="2" placeholder="Ex. : visite de la mission de contrôle à 10 h, rien à signaler"></textarea></label>
 <div class="full"><button class="btn">Enregistrer le rapport</button></div></form></div>
 <div class="card" style="margin-top:14px"><h3>Derniers rapports</h3><div class="tw"><table><tr><th>Date</th><th>Chantier</th><th>Travaux du jour</th><th>Quantité</th><th>Effectif</th><th>Météo</th><th>Observations</th></tr>
 ${D.journal.map(j=>`<tr><td>${j.d}</td><td>${ch(j.ch).lieu}</td><td><b>${COUCHES[j.couche][0]}</b><div class="sm mut">${pkf(j.de)} → ${pkf(j.a)}</div></td><td>${j.q}</td><td>${j.eff}</td><td>${j.meteo}</td><td class="sm">${j.obs||'—'}</td></tr>`).join('')}</table></div></div>`;
},
engins(){
 const n=s=>D.engins.filter(e=>e.st===s).length;
 return head('Parc engins','Où est chaque machine, dans quel état, et quand passe-t-elle à l\'entretien')+
 `<div class="grid k4">${kpi('En service',n('En service'),'sur '+D.engins.length+' engins','up')}${kpi('En panne',n('En panne'),'chaque jour d\'arrêt coûte cher','dn')}${kpi('En maintenance',n('Maintenance'),'révisions planifiées','wn')}${kpi('Gasoil consommé / jour','6 800 L','suivi par engin, anti-vol')}</div>
 <div class="card" style="margin-top:14px"><div class="tw"><table><tr><th>Code</th><th>Engin</th><th>Chantier</th><th>Heures moteur</th><th>Prochaine révision</th><th>État</th><th></th></tr>
 ${D.engins.map((e,i)=>`<tr><td><b>${e.code}</b></td><td>${e.nom}</td><td>${ch(e.ch).lieu}</td><td>${fr(e.h)} h</td><td>${e.rev}</td><td>${stChip(e.st)}</td><td><button class="btn sm ghost" data-act="eng" data-id="${i}">${e.st==='En service'||e.st==='Disponible'?'Signaler une panne':'Remettre en service'}</button></td></tr>`).join('')}</table></div></div>`;
},
materiaux(){
 return head('Matériaux & centrale d\'enrobage','Bitume, granulats, gasoil : ne plus jamais arrêter un chantier pour une rupture')+
 `<div class="grid k4">${kpi('Production centrale (hier)','1 180 t','objectif 1 200 t / jour')}${kpi('Température moyenne','158 °C','dans la plage 150 – 170 °C','up')}${kpi('Camions livrés (hier)','47','bons de pesée enregistrés')}${kpi('Écart pesée / pose','0,8 %','seuil d\'alerte : 2 %','up')}</div>
 <div class="card" style="margin-top:14px"><h3>Stocks</h3><div class="tw"><table><tr><th>Matériau</th><th>En stock</th><th style="width:28%">Niveau</th><th>Autonomie</th><th>État</th><th>Enregistrer une livraison</th></tr>
 ${D.mat.map((m,i)=>{const low=m.q<m.min;return `<tr><td><b>${m.n}</b></td><td>${fr(m.q)} ${m.u}</td><td><div class="bar ${low?'r':'g'}"><i style="width:${Math.min(100,m.q/m.max*100)}%"></i></div></td><td>${Math.floor(m.q/m.j)} jours</td><td>${low?'<span class="chip c-bad">À commander</span>':'<span class="chip c-ok">Correct</span>'}</td><td><div class="row"><input id="liv${i}" type="number" placeholder="Quantité" style="margin:0;max-width:110px"><button class="btn sm" data-act="liv" data-id="${i}">Ajouter</button></div></td></tr>`}).join('')}</table></div></div>`;
},
personnel(){
 const p=D.equipe.filter(e=>e.ok),tot=p.reduce((s,e)=>s+e.t,0);
 return head('Personnel & pointage','Pointage des équipes sur le chantier et paie des journaliers calculée toute seule')+
 `<div class="grid k4">${kpi('Présents aujourd\'hui',p.length+' / '+D.equipe.length,'Équipe enrobés — '+ch(1).lieu)}${kpi('Paie du jour (équipe)',F(tot),'calculée d\'après le pointage')}${kpi('Effectif total',fr(D.chantiers.reduce((s,c)=>s+c.eff,0)),'4 chantiers')}${kpi('Contrats à renouveler','14','dans les 30 jours','wn')}</div>
 <div class="card" style="margin-top:14px"><h3>Pointage du 12 novembre — équipe enrobés</h3><div class="tw"><table><tr><th>Nom</th><th>Poste</th><th>Taux journalier</th><th>Présent</th></tr>
 ${D.equipe.map((e,i)=>`<tr><td><b>${e.n}</b></td><td>${e.p}</td><td>${F(e.t)}</td><td><button class="sw ${e.ok?'on':''}" data-act="pt" data-id="${i}" aria-label="Présence de ${e.n}"></button></td></tr>`).join('')}</table></div></div>`;
},
qhse(){
 return head('Qualité & sécurité','Essais de laboratoire, incidents et plaintes : tout est tracé pour la mission de contrôle')+
 `<div class="grid k4">${kpi('Jours sans accident',D.hse.jours,'tous chantiers','up')}${kpi('Essais conformes',D.essais.filter(e=>e[6]).length+' / '+D.essais.length,'sur les 5 derniers','wn')}${kpi('Causeries sécurité','22','ce mois-ci')}${kpi('Port des équipements','96 %','contrôles inopinés','up')}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h3>Essais de laboratoire</h3><div class="tw"><table><tr><th>Date</th><th>Lieu</th><th>Essai</th><th>Résultat</th><th>Exigé</th><th></th></tr>
 ${D.essais.map(e=>`<tr><td>${e[0]}</td><td>${ch(e[1]).lieu}<div class="sm mut">${e[2]}</div></td><td>${e[3]}</td><td><b>${e[4]}</b></td><td>${e[5]}</td><td>${e[6]?'<span class="chip c-ok">Conforme</span>':'<span class="chip c-bad">Non conforme</span>'}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Incidents & plaintes</h3>${D.hse.list.map(h=>`<div class="alert"><div style="flex:1"><div class="row"><b>${h[2]} — ${ch(h[1]).lieu}</b>${stChip(h[4])}</div><div class="sm mut">${h[0]} · ${h[3]}</div></div></div>`).join('')}</div></div>`;
},
finances(){
 const s=st=>D.dec.filter(d=>d.st===st).reduce((a,d)=>a+d.m,0);
 return head('Décomptes & finances','Savoir à tout moment ce que chaque maître d\'ouvrage vous doit',`<button class="btn" data-act="newdec">+ Générer le décompte de novembre</button>`)+
 `<div class="grid k4">${kpi('Carnet de commandes',F(D.chantiers.reduce((a,c)=>a+c.montant,0)),'4 marchés en cours')}${kpi('En attente de paiement',F(s('En attente')),'dans les délais','wn')}${kpi('En retard de paiement',F(s('En retard')),'relances à faire','dn')}${kpi('Encaissé (2 derniers mois)',F(s('Payé')),'','up')}</div>
 <div class="card" style="margin-top:14px"><div class="tw"><table><tr><th>Décompte</th><th>Chantier</th><th>Période</th><th>Montant</th><th>Statut</th><th>Délai</th><th></th></tr>
 ${D.dec.map((d,i)=>`<tr><td><b>${d.n}</b></td><td>${ch(d.ch).lieu}<div class="sm mut">${ch(d.ch).mo}</div></td><td>${d.p}</td><td><b>${F(d.m)}</b></td><td>${stChip(d.st)}</td><td>${d.st==='Payé'||d.st==='Brouillon'?'—':d.j+' jours'}</td><td>${d.st==='Payé'?'':d.st==='Brouillon'?`<button class="btn sm" data-act="send" data-id="${i}">Transmettre</button>`:`<button class="btn sm ghost" data-act="pay" data-id="${i}">Marquer payé</button>`}</td></tr>`).join('')}</table></div>
 <p class="sm mut" style="margin:12px 0 0">Le décompte est calculé à partir des quantités saisies dans les rapports journaliers : plus de ressaisie, plus d'oubli.</p></div>`;
},
client(){
 const c=ch(1),dd=D.dec.filter(d=>d.ch===1);
 return head(c.nom,`Espace réservé au maître d'ouvrage et à la mission de contrôle — ${c.mo}`)+
 `<div class="grid k4">${kpi('Avancement des travaux',c.phys+' %','délai consommé : 58 %','up')}${kpi('Enrobé posé',String(c.c[5]).replace('.',',')+' km','sur '+c.km+' km')}${kpi('Essais conformes','98 %','214 essais réalisés','up')}${kpi('Jours sans accident',D.hse.jours,'','up')}</div>
 <div class="card" style="margin-top:14px"><h3>Avancement par couche</h3>${lineaire(c)}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h3>Décomptes</h3><table><tr><th>N°</th><th>Période</th><th>Montant</th><th>Statut</th></tr>${dd.map(d=>`<tr><td><b>${d.n}</b></td><td>${d.p}</td><td>${F(d.m)}</td><td>${stChip(d.st)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Documents du marché</h3>${['Ordre de service de démarrage','Planning d\'exécution — révision 3','PV de réunion de chantier n° 41','Rapport mensuel — octobre 2026','Plan d\'assurance qualité'].map(x=>`<div class="alert"><span>📄</span><div style="flex:1">${x}</div><span class="chip c-g">PDF</span></div>`).join('')}</div></div>`;
}};

function toast(t){const e=$('#toast');e.textContent='✓ '+t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function render(){
 $('#nav').innerHTML=ROLES[role].nav.map(n=>`<button class="${n===view?'on':''}" data-act="nav" data-id="${n}"><span>${NAV[n][0]}</span>${NAV[n][1]}</button>`).join('');
 $('#main').innerHTML=V[view]()+`<p class="foot">Démo BTP Pro — données fictives · Application conçue par <a href="https://www.sackoconcept.com">SACKO CONCEPT</a></p>`;
 const f=$('#fj');if(f)f.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
  const c=ch(+d.ch),k=+d.couche,a=Math.min(+d.a,c.km);if(a>c.c[k])c.c[k]=Math.round(a*10)/10;
  D.journal.unshift({d:'12 nov.',ch:+d.ch,meteo:d.meteo,couche:k,de:+d.de,a:+d.a,q:d.q,eff:+d.eff,obs:d.obs});render();toast('Rapport enregistré — l\'avancement du chantier est mis à jour')});
}
function enter(r){role=r;view=ROLES[r].nav[0];$('#uname').textContent=ROLES[r].u;$('#urole').textContent=ROLES[r].l;$('#login').style.display='none';$('#app').style.display='block';render();scrollTo(0,0)}
$('#roles').innerHTML=Object.entries(ROLES).map(([k,r])=>`<button class="role" data-act="role" data-id="${k}"><div class="ic">${r.ic}</div><b>${r.l}</b><small>${r.d}</small></button>`).join('');
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='role')return enter(id);
 if(a==='logout'){$('#app').style.display='none';$('#login').style.display='flex';return}
 if(a==='nav'){view=id;render();scrollTo(0,0);return}
 if(a==='sel'){sel=+id;render();return}
 if(a==='eng'){const g=D.engins[id],up=g.st==='En service'||g.st==='Disponible';g.st=up?'En panne':'En service';render();toast(up?'Panne signalée — l\'atelier et la direction sont prévenus':g.code+' remis en service');return}
 if(a==='liv'){const v=+$('#liv'+id).value;if(!(v>0))return toast('Saisissez une quantité');D.mat[id].q+=v;render();toast('Livraison enregistrée : + '+fr(v)+' '+D.mat[id].u);return}
 if(a==='pt'){D.equipe[id].ok=!D.equipe[id].ok;render();return}
 if(a==='pay'){D.dec[id].st='Payé';render();toast('Paiement enregistré');return}
 if(a==='send'){D.dec[id].st='En attente';D.dec[id].j=0;render();toast('Décompte transmis au maître d\'ouvrage');return}
 if(a==='newdec'){if(D.dec.some(d=>d.st==='Brouillon'))return toast('Le décompte de novembre existe déjà');D.dec.unshift({n:'N° 12',ch:1,p:'Novembre 2026',m:1.37e9,st:'Brouillon',j:0});render();toast('Décompte N° 12 calculé à partir des rapports journaliers')}
});
setTimeout(()=>$('#splash').classList.add('hide'),1900);
</script>
<script src="../sacko-config.js"></script>
<script src="../sacko-track.js"></script>
</body>
</html>
