<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D5FD1">
<title>Devis SécuriPro · SACKO CONCEPT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../assets/sacko-logo-96.png">
<link rel="apple-touch-icon" href="../assets/sacko-logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../sacko-config.js"></script>
<style>
:root{--blue:#1D5FD1;--blue2:#2F7BF0;--ink:#0F1B2D;--muted:#5E6B80;--line:#E3E9F2;--soft:#F3F7FD;--green:#14915A;--red:#D2362B;--gold:#B7791F;--goldbg:#FFF7E6;--bg:#F5F7FB}
*{box-sizing:border-box}html,body{margin:0}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.hd img{width:34px;height:34px}.hd b{font-size:14px;letter-spacing:.06em}.hd small{display:block;color:var(--muted);font-size:11px}
.hd .sp{flex:1}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.steps{max-width:980px;margin:0 auto;padding:8px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:0;background:transparent;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:30px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.steps button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#E7ECF4;font-size:12px;font-weight:800}
.steps button.done i{background:#DDF3E8;color:var(--green)}
.steps button.on{background:#EEF4FE;color:var(--blue)}.steps button.on i{background:var(--blue);color:#fff}
main{max-width:980px;margin:0 auto;padding:18px 16px 170px}
.kick{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:4px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:17px;margin:20px 0 10px}
.lead{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.ask{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:10px 13px;margin:0 0 14px;font-size:14px;color:#24314A}
.ask b{color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#33415A}
label.f em{color:var(--red);font-style:normal}
input,select,textarea{font:15px Inter,system-ui,sans-serif;color:var(--ink);border:1px solid #D5DEEB;border-radius:11px;padding:11px 12px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,209,.12)}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #D5DEEB;background:#fff;border-radius:30px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:#24314A;transition:.12s}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:13px 14px;cursor:pointer;text-align:left;transition:.12s;display:flex;gap:11px;align-items:flex-start}
.card:hover{border-color:#B9CBEA}
.card .ic{font-size:22px;line-height:1;flex:none;width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center}
.card b{display:block;font-size:14.5px}.card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.card .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid #CBD6E6;display:grid;place-items:center;font-size:12px;color:#fff}
.card.on{border-color:var(--blue);background:#F4F8FF;box-shadow:0 6px 18px rgba(29,95,209,.12)}
.card.on .ck{background:var(--blue);border-color:var(--blue)}
.card.lock{opacity:.55;cursor:default}
.card .pr{font-weight:800;color:var(--blue);font-size:13.5px;margin-top:5px}
.card .pr.inc{color:var(--green)}
.reco{background:linear-gradient(135deg,#EEF4FE,#FFFFFF);border:1.5px solid #BBD0F5;border-radius:16px;padding:14px 16px;margin-top:14px}
.reco h3{margin:0 0 6px;font-size:16px}.reco ul{margin:6px 0 0;padding-left:0;list-style:none}
.reco li{padding:5px 0;border-top:1px dashed #D5E1F4;font-size:14px}.reco li:first-child{border-top:0}
.reco li b{color:var(--blue)}
/* packs */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch}
.pack{position:relative;border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:16px 15px;display:flex;flex-direction:column;cursor:pointer;transition:.12s}
.pack.on{border:2px solid var(--blue);box-shadow:0 14px 32px rgba(29,95,209,.18);background:linear-gradient(180deg,#F5F9FF,#fff 45%)}
.pack .badge{position:absolute;top:-11px;left:14px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.04em}
.pack .nm{font-size:16px;font-weight:800}.pack .tg{font-size:12.5px;color:var(--muted);min-height:34px;margin-top:2px}
.pack .old{color:#98A2B3;text-decoration:line-through;font-weight:600;font-size:13.5px;margin-top:10px}
.pack .now{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.pack .now small{font-size:12px;color:var(--muted)}
.pack .sv{display:inline-block;background:#E2F5EC;color:var(--green);font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px;margin:6px 0 8px}
.pack ul{list-style:none;padding:0;margin:4px 0 0;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.pack li{padding:2px 0 2px 18px;position:relative}.pack li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:800}
.pack li.no{color:#9AA4B5}.pack li.no::before{content:"–";color:#B5BECC}
.pack .sel{margin-top:auto;padding-top:12px}
/* roi */
.roi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.roibox{border-radius:18px;padding:16px 18px;background:linear-gradient(135deg,#0F1B2D,#1D3A6E);color:#fff}
.roibox .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.roibox .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
.roibox .s{font-size:13.5px;opacity:.9}
.roiline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.2);font-size:13.5px}
/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;font-size:14px}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right;font-weight:700;white-space:nowrap}
.tbl tr.t td{background:var(--ink);color:#fff;font-size:16px}
.tbl tr.m td{color:var(--muted);font-size:13px}
.tbl s{color:#98A2B3}
.alert{border-radius:12px;padding:10px 13px;font-size:13.5px;margin-top:10px}
.alert.warn{background:#FDECEA;color:#9B1C12;border:1px solid #F5C2BC}
.alert.ok{background:#E2F5EC;color:#0E6B42;border:1px solid #BFE6D2}
.custom{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;margin-top:8px}
.x{border:0;background:#FDECEA;color:var(--red);border-radius:10px;cursor:pointer;font-size:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
/* price bar */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(15,27,45,.07);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pbar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center}
.pbar .pr{flex:1;min-width:0;cursor:pointer}
.pbar .l1{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .l2{display:flex;align-items:baseline;gap:6px 8px;flex-wrap:wrap}.pbar .l2 b{white-space:nowrap}
.pbar .l2 s{color:#98A2B3;font-size:13px;font-weight:600}
.pbar .l2 b{font-size:21px;letter-spacing:-.02em}
.pbar .l2 .sv{font-size:11.5px;font-weight:700;color:var(--green);background:#E2F5EC;border-radius:20px;padding:2px 8px}
.offer{display:inline-flex;align-items:center;gap:6px;background:var(--goldbg);color:var(--gold);border:1px solid #F1D9A6;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;display:flex;gap:10px;align-items:center}
.item .grow{flex:1;min-width:0}.item b{display:block;font-size:15.5px}.item small{color:var(--muted);font-size:12.5px}
.item .amt{font-weight:800;color:var(--blue);white-space:nowrap;font-size:14px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-int{background:#E7EFFD;color:var(--blue)}.p-rel{background:#FFF3DF;color:#A86400}.p-sig{background:#E2F5EC;color:var(--green)}.p-no{background:#EEF1F5;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:#fff;border:1px dashed #CFDAEA;border-radius:16px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.set{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.set h3{margin:0 0 8px;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.trow{display:grid;grid-template-columns:1fr 130px 130px 130px;gap:8px;align-items:center;padding:4px 0}
.trow.h{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.trow input{text-align:right;padding:8px 10px}
.trow2{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.trow2 input{text-align:right;padding:8px 10px}
/* presentation */
#pres{position:fixed;inset:0;z-index:60;background:radial-gradient(900px 600px at 85% -10%,#DCE8FC,transparent 65%),#F7F9FD;overflow:auto;display:none}
#pres.on{display:block}
.pw{max-width:860px;margin:0 auto;padding:22px 20px 40px}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:18px}.ptop img{width:42px}.ptop b{letter-spacing:.1em}.ptop small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ptop .sp{flex:1}
.ph{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
.ph span{color:var(--blue)}
.pg{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.pc h3{margin:0 0 8px;font-size:14px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.pc ul{list-style:none;padding:0;margin:0}.pc li{padding:6px 0;border-top:1px dashed var(--line);font-size:14.5px}.pc li:first-child{border-top:0}
.pc li b{display:block}
.pprice{background:linear-gradient(160deg,#1D5FD1,#163F94);color:#fff;border:0}
.pprice h3{color:#CFE0FF}
.pprice s{opacity:.7;font-size:16px}
.pprice .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0}
.pprice .sv{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-weight:700;font-size:13.5px}
.pprice .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,.18)}
.cd{display:flex;gap:8px;margin-top:12px}
.cd div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px;text-align:center}
.cd b{display:block;font-size:22px}.cd span{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#print{display:none}
@media (max-width:760px){
  .grid,.roi,.pg{grid-template-columns:1fr}.packs{grid-template-columns:1fr}
  .hd small{display:none}.tabs button{padding:7px 8px;font-size:12.5px}
  .cards{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr 92px 92px 92px;font-size:13px}.trow input{padding:7px 6px;font-size:13px}
  h1{font-size:22px}.ph{font-size:26px}.pprice .big{font-size:32px}
  .actions{grid-template-columns:1fr 1fr}
  .custom{grid-template-columns:1fr 110px 40px}
}
@media print{
  @page{size:A4;margin:12mm 14mm 20mm}
  body{background:#fff;font-size:9.4pt}
  header,main,.pbar,.toast,#pres{display:none!important}
  #print{display:block}
  .d-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--blue);padding-bottom:9px;margin-bottom:11px}
  .d-top .br{display:flex;gap:9px;align-items:center}.d-top img{width:44px}
  .d-top .br b{font-size:12pt;letter-spacing:.08em}.d-top .br small{display:block;color:var(--muted);font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase}
  .d-top h2{margin:0;font-size:20pt;color:var(--blue);text-align:right}.d-top .meta{text-align:right;font-size:8.6pt;color:var(--muted)}
  .d-par{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .d-par div{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:8.6pt}
  .d-par h4,.d-grid h4{margin:0 0 3px;font-size:7.6pt;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .d-offer{background:#FFF7E6;border:1px solid #F1D9A6;color:#8A5A00;border-radius:9px;padding:6px 10px;font-size:8.6pt;margin-bottom:8px}
  table.d{width:100%;border-collapse:collapse;font-size:8.9pt;margin-bottom:9px}
  table.d th{background:#F3F7FD;text-align:left;font-size:7.4pt;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line)}
  table.d td{padding:3.5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.d td.r,table.d th.r{text-align:right;white-space:nowrap}
  table.d s{color:#98A2B3}
  table.d tr.tot td{background:#1D5FD1;color:#fff;font-weight:800;font-size:10.5pt;border:0}
  table.d tr.sub td{color:var(--muted)}
  table.d tr.eco td{color:#14915A;font-weight:700}
  .d-inc{font-size:8pt;color:var(--muted);margin-top:2px}
  .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;break-inside:avoid}
  .d-grid>div{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:8.4pt}
  .d-grid ul{margin:0;padding-left:14px}
  .d-sig{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:9px;margin-top:8px;break-inside:avoid}
  .d-sig>div{border:1px solid var(--line);border-radius:9px;height:36mm;padding:7px 10px;font-size:8.4pt;color:var(--muted)}
  .d-sig b{color:#0F1B2D}
  .d-sign{position:relative;height:23mm}
  .d-sign img.sg{position:absolute;left:3mm;top:0;height:19mm;max-width:50mm;object-fit:contain}
  .d-sign svg{position:absolute;right:2mm;top:-4mm;width:29mm;height:29mm;transform:rotate(-9deg);opacity:.88}
  .d-sig .d-ver{display:flex;gap:7px;align-items:center;font-size:7pt;line-height:1.35;color:var(--muted)}
  .d-ver img{width:21mm;height:21mm;flex:none}.d-ver b{color:#0F1B2D;font-size:7.6pt}
  .d-foot{position:fixed;bottom:0;left:0;right:0;font-size:6.8pt;color:#7C889B;border-top:1px solid var(--line);padding-top:4px;line-height:1.45}
  .d-foot b{color:#4A5568}
}
</style>
</head>
<body>
<header>
  <div class="hd"><img src="../assets/sacko-logo-96.png" alt=""><div><b>SACKO CONCEPT</b><small>Entretien et devis SécuriPro</small></div><span class="sp"></span>
    <div class="tabs"><button id="tNew" class="on">Entretien</button><button id="tList">Devis <span id="nb"></span></button><button id="tSet">Réglages</button></div></div>

</header>

<main id="vForm"></main>

  <div class="top"><button class="btn pri" id="bNew">＋ Nouvel entretien</button><button class="btn" id="bXlsAll">⬇ Tout exporter en Excel</button><button class="btn" id="bJson">Sauvegarde</button><label class="btn" style="cursor:pointer">Restaurer<input type="file" id="fJson" accept=".json" hidden></label></div>

</main>
<main id="vSet" hidden></main>

<div class="pbar" id="pbar"><div class="in">
  <div class="pr" id="pbPrice" title="Voir le détail"></div>
  <button class="btn gold sm" id="bPres">Présenter</button>
  <button class="btn sm" id="bPrev">‹</button>
  <button class="btn pri sm" id="bNext">Suivant ›</button>
</div></div>

<div id="pres"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

 simple:{nom:"RH SécuriPro Simple",tag:"L'essentiel pour gérer efficacement vos agents",

/* =================== CALCUL =================== */
function quoteFor(pk,x=o){
  if(!PACKS[pk])return null;
  const pct=[0,+T.t2,+T.t3][AG[x.ag]?AG[x.ag][1]:0]||0;
  const vi=Math.max(1,+x.villes||1);const vpct=(vi-1)*(+T.villes||0);
  const f=1+(pct+vpct)/100;
  const of=offre();
  const baseN=+T[pk+"_n"],baseP=of?+T[pk+"_p"]:baseN;
  const L=[];
  L.push({l:PACKS[pk].nom,n:baseN,p:baseP,pack:1});
  if(pct)L.push({l:`Taille de l'agence : ${AG[x.ag][0]} agents (+${pct} %)`,n:baseN*pct/100,p:baseP*pct/100});
  if(vpct)L.push({l:`${vi} villes (+${T.villes} % par ville supplémentaire)`,n:baseN*vpct/100,p:baseP*vpct/100});
  const opts=[];(x.options||[]).forEach(id=>{const op=OPTS.find(z=>z.id===id);if(!op)return;
    if(pk==="elite"&&op.el){opts.push({l:op.nom,n:0,p:0,inc:1});return}
    if(!op.p.includes(pk))return;const v=+T["op_"+id]||0;opts.push({l:op.nom,n:v,p:v})});
  (x.custom||[]).filter(c=>c.l||+c.p).forEach(c=>opts.push({l:(c.l||"Option sur mesure")+" (sur mesure)",n:+c.p||0,p:+c.p||0}));
  L.push(...opts);
  const normal=r5(L.reduce((a,z)=>a+z.n,0));let promo=r5(L.reduce((a,z)=>a+z.p,0));
  const rem=Math.min(50,Math.max(0,+x.remise||0));const remV=r5(promo*rem/100);
  let total=promo-remV;const forced=+x.prix_force>0;if(forced)total=r5(+x.prix_force);
  const acc=+x.acompte||40;const accV=r5(total*acc/100);const solde=total-accV;
  const min=+T[pk+"_min"]*f;
  return {pk,L,normal,promo,rem,remV,total,forced,eco:normal-total,acc,accV,solde,min,below:total<min,of,heb:pk==="elite"?+T.heb_e:pk==="complet"?+T.heb_c:0};
}
function recoPack(){
  const ps=o.problemes.map(id=>PROBS.find(p=>p.id===id)).filter(Boolean);
  if((AG[o.ag]&&AG[o.ag][1]===2)||(+o.villes||1)>=3)return "elite";
  if(ps.some(p=>p.pk==="complet"))return "complet";
  return ps.length?"simple":"complet";
}
function roi(){
  const sal=+o.r_sal||+T.salaire;
  const a=(+o.r_abs||0)*sal/26;
  const c=(+o.r_contrat||0)*(+o.r_mont||0);
  const h=(+o.r_heures||0)*0.6*(+T.cout_h||0);
  const i=(+o.r_impayes||0)*0.3;
  const m=Math.round(a+c+h+i);
  const q=quoteFor(o.formule||recoPack());
  return {a,c,h,i,m,mois:m&&q?Math.max(1,Math.ceil(q.total/m)):0,an3:m*36-(q?q.total:0)};
}
function echeancier(q){
  const d0=new Date((o.date_rdv||today())+"T12:00");const rec=new Date(d0);rec.setDate(rec.getDate()+42);
  const out=[{l:`Acompte à la signature (${q.acc} %)`,d:"À la signature",v:q.accV}];
  const n=o.solde==="2"?2:o.solde==="3"?3:1;const part=r5(q.solde/n);
  for(let i=0;i<n;i++){const d=new Date(rec);d.setMonth(d.getMonth()+i);
    out.push({l:n===1?"Solde à la réception (procès-verbal)":`Échéance ${i+1} sur ${n}${i===0?" (réception)":""}`,d:d.toLocaleDateString("fr-FR"),v:i===n-1?q.solde-part*(n-1):part})}
  return out;
}

function initSig(){const c=$("#sig"),x=c.getContext("2d");x.lineWidth=5;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0F2A6B";let dn=false,last=null;
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{dn=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!dn)return;const p=pt(e);x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p};c.onpointerup=()=>dn=false;
  const old=lj("sacko_sig","");if(old){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=old;$("#sigSt").textContent="Signature enregistrée ✓"}
  $("#sigClr").onclick=()=>{x.clearRect(0,0,c.width,c.height);sj("sacko_sig","");$("#sigSt").textContent="Signature effacée"};
  $("#sigOk").onclick=()=>{sj("sacko_sig",c.toDataURL("image/png"));$("#sigSt").textContent="Signature enregistrée ✓";toast("Signature enregistrée")}}

function doWa(){
  if(!save(true)){toast("Indiquez d'abord la raison sociale du client");go(0);return}
  const pk=o.formule||recoPack();const q=quoteFor(pk);const prenom=(o.dir_nom||"").trim();
  const msg=`Bonjour${prenom?" "+prenom:""},\n\nMerci pour notre échange. Voici votre devis SécuriPro *${o.num}* :\n\n• Formule : ${PACKS[pk].nom}\n${q.eco>0?`• Prix normal : ${fcfa(q.normal)}\n`:""}• *Votre prix : ${fcfa(q.total)}*${q.eco>0?`\n• Économie : ${fcfa(q.eco)}`:""}\n• Acompte à la signature (${q.acc} %) : ${fcfa(q.accV)}\n${q.of?`\n🎁 ${T.offre_nom}, valable jusqu'au ${q.of.fin.toLocaleDateString("fr-FR")}.\n`:""}\nJe vous envoie le devis en PDF. Démo : sackoconcept.com/cgsp\n\nHawa Sacko · SACKO CONCEPT\n+229 01 57 23 63 73`;
  const tel=(o.dir_tel||"").replace(/[^\d]/g,"");
  open((tel?`https://wa.me/${tel}?text=`:"https://wa.me/?text=")+encodeURIComponent(msg),"_blank");
}
function flat(x){const pk=x.formule||"";const q=PACKS[pk]?quoteFor(pk,x):null;return {"N° devis":x.num,"Date":fd((x.maj||"").slice(0,10)),"Client":x.societe,"Décideur":x.dir_nom,"Fonction":x.dir_fct,"Téléphone":x.dir_tel,"E-mail":x.dir_email,"Ville":x.ville,"Pays":x.pays,"Agents":AG[x.ag]?AG[x.ag][0]:"","Agents (exact)":x.nb_agents,"Sites":x.sites,"Villes":x.villes,"Problèmes":(x.problemes||[]).map(id=>(PROBS.find(p=>p.id===id)||{}).l).join(", "),"Formule":PACKS[pk]?PACKS[pk].nom:"","Options":(x.options||[]).map(id=>(OPTS.find(p=>p.id===id)||{}).nom).concat((x.custom||[]).map(c=>c.l)).filter(Boolean).join(", "),"Prix normal":q?q.normal:"","Total":q?q.total:"","Remise %":x.remise,"Acompte %":x.acompte,"Paiement du solde":x.solde,"Statut":x.statut,"Relance":fd(x.relance),"Notes":x.notes}}
function xls(list,name){if(!window.XLSX){toast("Connexion internet nécessaire pour l'export Excel");return}const wb=XLSX.utils.book_new();const ws=XLSX.utils.json_to_sheet(list.map(flat));ws["!cols"]=Object.keys(flat(list[0])).map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,"Devis");XLSX.writeFile(wb,name)}
const slug=s=>String(s||"client").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"");
function doXls(){if(save(true))xls([store[cur]],`${o.num}-${slug(o.societe)}.xlsx`)}

$("#bJson").onclick=()=>{const b=new Blob([JSON.stringify({devis:store,reglages:T,num:lj(NKEY,{})},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`sauvegarde-devis-${today()}.json`;a.click()};
$("#fJson").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);Object.assign(store,d.devis||{});sj(KEY,store);if(d.reglages){T=Object.assign({},DEF,d.reglages);sj(TKEY,T)}if(d.num)sj(NKEY,d.num);counts();renderList();toast("Sauvegarde restaurée")}catch(x){toast("Fichier invalide")}})};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#pres").classList.remove("on")});

counts();render();
