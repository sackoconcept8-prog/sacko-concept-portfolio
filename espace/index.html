<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace de gestion</title>
<link rel="icon" id="fav" href="../assets/sacko-logo-vert-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#217346;--p-l:#e5f2ea;--bg:#f5f7fa;--card:#fff;--ink:#17202b;--muted:#667085;--line:#e1e6ee;--green:#2e7d55;--green-l:#e4f3ea;--red:#b83a3a;--red-l:#fbe9e9;--amber:#a86a12;--amber-l:#fbf0d9;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{filter:brightness(.92)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-l)}
textarea.input{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.field{margin-bottom:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1 1 170px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-green{background:var(--green-l);color:var(--green)}.p-red{background:var(--red-l);color:var(--red)}.p-amber{background:var(--amber-l);color:var(--amber)}.p-grey{background:#eceff3;color:var(--muted)}.p-main{background:var(--p-l);color:var(--p)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 50px -34px rgba(20,40,80,.45);text-align:center}
.login-card .field{text-align:left}
.biglogo{width:96px;height:96px;object-fit:contain;margin:0 auto 12px;display:block}
.err{background:var(--red-l);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:left}
.by{margin-top:18px;font-size:12px;color:var(--muted)}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:25px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-size:24px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:8px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:11px 0}
.line:last-child{border-bottom:0}.line .grow{flex:1 1 180px;min-width:0}
.line.click{cursor:pointer}.line.click:hover b.n{color:var(--p)}
.av{width:38px;height:38px;border-radius:50%;background:var(--p-l);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;object-fit:cover}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;line-height:0}.avbtn:hover .av,.avbtn:focus-visible .av{box-shadow:0 0 0 3px var(--p-l)}
.bigav{width:120px;height:120px;font-size:38px;margin:0 auto 14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools .input{flex:1 1 160px;width:auto}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.steps li:last-child{border:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--p);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.idbox{background:var(--p-l);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;overflow-wrap:anywhere}
#modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;z-index:20}
#modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:100%;max-width:660px;box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h h2{font-size:19px}.box-b{padding:18px 20px}
.box-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:var(--red)}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.daybar input{width:auto}
.site-blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.site-blk h3{margin:0;font-size:16px}.poste{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;background:#fff}
.chip button{border:0;background:var(--bg);border-radius:999px;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1;color:var(--muted)}
.chip button:hover{color:var(--red)}
.gap{color:var(--red);font-weight:600;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.week button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:12px;text-align:center}
.week button.on{border-color:var(--p);box-shadow:0 0 0 2px var(--p-l)}.week b{display:block;font-size:15px}
.ok-t{color:var(--green)}.ko-t{color:var(--red)}.wa-t{color:var(--amber)}
.punch{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px}
.punch .big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.punch .bigbtn{width:100%;max-width:360px;padding:18px;font-size:18px;border-radius:14px;margin-top:14px}
.doc{font-size:14px;line-height:1.6;color:#1f2933}.doc p{margin:0 0 10px}
.doc-h{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:12px;margin-bottom:16px}
.doc-h img{width:56px;height:56px;object-fit:contain}.doc-h b{font-size:16px}
.doc-t{text-align:center;font-weight:700;font-size:16px;letter-spacing:.04em;margin:6px 0 14px}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:13px}.doc dt{color:var(--muted)}.doc dd{margin:0}
.doc .encart{padding:10px 14px;background:var(--bg);border-left:3px solid var(--p);border-radius:6px}
.doc .rep{padding:10px 14px;background:var(--green-l);border-left:3px solid var(--green);border-radius:6px}
.doc .sig{display:flex;justify-content:space-between;gap:20px;margin-top:30px;font-size:13px}
.doc h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--p)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;padding:0 5px;margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--bg)}
.scroll{overflow-x:auto}.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;border-top:2px solid var(--p);margin-top:8px;padding-top:10px}
.layout{max-width:1320px;margin:0 auto}.layout.avec{display:grid;grid-template-columns:230px minmax(0,1fr)}
#side{position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);overflow:auto;padding:14px 10px 30px;border-right:1px solid var(--line);background:#fff}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 12px 6px;font-weight:700}
#side button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
#side button:hover{background:var(--bg)}#side button.on{background:var(--p-l);color:var(--p)}
#voile{position:fixed;inset:0;background:rgba(20,30,45,.35);z-index:14}
#sos-bar{background:var(--red);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
#sos-bar .btn{background:#fff;color:var(--red);border-color:#fff}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}.seg button.on{background:var(--p-l);color:var(--p)}
.sos-btn{width:100%;border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:700;font-size:18px;padding:16px;cursor:pointer;box-shadow:0 8px 20px -10px var(--red)}
.terrain{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.terrain .btn{padding:14px;font-size:15px}
.pt-r{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.pt-r.ok{background:var(--green-l);border-color:transparent}
.photo{max-width:100%;border-radius:10px;margin-top:8px}
@media(min-width:901px){#menu-btn{display:none!important}}
@media(max-width:900px){.layout.avec{grid-template-columns:1fr}#side{position:fixed;left:0;top:0;bottom:0;height:100vh;width:270px;z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}#side.open{transform:none}}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;display:block;background:none;padding:0}.box{box-shadow:none;max-width:none}.box-h,.box-f{display:none}.box-b{padding:0}}
@media(max-width:560px){.head h1{font-size:21px}.week{grid-template-columns:repeat(7,minmax(40px,1fr));overflow-x:auto}.brand small{display:none}}
</style>
</head>
<body>

<section id="login" class="center">
  <form class="login-card" id="login-form">
    <img class="biglogo" id="lg-logo" src="../assets/sacko-logo-vert-512.png" alt="">
    <h1 id="lg-nom" style="font-size:24px">Espace de gestion</h1>
    <p class="muted sm" id="lg-sous" style="margin:4px 0 20px">Connectez-vous pour accéder à votre espace.</p>
    <div class="err hide" id="login-err"></div>
    <div class="field"><label class="f" for="l-id">E-mail ou matricule</label><input class="input" id="l-id" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label class="f" for="l-pass">Mot de passe</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" id="l-btn" style="width:100%;padding:12px">Se connecter</button>
    <div class="by">Logiciel conçu par SACKO CONCEPT</div>
  </form>
</section>

<section id="bloque" class="center hide">
  <div class="login-card">
    <img class="biglogo" id="bl-logo" src="../assets/sacko-logo-vert-512.png" alt="">
    <h1 id="bl-titre" style="font-size:22px"></h1>
    <p class="muted" id="bl-texte" style="margin:10px 0 18px"></p>
    <div class="actions" style="justify-content:center"><a class="btn pri hide" id="bl-wa" target="_blank" rel="noopener">Contacter le support (WhatsApp)</a><button class="btn" id="bl-out">Se déconnecter</button></div>
    <div class="by">Logiciel conçu par SACKO CONCEPT</div>
  </div>
</section>

<div id="app" class="hide">
  <header class="top"><div class="top-in">
    <div class="brand"><img id="hd-logo" src="../assets/sacko-logo-vert-96.png" alt=""><div style="min-width:0"><span id="hd-nom"></span><small id="hd-moi"></small></div></div>
    <button class="btn sm hide" id="menu-btn" aria-label="Menu">☰ Menu</button>
    <nav class="tabs" id="tabs"></nav>
    <button class="avbtn" id="hd-av" title="Ma photo de profil" aria-label="Ma photo de profil"></button>
    <button class="btn sm" id="logout">Déconnexion</button>
  </div></header>
  <div class="layout" id="layout"><aside id="side" class="hide"></aside><div id="voile" class="hide"></div><div style="min-width:0"><div id="sos-bar" class="hide"></div><main id="main"></main></div></div>
</div>

<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://bwiihwrdgnaqfbizudpx.supabase.co";
const SB_KEY="sb_publishable_8u8N-9EmQBMgvftQDSPpKA_97yA5AT6";
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=d=>d?new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const slugify=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const ROLES={dg:"Direction (accès complet)",rh:"Ressources humaines",superviseur:"Superviseur",agent:"Agent",client:"Client"};
const titre=c=>c.fonction?esc(c.fonction):(ROLES[c.role]||esc(c.role));
let tT;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(tT);tT=setTimeout(()=>t.className="",3400)}
function modal(title,body,foot){$("#box").innerHTML=`<div class="box-h"><h2>${title}</h2><button class="x" id="m-x" aria-label="Fermer">×</button></div><div class="box-b">${body}</div>${foot?`<div class="box-f">${foot}</div>`:""}`;$("#modal").classList.add("on");$("#m-x").onclick=closeModal;$("#modal").scrollTop=0}
function closeModal(){$("#modal").classList.remove("on");$("#box").innerHTML=""}
function traduire(m){m=String(m||"");
  if(/Nombre maximum d'agents/.test(m))return m+" Contactez SACKO CONCEPT pour augmenter votre offre.";
  if(/agents_agence_id_matricule_key/.test(m))return "Ce matricule est déjà utilisé par un autre agent.";
  if(/sites_agence_id_nom_key/.test(m))return "Un site porte déjà ce nom.";
  if(/row-level security|permission denied/i.test(m))return "Action non autorisée. Votre accès est peut-être suspendu ou expiré.";
  if(/foreign key/i.test(m))return "Suppression impossible : cet élément est encore utilisé ailleurs (planning, pointages…).";
  if(/Failed to fetch|NetworkError/i.test(m))return "Connexion Internet indisponible. Réessayez.";
  return m||"Une erreur est survenue."}
async function busy(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(traduire(e.message),true)}finally{if(btn)btn.disabled=false}}
const must=r=>{if(r.error)throw new Error(r.error.message);return r.data};

const photoUrl=p=>p?sb.storage.from("photos_profils").getPublicUrl(p).data.publicUrl:"";
const initiales=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const avatar=c=>c.photo_url?`<img class="av" src="${esc(photoUrl(c.photo_url))}" alt="">`:`<span class="av">${esc(initiales(c.nom_complet))}</span>`;
function reduire(file){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const c=Math.min(im.width,im.height),cv=document.createElement("canvas");cv.width=cv.height=400;
    cv.getContext("2d").drawImage(im,(im.width-c)/2,(im.height-c)/2,c,c,0,0,400,400);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?ok(b):ko(new Error("Photo illisible.")),"image/jpeg",.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("Ce fichier n'est pas une photo lisible."))};im.src=u})}
function majAvatar(){$("#hd-av").innerHTML=avatar(moi)}
function maPhoto(){
  modal("Ma photo de profil",`<div style="text-align:center"><div id="ph-pv">${avatar(moi).replace('class="av"','class="av bigav"')}</div><p class="muted sm" style="margin:0 0 14px">Choisissez une photo de vous, de face. Elle sera recadrée en carré automatiquement.</p>
  <div class="actions" style="justify-content:center"><label class="btn pri" style="cursor:pointer">Choisir une photo<input type="file" id="ph-f" accept="image/*" hidden></label>${moi.photo_url?`<button class="btn danger" id="ph-del">Retirer la photo</button>`:""}</div></div>`,`<button class="btn" id="ph-no">Fermer</button>`);
  $("#ph-no").onclick=closeModal;
  const poser=async chemin=>{const ancien=moi.photo_url;must(await sb.rpc("definir_ma_photo",{p_chemin:chemin}));moi.photo_url=chemin;
    const c=comptes.find(x=>x.id===moi.id);if(c)c.photo_url=chemin;if(ancien)sb.storage.from("photos_profils").remove([ancien]).then(()=>{},()=>{});majAvatar();closeModal();if(tab==="comptes")vComptes()};
  $("#ph-f").onchange=e=>{const f=e.target.files[0];if(!f)return;busy(null,async()=>{const b=await reduire(f),chemin=moi.id+"/photo-"+Date.now()+".jpg";
    must(await sb.storage.from("photos_profils").upload(chemin,b,{contentType:"image/jpeg",upsert:true}));await poser(chemin);toast("Photo enregistrée")})};
  const d=$("#ph-del");if(d)d.onclick=()=>busy(d,async()=>{await poser(null);toast("Photo retirée")});
}

/* ---------- dates et planning ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())};
const auj=()=>iso(Date.now());
const ajout=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const dowOf=ds=>new Date(ds+"T12:00:00").getDay();

const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmo=ym=>MOIS[+ym.slice(5,7)-1]+" "+ym.slice(0,4);
const dev=()=>esc((ag.parametres&&ag.parametres.devise)||"F CFA");
const fm=n=>Math.round(+n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" "+dev();
const finMois=ym=>iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));
function calcPaie(a,ym,abs,avs){const p=ag.parametres||{},base=+a.salaire_base||0,fin=new Date(finMois(ym)+"T12:00:00");
  const years=a.date_embauche?Math.max(0,Math.floor((fin-new Date(a.date_embauche+"T12:00:00"))/3.15576e10)):0;
  const anc=p.anciennete!==false&&years>=2?Math.round(base*Math.min(years,25)/100):0;
  const nuit=a.poste==="N"?+p.prime_nuit||0:0,panier=+p.prime_panier||0,resp=+((p.primes_grade||{})[a.grade])||0;
  const absNJ=abs.filter(x=>x.agent_id===a.id&&!x.justifiee).length,ret=Math.round(base/26*absNJ);
  const brut=Math.max(0,base+anc+nuit+panier+resp-ret),taux=+p.taux_cotisations||0,cot=Math.round(Math.max(0,brut-panier)*taux/100);
  const av=avs.filter(x=>x.agent_id===a.id).reduce((t,x)=>t+(+x.montant||0),0);
  return {periode:ym,base,anc,years,nuit,panier,resp,absNJ,ret,brut,taux,cot,av,net:brut-cot-av,grade:a.grade,site:siteNom(a.site_id),matricule:a.matricule,nom:nomAg(a),cnss:a.num_securite_sociale||""}}

  <dl><dt>Salarié</dt><dd>${esc(d.nom)} · ${esc(d.matricule)}</dd><dt>Emploi</dt><dd>${esc(d.grade)}${d.site?" · "+esc(d.site):""}</dd><dt>Ancienneté</dt><dd>${d.years} an(s)</dd><dt>N° sécurité sociale</dt><dd>${esc(d.cnss||"—")}</dd></dl>

  Q("[data-ann]",b=>confirmerSimple("Annuler cette facture ?","Elle restera dans l'historique avec la mention « Annulée ». Son numéro ne sera pas réutilisé.","Annuler la facture",async()=>{must(await sb.from("factures").update({statut:"Annulée"}).eq("id",b.dataset.ann));toast("Facture annulée");await vFactures()}));
}

/* ---------- demandes des clients ---------- */
async function vDemandesClients(){
  const l=must(await sb.from("demandes_clients").select("*").order("created_at",{ascending:false}).limit(100)),ST={Nouvelle:"p-red","En cours":"p-amber",Traitée:"p-green"};

  ${l.length?l.map(x=>`<div class="card"><div class="actions" style="justify-content:space-between"><div><b>${esc(x.type)}</b> · ${esc(siteNom(x.site_id))}<div class="muted xs">${fdt(x.created_at)}${x.objet?" · "+esc(x.objet):""}</div></div><span class="pill ${ST[x.statut]||"p-grey"}">${esc(x.statut)}</span></div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.message||"")}</p>
  <div class="field"><label class="f">Réponse au client</label><textarea class="input" data-rp="${x.id}">${esc(x.reponse)}</textarea></div><div class="actions"><select class="input" data-st="${x.id}" style="width:auto">${["Nouvelle","En cours","Traitée"].map(k=>`<option ${k===x.statut?"selected":""}>${k}</option>`).join("")}</select><button class="btn sm pri" data-sv="${x.id}">Enregistrer</button></div></div>`).join(""):`<div class="empty">Aucune demande de client pour le moment.</div>`}`;
  $("#main").querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>busy(b,async()=>{const id=b.dataset.sv;must(await sb.from("demandes_clients").update({reponse:$(`[data-rp="${id}"]`).value.trim()||null,statut:$(`[data-st="${id}"]`).value}).eq("id",id));toast("Demande mise à jour");await vDemandesClients();verifierAlertes().catch(()=>{})}));

/* ---------- rapports ---------- */
let moisR=null;
async function donneesMois(ym){const m1=ym+"-01",m2=finMois(ym);
  const [P,po,inc,ro,docs]=await Promise.all([chargerPlanning(m1,m2),sb.from("pointages").select("*").gte("date_service",m1).lte("date_service",m2).then(must),sb.from("incidents").select("*").gte("survenu_le",m1+"T00:00:00").lte("survenu_le",m2+"T23:59:59").then(must),sb.from("rondes").select("*").gte("date_service",m1).lte("date_service",m2).then(must),sb.from("documents_rh").select("type,agent_id,created_at").gte("created_at",m1+"T00:00:00").lte("created_at",m2+"T23:59:59").then(must)]);
  const jours=[];for(let d=m1;d<=m2&&d<=auj();d=ajout(d,1))jours.push(d);
  const att=jours.flatMap(d=>affectations(d,P,agents).map(a=>({...a,ds:d})));
  return {P,po,inc,ro,docs,att,jours}}
function classement(D){const sanc=["Avertissement","Blâme","Mise à pied"];
  return agents.filter(a=>a.statut==="Actif").map(a=>{const pts=D.po.filter(p=>p.agent_id===a.id),ret=pts.filter(p=>(new Date(p.heure_arrivee)-debutPoste(p.date_service,p.poste))/6e4>TOL()).length;
    const prevus=D.att.filter(x=>x.agent_id===a.id),manques=prevus.filter(x=>!D.po.some(p=>p.agent_id===a.id&&p.date_service===x.ds&&p.poste===x.poste)&&finPoste(x.ds,x.poste)<new Date()).length;
    const absNJ=D.P.abs.filter(x=>x.agent_id===a.id&&!x.justifiee).length,s=D.docs.filter(d=>d.agent_id===a.id&&sanc.includes(d.type)).length,r=D.ro.filter(x=>x.agent_id===a.id&&x.fin).length,i=D.inc.filter(x=>x.agent_id===a.id).length;
    const score=Math.max(0,pts.length*3+r*2+i-ret*4-manques*8-absNJ*10-s*15);
    return {a,services:pts.length,prevus:prevus.length,ret,manques,absNJ,s,r,i,score,ponct:pts.length?Math.round(100*(pts.length-ret)/pts.length):0}}).sort((x,y)=>y.score-x.score||y.ponct-x.ponct)}
async function vRapports(){moisR=moisR||auj().slice(0,7);const ym=moisR,D=await donneesMois(ym),C=classement(D),elig=C.filter(x=>x.services>=5&&!x.s&&!x.absNJ);
  const parSite=sites.map(s=>{const at=D.att.filter(x=>x.site_id===s.id&&finPoste(x.ds,x.poste)<new Date()),ok=at.filter(x=>D.po.some(p=>p.agent_id===x.agent_id&&p.date_service===x.ds&&p.poste===x.poste)).length;
    return {s,att:at.length,ok,taux:at.length?Math.round(100*ok/at.length):null,inc:D.inc.filter(x=>x.site_id===s.id).length,ro:D.ro.filter(x=>x.site_id===s.id).length}});
  const totAtt=parSite.reduce((t,x)=>t+x.att,0),totOk=parSite.reduce((t,x)=>t+x.ok,0),ret=D.po.filter(p=>(new Date(p.heure_arrivee)-debutPoste(p.date_service,p.poste))/6e4>TOL()).length;
  $("#main").innerHTML=`<div class="head"><div><h1>Rapport · ${esc(fmo(ym))}</h1><p class="muted sm" style="margin:2px 0 0">Calculé automatiquement à partir du planning, des pointages, des rondes, des incidents et des documents RH.</p></div><div class="actions"><input class="input" type="month" id="rp-m" value="${ym}" style="width:auto"><button class="btn" id="rp-csv">Exporter (Excel)</button></div></div>
  <div class="tiles"><div class="tile"><b>${totAtt?Math.round(100*totOk/totAtt)+" %":"—"}</b><span class="muted sm">Services assurés (${totOk}/${totAtt})</span></div><div class="tile"><b>${D.po.length}</b><span class="muted sm">Pointages</span></div><div class="tile"><b class="${ret?"wa-t":""}">${ret}</b><span class="muted sm">Retards</span></div><div class="tile"><b>${D.inc.length}</b><span class="muted sm">Incidents</span></div><div class="tile"><b>${D.ro.length}</b><span class="muted sm">Rondes</span></div></div>
  <div class="card"><h2>🏆 Meilleur agent du mois</h2>${elig.length?`<div class="line"><span class="av" style="width:52px;height:52px;font-size:18px">1</span><div class="grow"><b style="font-size:17px">${esc(nomAg(elig[0].a))}</b><div class="muted sm">${esc(elig[0].a.grade)} · ${esc(siteNom(elig[0].a.site_id))} · ${elig[0].services} services · ponctualité ${elig[0].ponct} % · ${elig[0].r} ronde(s)</div></div><button class="btn pri" id="rp-cert">Certificat</button></div>${elig.slice(1,3).map((x,i)=>`<div class="line"><span class="av">${i+2}</span><div class="grow"><b>${esc(nomAg(x.a))}</b><div class="muted xs">${x.services} services · ponctualité ${x.ponct} %</div></div></div>`).join("")}`:'<p class="muted sm" style="margin:0">Pas encore assez de pointages ce mois-ci (5 services minimum, sans absence injustifiée ni sanction).</p>'}
  <p class="muted xs" style="margin:10px 0 0">Calcul : 3 points par service pointé, 2 par ronde terminée, 1 par incident signalé ; retrait de 4 points par retard, 8 par service manqué, 10 par absence injustifiée, 15 par sanction.</p></div>
  <div class="card scroll"><h2>Par site</h2><table class="tbl"><thead><tr><th>Site</th><th class="r">Services assurés</th><th class="r">Incidents</th><th class="r">Rondes</th><th></th></tr></thead><tbody>${parSite.map(x=>`<tr><td><b>${esc(x.s.nom)}</b></td><td class="r ${x.taux!=null&&x.taux<90?"ko-t":""}">${x.taux==null?"—":x.taux+" % ("+x.ok+"/"+x.att+")"}</td><td class="r">${x.inc}</td><td class="r">${x.ro}</td><td class="r"><button class="btn sm" data-rs="${x.s.id}">Rapport client</button></td></tr>`).join("")}</tbody></table></div>
  <div class="card scroll"><h2>Par agent</h2><table class="tbl"><thead><tr><th>Agent</th><th class="r">Services</th><th class="r">Retards</th><th class="r">Manqués</th><th class="r">Abs. injust.</th><th class="r">Rondes</th><th class="r">Score</th></tr></thead><tbody>${C.map(x=>`<tr><td><b>${esc(nomAg(x.a))}</b><div class="muted xs">${esc(x.a.matricule)}</div></td><td class="r">${x.services}/${x.prevus}</td><td class="r">${x.ret}</td><td class="r ${x.manques?"ko-t":""}">${x.manques}</td><td class="r">${x.absNJ}</td><td class="r">${x.r}</td><td class="r"><b>${x.score}</b></td></tr>`).join("")}</tbody></table></div>`;
  $("#rp-m").onchange=e=>{if(e.target.value){moisR=e.target.value;vRapports().catch(x=>toast(traduire(x.message),true))}};
  $("#rp-csv").onclick=()=>{const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"',L=[["Matricule","Agent","Grade","Site","Services pointés","Services prévus","Retards","Manqués","Absences injustifiées","Sanctions","Rondes","Incidents signalés","Score"]].concat(C.map(x=>[x.a.matricule,nomAg(x.a),x.a.grade,siteNom(x.a.site_id),x.services,x.prevus,x.ret,x.manques,x.absNJ,x.s,x.r,x.i,x.score]));
    const u=URL.createObjectURL(new Blob(["﻿"+L.map(r=>r.map(c).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="rapport-"+ag.slug+"-"+ym+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
  const ce=$("#rp-cert");if(ce)ce.onclick=()=>{const x=elig[0];modal("Certificat",`<div class="doc" style="text-align:center;padding:20px 10px">${ag.logo_url?`<img src="${esc(ag.logo_url)}" alt="" style="width:80px;height:80px;object-fit:contain">`:""}<div class="doc-t" style="font-size:22px;margin-top:14px">CERTIFICAT</div><p style="font-size:16px">${esc(ag.nom_agence)} décerne le titre de</p><p style="font-size:24px;font-weight:700;color:var(--p);margin:10px 0">Meilleur agent du mois</p><p style="font-size:16px">à <b>${esc(nomAg(x.a))}</b>, ${esc(x.a.grade.toLowerCase())}</p><p>pour ${esc(fmo(ym))}, en reconnaissance de sa ponctualité (${x.ponct} %), de sa présence (${x.services} services) et de son sérieux.</p><p style="margin-top:30px">Fait ${ag.ville?"à "+esc(ag.ville)+", ":""}le ${fdl(auj())}</p><p><b>La Direction</b></p></div>`,`<button class="btn" id="ct-no">Fermer</button><button class="btn pri" id="ct-pr">Imprimer / PDF</button>`);$("#ct-no").onclick=closeModal;$("#ct-pr").onclick=()=>window.print()};
  $("#main").querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{const x=parSite.find(y=>y.s.id===b.dataset.rs),inc=D.inc.filter(i=>i.site_id===x.s.id&&i.visible_client);
    modal("Rapport client · "+esc(x.s.nom),`<div class="doc"><div class="doc-h">${ag.logo_url?`<img src="${esc(ag.logo_url)}" alt="">`:""}<div><b>${esc(ag.nom_agence)}</b><div class="muted xs">${esc([ag.raison_sociale,ag.ville].filter(Boolean).join(" · "))}</div></div></div><div class="doc-t">RAPPORT MENSUEL D'ACTIVITÉ · ${esc(fmo(ym).toUpperCase())}</div>
    <dl><dt>Client</dt><dd>${esc(x.s.client_nom||x.s.nom)}</dd><dt>Site</dt><dd>${esc(x.s.nom)}</dd></dl>
    <table class="tbl"><tbody><tr><td>Services assurés</td><td class="r"><b>${x.taux==null?"—":x.taux+" %"}</b> (${x.ok} sur ${x.att})</td></tr><tr><td>Rondes effectuées</td><td class="r">${x.ro}</td></tr><tr><td>Incidents</td><td class="r">${inc.length}</td></tr></tbody></table>
    ${inc.length?`<h4>Incidents du mois</h4>${inc.map(i=>`<p class="sm"><b>${fd(i.survenu_le)} · ${esc(i.type)}</b> (${esc(i.gravite)}) : ${esc(i.description||"")}</p>`).join("")}`:"<p>Aucun incident à signaler ce mois-ci.</p>"}
    <p class="muted xs" style="margin-top:16px">Rapport généré par le logiciel de gestion de ${esc(ag.nom_agence)}.</p></div>`,`<button class="btn" id="rc-no">Fermer</button><button class="btn pri" id="rc-pr">Imprimer / PDF</button>`);$("#rc-no").onclick=closeModal;$("#rc-pr").onclick=()=>window.print()});
}

/* ---------- espace client ---------- */
let monSite=null;
async function chargerMonSite(){if(!moi.site_id)throw new Error("Votre compte n'est relié à aucun site. Contactez votre prestataire.");
  monSite=must(await sb.from("sites").select("*").eq("id",moi.site_id).maybeSingle());if(!monSite)throw new Error("Site introuvable.");sites=[monSite];return monSite}
async function vClient(){await chargerMonSite();const ds=auj();
  const [pr,ro,inc,fa]=await Promise.all([sb.rpc("client_presences",{p_date:ds}).then(must),sb.from("rondes").select("*").eq("date_service",ds).then(must),sb.from("incidents").select("*").order("survenu_le",{ascending:false}).limit(5).then(must),sb.from("factures").select("*").eq("statut","En attente").then(must)]);
  $("#main").innerHTML=`<div class="head"><div><h1>${esc(monSite.nom)}</h1><p class="muted sm" style="margin:2px 0 0">Votre site surveillé par ${esc(ag.nom_agence)} · ${esc(fjour(ds))}</p></div></div>
  <div class="tiles"><div class="tile"><b class="ok-t">${pr.filter(x=>!x.depart).length}</b><span class="muted sm">Agent(s) en poste</span></div><div class="tile"><b>${ro.length}</b><span class="muted sm">Ronde(s) aujourd'hui</span></div><div class="tile"><b>${fa.length}</b><span class="muted sm">Facture(s) à régler</span></div></div>
  <div class="card"><h2>Présence aujourd'hui</h2>${pr.map(x=>`<div class="line"><div class="grow"><b>${esc(x.agent)}</b><div class="muted xs">${esc(x.grade)} · poste de ${esc(POSTE(x.poste).libelle.toLowerCase())}</div></div><span class="sm">arrivé à ${hm(x.arrivee)}${x.depart?" · parti à "+hm(x.depart):""}</span><span class="pill ${x.depart?"p-grey":"p-green"}">${x.depart?"Parti":"En poste"}</span></div>`).join("")||'<p class="muted sm" style="margin:0">Aucun pointage pour le moment aujourd\'hui.</p>'}</div>
  <div class="card"><h2>Derniers incidents</h2>${inc.map(x=>`<div class="line"><div class="grow"><b>${esc(x.type)}</b> <span class="pill ${GRAV[x.gravite]||"p-grey"}">${esc(x.gravite)}</span><div class="muted xs">${fdt(x.survenu_le)}</div><div class="sm">${esc(x.description||"")}</div></div></div>`).join("")||'<p class="muted sm" style="margin:0">Aucun incident.</p>'}</div>`;
}
async function vClientIncidents(){await chargerMonSite();const l=must(await sb.from("incidents").select("*").order("survenu_le",{ascending:false}).limit(100));
  $("#main").innerHTML=`<div class="head"><div><h1>Incidents</h1><p class="muted sm" style="margin:2px 0 0">Les incidents signalés sur votre site.</p></div></div>${l.length?`<div class="card">${l.map(x=>`<div class="line" style="align-items:flex-start"><div class="grow"><b>${esc(x.type)}</b> <span class="pill ${GRAV[x.gravite]||"p-grey"}">${esc(x.gravite)}</span><div class="muted xs">${fdt(x.survenu_le)} · ${esc(x.statut)}</div><div class="sm" style="white-space:pre-wrap">${esc(x.description||"")}</div></div></div>`).join("")}</div>`:`<div class="empty">Aucun incident sur votre site.</div>`}`}
async function vClientFactures(){await chargerMonSite();const l=must(await sb.from("factures").select("*").order("date_emission",{ascending:false}).limit(60));
  $("#main").innerHTML=`<div class="head"><div><h1>Factures</h1></div></div>${l.length?`<div class="card">${l.filter(f=>f.statut!=="Annulée").map(f=>{const e=etatF(f);return `<div class="line click" data-vf="${f.id}"><div class="grow"><b class="n">${esc(f.numero)}</b><div class="muted xs">${esc(/^\d{4}-\d{2}$/.test(f.periode)?fmo(f.periode):f.periode)} · échéance ${fd(f.date_echeance)}</div></div><b>${fm(f.montant)}</b><span class="pill ${e[1]}">${e[0]}</span></div>`}).join("")}</div>`:`<div class="empty">Aucune facture pour le moment.</div>`}`;
  $("#main").querySelectorAll("[data-vf]").forEach(t=>t.onclick=()=>voirFacture(l.find(f=>f.id===t.dataset.vf),monSite))}
async function vClientDemandes(){await chargerMonSite();const l=must(await sb.from("demandes_clients").select("*").order("created_at",{ascending:false}).limit(50));
  $("#main").innerHTML=`<div class="head"><div><h1>Demandes</h1><p class="muted sm" style="margin:2px 0 0">Un renfort, un remplacement, une réclamation ? Écrivez-nous ici.</p></div></div>
  <div class="card"><div class="row"><div class="field"><label class="f">Type de demande</label><select class="input" id="cd-t"><option>Renfort ponctuel</option><option>Remplacement d'un agent</option><option>Réclamation</option><option>Autre</option></select></div><div class="field"><label class="f">Objet</label><input class="input" id="cd-o"></div></div><div class="field"><label class="f">Message</label><textarea class="input" id="cd-m"></textarea></div><button class="btn pri" id="cd-ok">Envoyer</button></div>
  ${l.length?`<div class="card"><h2>Vos demandes</h2>${l.map(x=>`<div class="line" style="align-items:flex-start"><div class="grow"><b>${esc(x.type)}</b>${x.objet?" · "+esc(x.objet):""}<div class="muted xs">${fdt(x.created_at)}</div><div class="sm" style="white-space:pre-wrap">${esc(x.message||"")}</div>${x.reponse?`<div class="idbox" style="margin:8px 0 0"><b>Réponse :</b> ${esc(x.reponse)}</div>`:""}</div><span class="pill ${x.statut==="Traitée"?"p-green":x.statut==="En cours"?"p-main":"p-amber"}">${esc(x.statut)}</span></div>`).join("")}</div>`:""}`;
  $("#cd-ok").onclick=()=>busy($("#cd-ok"),async()=>{const m=$("#cd-m").value.trim();if(m.length<3){$("#cd-m").focus();throw new Error("Écrivez votre message.")}
    must(await sb.from("demandes_clients").insert({site_id:monSite.id,type:$("#cd-t").value,objet:$("#cd-o").value.trim()||null,message:m,statut:"Nouvelle"}));toast("Demande envoyée");await vClientDemandes()})}

/* ---------- journal des erreurs + démarrage ---------- */
let nbErr=0;
function noterErreur(m){if(!moi||nbErr++>4)return;try{sb.from("logs_erreurs").insert({page:tab,erreur_technique:String(m).slice(0,3000)}).then(()=>{},()=>{})}catch(_){}}
window.addEventListener("error",e=>noterErreur((e.message||"")+" @ "+(e.filename||"").split("/").pop()+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>noterErreur("Promesse : "+((e.reason&&e.reason.message)||e.reason)));
(async()=>{
  if(slug){try{const r=await sb.rpc("agence_publique",{p_slug:slug});if(r.data)habiller(r.data)}catch(_){}}
  const {data}=await sb.auth.getSession();if(data&&data.session)await entrer();else showLogin();
})();
</script>
