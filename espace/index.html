<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace de gestion</title>
<link rel="icon" id="fav" href="../assets/sacko-logo-vert-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#217346;--p-l:#e5f2ea;--bg:#f5f7fa;--card:#fff;--ink:#17202b;--muted:#667085;--line:#e1e6ee;--green:#2e7d55;--green-l:#e4f3ea;--red:#b83a3a;--red-l:#fbe9e9;--amber:#a86a12;--amber-l:#fbf0d9;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{filter:brightness(.92)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-l)}
textarea.input{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.field{margin-bottom:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1 1 170px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-green{background:var(--green-l);color:var(--green)}.p-red{background:var(--red-l);color:var(--red)}.p-amber{background:var(--amber-l);color:var(--amber)}.p-grey{background:#eceff3;color:var(--muted)}.p-main{background:var(--p-l);color:var(--p)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 50px -34px rgba(20,40,80,.45);text-align:center}
.login-card .field{text-align:left}
.biglogo{width:96px;height:96px;object-fit:contain;margin:0 auto 12px;display:block}
.err{background:var(--red-l);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:left}
.by{margin-top:18px;font-size:12px;color:var(--muted)}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:25px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-size:24px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:8px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:11px 0}
.line:last-child{border-bottom:0}.line .grow{flex:1 1 180px;min-width:0}
.line.click{cursor:pointer}.line.click:hover b.n{color:var(--p)}
.av{width:38px;height:38px;border-radius:50%;background:var(--p-l);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;object-fit:cover}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;line-height:0}.avbtn:hover .av,.avbtn:focus-visible .av{box-shadow:0 0 0 3px var(--p-l)}
.bigav{width:120px;height:120px;font-size:38px;margin:0 auto 14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools .input{flex:1 1 160px;width:auto}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.steps li:last-child{border:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--p);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.idbox{background:var(--p-l);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;overflow-wrap:anywhere}
#modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;z-index:20}
#modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:100%;max-width:660px;box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h h2{font-size:19px}.box-b{padding:18px 20px}
.box-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:var(--red)}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.daybar input{width:auto}
.site-blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.site-blk h3{margin:0;font-size:16px}.poste{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;background:#fff}
.chip button{border:0;background:var(--bg);border-radius:999px;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1;color:var(--muted)}
.chip button:hover{color:var(--red)}
.gap{color:var(--red);font-weight:600;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.week button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:12px;text-align:center}
.week button.on{border-color:var(--p);box-shadow:0 0 0 2px var(--p-l)}.week b{display:block;font-size:15px}
.ok-t{color:var(--green)}.ko-t{color:var(--red)}.wa-t{color:var(--amber)}
.punch{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px}
.punch .big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.punch .bigbtn{width:100%;max-width:360px;padding:18px;font-size:18px;border-radius:14px;margin-top:14px}
@media(max-width:560px){.head h1{font-size:21px}.week{grid-template-columns:repeat(7,minmax(40px,1fr));overflow-x:auto}.brand small{display:none}}
</style>
</head>
<body>

<section id="login" class="center">
  <form class="login-card" id="login-form">
    <img class="biglogo" id="lg-logo" src="../assets/sacko-logo-vert-512.png" alt="">
    <h1 id="lg-nom" style="font-size:24px">Espace de gestion</h1>
    <p class="muted sm" id="lg-sous" style="margin:4px 0 20px">Connectez-vous pour accéder à votre espace.</p>
    <div class="err hide" id="login-err"></div>
    <div class="field"><label class="f" for="l-id">E-mail ou matricule</label><input class="input" id="l-id" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label class="f" for="l-pass">Mot de passe</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" id="l-btn" style="width:100%;padding:12px">Se connecter</button>
    <div class="by">Logiciel conçu par SACKO CONCEPT</div>
  </form>
</section>

<section id="bloque" class="center hide">
  <div class="login-card">
    <img class="biglogo" id="bl-logo" src="../assets/sacko-logo-vert-512.png" alt="">
    <h1 id="bl-titre" style="font-size:22px"></h1>
    <p class="muted" id="bl-texte" style="margin:10px 0 18px"></p>
    <div class="actions" style="justify-content:center"><a class="btn pri hide" id="bl-wa" target="_blank" rel="noopener">Contacter le support (WhatsApp)</a><button class="btn" id="bl-out">Se déconnecter</button></div>
    <div class="by">Logiciel conçu par SACKO CONCEPT</div>
  </div>
</section>

<div id="app" class="hide">
  <header class="top"><div class="top-in">
    <div class="brand"><img id="hd-logo" src="../assets/sacko-logo-vert-96.png" alt=""><div style="min-width:0"><span id="hd-nom"></span><small id="hd-moi"></small></div></div>
    <nav class="tabs" id="tabs"></nav>
    <button class="avbtn" id="hd-av" title="Ma photo de profil" aria-label="Ma photo de profil"></button>
    <button class="btn sm" id="logout">Déconnexion</button>
  </div></header>
  <main id="main"></main>
</div>

<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://bwiihwrdgnaqfbizudpx.supabase.co";
const SB_KEY="sb_publishable_8u8N-9EmQBMgvftQDSPpKA_97yA5AT6";
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=d=>d?new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const slugify=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const ROLES={dg:"Direction (accès complet)",rh:"Ressources humaines",superviseur:"Superviseur",agent:"Agent",client:"Client"};
const titre=c=>c.fonction?esc(c.fonction):(ROLES[c.role]||esc(c.role));
let tT;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(tT);tT=setTimeout(()=>t.className="",3400)}
function modal(title,body,foot){$("#box").innerHTML=`<div class="box-h"><h2>${title}</h2><button class="x" id="m-x" aria-label="Fermer">×</button></div><div class="box-b">${body}</div>${foot?`<div class="box-f">${foot}</div>`:""}`;$("#modal").classList.add("on");$("#m-x").onclick=closeModal;$("#modal").scrollTop=0}
function closeModal(){$("#modal").classList.remove("on");$("#box").innerHTML=""}
function traduire(m){m=String(m||"");
  if(/Nombre maximum d'agents/.test(m))return m+" Contactez SACKO CONCEPT pour augmenter votre offre.";
  if(/agents_agence_id_matricule_key/.test(m))return "Ce matricule est déjà utilisé par un autre agent.";
  if(/sites_agence_id_nom_key/.test(m))return "Un site porte déjà ce nom.";
  if(/row-level security|permission denied/i.test(m))return "Action non autorisée. Votre accès est peut-être suspendu ou expiré.";
  if(/foreign key/i.test(m))return "Suppression impossible : cet élément est encore utilisé ailleurs (planning, pointages…).";
  if(/Failed to fetch|NetworkError/i.test(m))return "Connexion Internet indisponible. Réessayez.";
  return m||"Une erreur est survenue."}
async function busy(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(traduire(e.message),true)}finally{if(btn)btn.disabled=false}}
const must=r=>{if(r.error)throw new Error(r.error.message);return r.data};

const photoUrl=p=>p?sb.storage.from("photos_profils").getPublicUrl(p).data.publicUrl:"";
const initiales=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const avatar=c=>c.photo_url?`<img class="av" src="${esc(photoUrl(c.photo_url))}" alt="">`:`<span class="av">${esc(initiales(c.nom_complet))}</span>`;
function reduire(file){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const c=Math.min(im.width,im.height),cv=document.createElement("canvas");cv.width=cv.height=400;
    cv.getContext("2d").drawImage(im,(im.width-c)/2,(im.height-c)/2,c,c,0,0,400,400);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?ok(b):ko(new Error("Photo illisible.")),"image/jpeg",.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("Ce fichier n'est pas une photo lisible."))};im.src=u})}
function majAvatar(){$("#hd-av").innerHTML=avatar(moi)}
function maPhoto(){
  modal("Ma photo de profil",`<div style="text-align:center"><div id="ph-pv">${avatar(moi).replace('class="av"','class="av bigav"')}</div><p class="muted sm" style="margin:0 0 14px">Choisissez une photo de vous, de face. Elle sera recadrée en carré automatiquement.</p>
  <div class="actions" style="justify-content:center"><label class="btn pri" style="cursor:pointer">Choisir une photo<input type="file" id="ph-f" accept="image/*" hidden></label>${moi.photo_url?`<button class="btn danger" id="ph-del">Retirer la photo</button>`:""}</div></div>`,`<button class="btn" id="ph-no">Fermer</button>`);
  $("#ph-no").onclick=closeModal;
  const poser=async chemin=>{const ancien=moi.photo_url;must(await sb.rpc("definir_ma_photo",{p_chemin:chemin}));moi.photo_url=chemin;
    const c=comptes.find(x=>x.id===moi.id);if(c)c.photo_url=chemin;if(ancien)sb.storage.from("photos_profils").remove([ancien]).then(()=>{},()=>{});majAvatar();closeModal();if(tab==="comptes")vComptes()};
  $("#ph-f").onchange=e=>{const f=e.target.files[0];if(!f)return;busy(null,async()=>{const b=await reduire(f),chemin=moi.id+"/photo-"+Date.now()+".jpg";
    must(await sb.storage.from("photos_profils").upload(chemin,b,{contentType:"image/jpeg",upsert:true}));await poser(chemin);toast("Photo enregistrée")})};
  const d=$("#ph-del");if(d)d.onclick=()=>busy(d,async()=>{await poser(null);toast("Photo retirée")});
}

/* ---------- dates et planning ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())};
const auj=()=>iso(Date.now());
const ajout=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const dowOf=ds=>new Date(ds+"T12:00:00").getDay();
const fjour=ds=>new Date(ds+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fjourc=ds=>new Date(ds+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"});
const hm=t=>t?new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"—";
const POSTE=c=>{const p=((ag&&ag.parametres&&ag.parametres.postes)||[]).find(x=>x.code===c)||{};return {code:c,libelle:p.libelle||(c==="N"?"Nuit":"Jour"),debut:p.debut||(c==="N"?"19:00":"07:00"),fin:p.fin||(c==="N"?"07:00":"19:00")}};
const debutPoste=(ds,c)=>new Date(ds+"T"+POSTE(c).debut+":00");
const finPoste=(ds,c)=>{const p=POSTE(c),f=new Date(ds+"T"+p.fin+":00");if(p.fin<=p.debut)f.setDate(f.getDate()+1);return f};
const TOL=()=>+((ag&&ag.parametres&&ag.parametres.tolerance_retard)??15);
const nomAg=a=>a?[a.prenom,a.nom].filter(Boolean).join(" "):"Agent supprimé";
const AG_=id=>agents.find(a=>a.id===id);
function distance(a,b,c,d){if([a,b,c,d].some(x=>x==null||x===""))return null;const R=6371e3,r=x=>x*Math.PI/180,dl=r(c-a),dg=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
async function chargerPlanning(d1,d2,agentId){
  let p=sb.from("plannings").select("*").gte("date_service",d1).lte("date_service",d2),
      ab=sb.from("absences").select("*").gte("date_absence",d1).lte("date_absence",d2),
      co=sb.from("conges").select("*").eq("statut","Validée").lte("date_debut",d2).gte("date_fin",d1);
  if(agentId){p=p.eq("agent_id",agentId);ab=ab.eq("agent_id",agentId);co=co.eq("agent_id",agentId)}
  const [a,b,c]=await Promise.all([p,ab,co]);return {plan:must(a),abs:must(b),cong:must(c)};
}
function indispo(P,id,ds){const a=P.abs.find(x=>x.agent_id===id&&x.date_absence===ds);if(a)return {t:a.type||"Absence",abs:a};
  const c=P.cong.find(x=>x.agent_id===id&&x.date_debut<=ds&&x.date_fin>=ds);if(c)return {t:c.type||"Congé"};return null}
function affectations(ds,P,liste){const dow=dowOf(ds),out=[];
  liste.filter(a=>a.statut==="Actif"&&a.site_id&&a.poste).forEach(a=>{if(a.jour_repos!=null&&+a.jour_repos===dow)return;if(indispo(P,a.id,ds))return;
    out.push({agent_id:a.id,site_id:a.site_id,poste:a.poste,type:"titulaire"})});
  P.plan.filter(x=>x.date_service===ds).forEach(x=>{if(indispo(P,x.agent_id,ds))return;if(out.some(o=>o.agent_id===x.agent_id&&o.poste===x.poste))return;
    out.push({agent_id:x.agent_id,site_id:x.site_id,poste:x.poste,type:"remplacement",id:x.id})});
  return out}

/* ---------- état ---------- */
let slug=(new URLSearchParams(location.search).get("a")||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
try{if(!slug)slug=localStorage.getItem("espace-slug")||""}catch(_){}
let ctx=null,ag=null,moi=null,sites=[],agents=[],comptes=[],tab="accueil",fAg={q:"",site:"",statut:"Actif"};
const estDirection=()=>moi&&(moi.role==="dg"||moi.role==="rh");
const estEncadrement=()=>estDirection()||(moi&&moi.role==="superviseur");
const emailAgent=mat=>slugify(mat)+"@"+ag.slug+".agents.sackoconcept.com";
const siteNom=id=>(sites.find(s=>s.id===id)||{}).nom||"Sans affectation";

function habiller(a){if(!a)return;
  const r=document.documentElement.style;if(/^#[0-9a-f]{6}$/i.test(a.couleur_principale||"")){r.setProperty("--p",a.couleur_principale);r.setProperty("--p-l",a.couleur_principale+"1c")}
  if(a.logo_url){["#lg-logo","#bl-logo","#hd-logo"].forEach(s=>$(s).src=a.logo_url);$("#fav").href=a.logo_url}
  const nom=a.nom||a.nom_agence;if(nom){$("#lg-nom").textContent=nom;$("#hd-nom").textContent=nom;document.title=nom+" · Espace de gestion"}
  if(a.devise||a.raison_sociale)$("#lg-sous").textContent=a.devise||a.raison_sociale;
}

async function appel(body){

  $("#main").innerHTML=`<div class="head"><div><h1>Pointage</h1><p class="muted sm" style="margin:2px 0 0">Les heures sont celles du serveur : un agent ne peut pas les modifier.</p></div>${dir?'<button class="btn" id="pt-csv">Exporter le mois (Excel)</button>':""}</div>
  <div class="daybar"><button class="btn sm" id="pt-prev">‹</button><input class="input" type="date" id="pt-d" value="${ds}"><button class="btn sm" id="pt-next">›</button><button class="btn sm" id="pt-auj">Aujourd'hui</button></div>
  <div class="tiles"><div class="tile"><b>${lignes.length}</b><span class="muted sm">Attendus</span></div><div class="tile"><b class="ok-t">${n("ok")}</b><span class="muted sm">À l'heure</span></div><div class="tile"><b class="wa-t">${n("ret")}</b><span class="muted sm">En retard</span></div><div class="tile"><b class="ko-t">${n("np")}</b><span class="muted sm">Pas pointé</span></div></div>
  ${lignes.length?`<div class="card">${lignes.map(l=>{const a=AG_(l.agent_id),e=etat(l),pt=l.pt,s=sites.find(x=>x.id===l.site_id)||{},loin=pt&&pt.distance_m!=null&&pt.distance_m>(+s.rayon_m||300);
    return `<div class="line"><div class="grow"><b>${esc(nomAg(a))}</b><div class="muted xs">${esc(siteNom(l.site_id))} · ${esc(POSTE(l.poste).libelle.toLowerCase())} ${POSTE(l.poste).debut}–${POSTE(l.poste).fin}${l.type!=="titulaire"?" · "+esc(l.type):""}</div>
      ${pt?`<div class="xs">Arrivée <b>${hm(pt.heure_arrivee)}</b> · départ <b>${hm(pt.heure_depart)}</b>${pt.distance_m!=null?` · <span class="${loin?"ko-t":"muted"}">à ${pt.distance_m} m du site</span>`:pt.mode==="application"?' · <span class="muted">sans position</span>':""}${pt.mode==="secours"?' · <span class="wa-t">saisie manuelle</span>':""}${pt.note?` · <span class="muted">${esc(pt.note)}</span>`:""}</div>`:""}</div>
      <span class="pill ${e[1]}">${e[0]}</span>
      ${dir?(pt?`<button class="btn sm" data-corr="${pt.id}">Corriger</button>`:`<button class="btn sm" data-man="${l.agent_id}|${l.site_id}|${l.poste}">Saisir</button><button class="btn sm" data-abs2="${l.agent_id}">Absent</button>`)
        :sup?(pt?(pt.mode==="secours"&&!pt.heure_depart?`<button class="btn sm" data-sdep="${pt.id}">Pointer son départ</button>`:""):`<button class="btn sm pri" data-ssec="${l.agent_id}|${l.site_id}|${l.poste}">Pointer pour lui</button>`):""}</div>`}).join("")}</div>`
  :`<div class="empty">Aucun agent prévu ce jour-là.</div>`}`;
  const go=d=>{jourT=d;vPointage().catch(e=>toast(traduire(e.message),true))};
  $("#pt-prev").onclick=()=>go(ajout(ds,-1));$("#pt-next").onclick=()=>go(ajout(ds,1));$("#pt-auj").onclick=()=>go(auj());$("#pt-d").onchange=e=>e.target.value&&go(e.target.value);
  const Q=(sel,f)=>$("#main").querySelectorAll(sel).forEach(b=>b.onclick=()=>f(b));
  Q("[data-man]",b=>{const [ag_,si,c]=b.dataset.man.split("|");saisieManuelle(ds,{agent_id:ag_,site_id:si,poste:c})});
  Q("[data-corr]",b=>saisieManuelle(ds,po.find(p=>p.id===b.dataset.corr)));
  Q("[data-abs2]",b=>declarerAbsence(b.dataset.abs2,ds,vPointage));
  Q("[data-ssec]",b=>{const [ag_,si,c]=b.dataset.ssec.split("|"),a=AG_(ag_);
    confirmerSimple("Pointage de secours · "+esc(nomAg(a)),"À utiliser quand l'agent ne peut pas pointer lui-même (téléphone en panne, pas de réseau). L'heure enregistrée sera celle de maintenant, et la direction verra que c'est vous qui avez pointé.","Pointer maintenant",
      async()=>{must(await sb.from("pointages").insert({agent_id:ag_,site_id:si,poste:c,date_service:ds,mode:"secours"}));toast("Pointage enregistré");await vPointage()})});
  Q("[data-sdep]",b=>busy(b,async()=>{must(await sb.from("pointages").update({heure_depart:new Date().toISOString()}).eq("id",b.dataset.sdep));toast("Départ enregistré");await vPointage()}));
  const csv=$("#pt-csv");if(csv)csv.onclick=()=>busy(csv,()=>exporterPointages(ds.slice(0,7)));
}
function confirmerSimple(titre,texte,label,fn){modal(titre,`<p style="margin-top:0">${texte}</p>`,`<button class="btn" id="cs-no">Annuler</button><button class="btn pri" id="cs-ok">${label}</button>`);
  $("#cs-no").onclick=closeModal;$("#cs-ok").onclick=()=>busy($("#cs-ok"),async()=>{await fn();closeModal()})}
function saisieManuelle(ds,pt){const nouv=!pt.id,a=AG_(pt.agent_id),hhmm=t=>t?hm(t):"";
  modal((nouv?"Saisir un pointage · ":"Corriger le pointage · ")+esc(nomAg(a)),`<p class="muted sm" style="margin-top:0">${esc(siteNom(pt.site_id))} · poste de ${esc(POSTE(pt.poste).libelle.toLowerCase())} · ${esc(fjour(ds))}</p>
  <div class="row"><div class="field"><label class="f">Heure d'arrivée</label><input class="input" type="time" id="sm-a" value="${nouv?POSTE(pt.poste).debut:hhmm(pt.heure_arrivee)}"></div><div class="field"><label class="f">Heure de départ <span class="muted" style="font-weight:400">(facultatif)</span></label><input class="input" type="time" id="sm-d" value="${hhmm(pt.heure_depart)}"></div></div>
  <div class="field"><label class="f">Motif</label><input class="input" id="sm-n" value="${esc(nouv?"":pt.note||"")}" placeholder="Ex. pointage oublié, téléphone en panne"></div>
  <p class="muted sm" style="margin:0">La saisie est marquée « manuelle » pour garder une trace.</p>`,
  `${nouv?"":'<button class="btn danger" id="sm-del" style="margin-right:auto">Supprimer</button>'}<button class="btn" id="sm-no">Annuler</button><button class="btn pri" id="sm-ok">Enregistrer</button>`);
  $("#sm-no").onclick=closeModal;
  const ts=(h,depart)=>{if(!h)return null;const d=new Date(ds+"T"+h+":00");if(depart||(pt.poste==="N"&&h<POSTE("N").debut&&POSTE("N").fin<=POSTE("N").debut))if(d<=debutPoste(ds,pt.poste))d.setDate(d.getDate()+1);return d.toISOString()};
  $("#sm-ok").onclick=()=>busy($("#sm-ok"),async()=>{const h=$("#sm-a").value;if(!h)throw new Error("Indiquez l'heure d'arrivée.");
    const d={heure_arrivee:ts(h,false),heure_depart:ts($("#sm-d").value,true),note:$("#sm-n").value.trim()||"Saisie par la direction",mode:"secours"};
    if(d.heure_depart&&d.heure_depart<=d.heure_arrivee)throw new Error("L'heure de départ doit être après l'heure d'arrivée.");
    must(nouv?await sb.from("pointages").insert({...d,agent_id:pt.agent_id,site_id:pt.site_id,poste:pt.poste,date_service:ds}):await sb.from("pointages").update(d).eq("id",pt.id));
    closeModal();toast("Pointage enregistré");await vPointage()});
  const del=$("#sm-del");if(del)del.onclick=()=>busy(del,async()=>{must(await sb.from("pointages").delete().eq("id",pt.id));closeModal();toast("Pointage supprimé");await vPointage()});
}
async function exporterPointages(ym){const d1=ym+"-01",d2=iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));
  const po=must(await sb.from("pointages").select("*").gte("date_service",d1).lte("date_service",d2).order("date_service"));
  const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"',L=[["Date","Matricule","Agent","Site","Poste","Arrivée","Départ","Retard (min)","Distance (m)","Mode","Note"]];
  po.forEach(p=>{const a=AG_(p.agent_id)||{},r=Math.round((new Date(p.heure_arrivee)-debutPoste(p.date_service,p.poste))/6e4);
    L.push([p.date_service,a.matricule,nomAg(a),siteNom(p.site_id),POSTE(p.poste).libelle,hm(p.heure_arrivee),hm(p.heure_depart),r>0?r:0,p.distance_m??"",p.mode==="secours"?"Manuel":"Application",p.note||""])});
  const u=URL.createObjectURL(new Blob(["﻿"+L.map(r=>r.map(c).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");
  l.href=u;l.download="pointages-"+ag.slug+"-"+ym+".csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast(po.length+" pointage(s) exporté(s)");
}

/* ---------- espace agent ---------- */
let monAgent=null;
async function donneesAgent(){
  if(!moi.agent_id)throw new Error("Votre compte n'est relié à aucune fiche agent. Contactez votre responsable.");
  const ds=auj(),[a,s,P,po]=await Promise.all([sb.from("agents").select("*").eq("id",moi.agent_id).maybeSingle(),sb.from("sites").select("id,nom,adresse,ville,latitude,longitude,rayon_m,consignes"),
    chargerPlanning(ajout(ds,-1),ajout(ds,13),moi.agent_id),sb.from("pointages").select("*").eq("agent_id",moi.agent_id).gte("date_service",ajout(ds,-30)).order("heure_arrivee",{ascending:false})]);
  monAgent=must(a);sites=must(s);if(!monAgent)throw new Error("Fiche agent introuvable. Contactez votre responsable.");
  return {P,po:must(po)};
}
async function vAgentAccueil(){
  const {P,po}=await donneesAgent(),now=new Date(),ouvert=po.find(p=>!p.heure_depart&&now-new Date(p.heure_arrivee)<20*36e5);
  const pN=POSTE("N"),hNow=pad(now.getHours())+":"+pad(now.getMinutes());
  const dsServ=monAgent.poste==="N"&&pN.fin<=pN.debut&&hNow<pN.fin?ajout(auj(),-1):auj();
  let cand=[ajout(auj(),-1),auj()].flatMap(d=>affectations(d,P,[monAgent]).map(x=>({...x,ds:d}))).filter(x=>finPoste(x.ds,x.poste)>now);
  const vise=cand.find(x=>x.ds===dsServ)||cand[0];
  const fait=vise&&po.find(p=>p.date_service===vise.ds&&p.poste===vise.poste);
  const S=id=>sites.find(x=>x.id===id)||{nom:"Site"};let carte;
  if(ouvert){const s=S(ouvert.site_id);
    carte=`<div class="punch"><span class="pill p-green">En poste</span><div class="big">${hm(ouvert.heure_arrivee)}</div><div class="muted">Arrivée enregistrée · ${esc(s.nom)}</div><button class="btn pri bigbtn" id="ag-dep">Pointer mon départ</button></div>`}
  else if(vise&&!fait){const s=S(vise.site_id),p=POSTE(vise.poste);
    carte=`<div class="punch"><div class="muted">${esc(fjour(vise.ds))}</div><div class="big" style="font-size:26px">${esc(s.nom)}</div><div class="muted">Poste de ${esc(p.libelle.toLowerCase())} · ${p.debut} – ${p.fin}${vise.type==="remplacement"?" · remplacement":""}</div>
      ${s.consignes?`<div class="idbox" style="text-align:left;margin:14px 0 0"><b>Consignes :</b> ${esc(s.consignes)}</div>`:""}<button class="btn pri bigbtn" id="ag-arr">Pointer mon arrivée</button><p class="muted xs" style="margin:10px 0 0">Votre position sera vérifiée. Activez la localisation de votre téléphone.</p></div>`}
  else if(fait){carte=`<div class="punch"><span class="pill p-green">Service terminé</span><div class="big" style="font-size:24px">${hm(fait.heure_arrivee)} → ${hm(fait.heure_depart)}</div><div class="muted">Merci, bon repos.</div></div>`}
  else{const i=indispo(P,monAgent.id,auj());carte=`<div class="punch"><span class="pill ${i?"p-amber":"p-grey"}">${i?esc(i.t):monAgent.site_id?"Repos":"Pas de poste prévu"}</span><div class="big" style="font-size:24px">Pas de service prévu</div><div class="muted">Consultez « Mon planning » pour vos prochains services.</div></div>`}
  $("#main").innerHTML=`<div class="head"><div><h1>Bonjour ${esc(monAgent.prenom||monAgent.nom)}</h1><p class="muted sm" style="margin:2px 0 0">${esc(monAgent.matricule)} · ${esc(monAgent.grade)}</p></div></div>${carte}
  <div class="card"><h2>Mes derniers pointages</h2>${po.slice(0,10).map(p=>`<div class="line"><div class="grow"><b>${esc(fjourc(p.date_service))}</b> <span class="muted sm">· ${esc(S(p.site_id).nom)}</span></div><span class="sm">${hm(p.heure_arrivee)} → ${hm(p.heure_depart)}</span>${p.mode==="secours"?'<span class="pill p-amber">manuel</span>':""}</div>`).join("")||'<p class="muted sm" style="margin:0">Aucun pointage pour le moment.</p>'}</div>`;
  const arr=$("#ag-arr");if(arr)arr.onclick=()=>pointerArrivee(arr,vise,S(vise.site_id));
  const dep=$("#ag-dep");if(dep)dep.onclick=()=>busy(dep,async()=>{must(await sb.from("pointages").update({heure_depart:new Date().toISOString()}).eq("id",ouvert.id));toast("Départ enregistré");await vAgentAccueil()});
}
function pointerArrivee(btn,vise,site){busy(btn,async()=>{btn.textContent="Localisation en cours…";let pos=null,err=null;
  try{pos=await position()}catch(e){err=e.message}finally{btn.textContent="Pointer mon arrivée"}
  const dist=pos?distance(pos.lat,pos.lng,site.latitude,site.longitude):null;
  const envoyer=async()=>{const r=await sb.from("pointages").insert({agent_id:monAgent.id,site_id:vise.site_id,poste:vise.poste,date_service:vise.ds,mode:"application",latitude:pos?pos.lat:null,longitude:pos?pos.lng:null,distance_m:dist});
    if(r.error)throw new Error(/duplicate|pointages_agent_id_date_service_poste_key/.test(r.error.message)?"Vous avez déjà pointé pour ce service.":r.error.message);closeModal();toast("Arrivée enregistrée");await vAgentAccueil()};
  if(err)return confirmerSimple("Position introuvable",esc(err)+"<br><br>Vous pouvez pointer quand même : votre responsable verra que la position n'a pas été vérifiée.","Pointer sans position",envoyer);
  if(dist!=null&&dist>(+site.rayon_m||300))return confirmerSimple("Vous semblez loin du site","Vous êtes à environ <b>"+dist+" m</b> de "+esc(site.nom)+". Si vous êtes bien sur place, le GPS est peut-être imprécis : attendez quelques secondes et réessayez.<br><br>Vous pouvez aussi pointer quand même : votre responsable verra la distance.","Pointer quand même",envoyer);
  await envoyer()})}
async function vMonPlanning(){
  const {P}=await donneesAgent(),S=id=>(sites.find(x=>x.id===id)||{nom:"Site"}).nom;
  const jours=[...Array(14)].map((_,i)=>ajout(auj(),i));
  $("#main").innerHTML=`<div class="head"><div><h1>Mon planning</h1><p class="muted sm" style="margin:2px 0 0">Vos 14 prochains jours.</p></div></div><div class="card">${jours.map(d=>{const a=affectations(d,P,[monAgent]),i=indispo(P,monAgent.id,d);
    const j=fjour(d);return `<div class="line"><div class="grow"><b>${esc(j[0].toUpperCase()+j.slice(1))}</b></div>${a.length?a.map(x=>`<span class="sm">${esc(S(x.site_id))} · ${esc(POSTE(x.poste).libelle.toLowerCase())} ${POSTE(x.poste).debut}–${POSTE(x.poste).fin}</span>${x.type==="remplacement"?'<span class="pill p-amber">remplacement</span>':""}`).join(""):`<span class="pill ${i?"p-amber":"p-grey"}">${i?esc(i.t):monAgent.site_id&&monAgent.jour_repos!=null&&+monAgent.jour_repos===dowOf(d)?"Repos":monAgent.site_id?"Pas de service":"Pas de poste prévu"}</span>`}</div>`}).join("")}</div>`;
}

/* ---------- journal des erreurs + démarrage ---------- */
let nbErr=0;
function noterErreur(m){if(!moi||nbErr++>4)return;try{sb.from("logs_erreurs").insert({page:tab,erreur_technique:String(m).slice(0,3000)}).then(()=>{},()=>{})}catch(_){}}
window.addEventListener("error",e=>noterErreur((e.message||"")+" @ "+(e.filename||"").split("/").pop()+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>noterErreur("Promesse : "+((e.reason&&e.reason.message)||e.reason)));
(async()=>{
  if(slug){try{const r=await sb.rpc("agence_publique",{p_slug:slug});if(r.data)habiller(r.data)}catch(_){}}
  const {data}=await sb.auth.getSession();if(data&&data.session)await entrer();else showLogin();
})();
</script>
