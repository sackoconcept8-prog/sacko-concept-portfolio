.pitch{background:linear-gradient(145deg,#0E0E0E,#1E1A12);color:#F2E6C6;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pitch .eyebrow{color:#E2BC69}
.note{background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.note svg{width:20px;height:20px;flex:none}
button.kpi{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.paper p{margin:8px 0}
.sheet .paper{margin-top:4px}
input[type=file]{font:inherit;font-size:13px;color:var(--muted);width:100%;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:13px;margin-right:10px;padding:9px 14px;border:0;border-radius:10px;background:var(--forest);color:var(--on-forest);cursor:pointer}
input[type=file]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

function workDays(f,t){let n=0,d=f;const wd=S.settings.wd||5;let guard=0;while(d<=t&&guard<400){const k=new Date(d+"T12:00:00").getDay();if(k!==0&&(wd===6||k!==6))n++;d=addDays(d,1);guard++}return n}
const ldays=l=>l.half?0.5:workDays(l.from,l.to);
function bal(e){const y=today().slice(0,4)+"-01-01";const from=e.start>y?e.start:y;
 const months=Math.max(0,Math.floor((new Date(today()+"T12:00:00")-new Date(from+"T12:00:00"))/(864e5*30.44)));
 const acq=Math.min(months*(+S.settings.cp||2.5),(+S.settings.cp||2.5)*12);
 const L=S.leaves.filter(l=>l.empId===e.id&&l.type==="Congés payés"&&l.status==="Validée"&&l.from>=y);
 const taken=L.filter(l=>l.from<=today()).reduce((a,l)=>a+ldays(l),0),planned=L.filter(l=>l.from>today()).reduce((a,l)=>a+ldays(l),0);
 const rec=S.leaves.filter(l=>l.empId===e.id&&l.type==="Récupération"&&l.status==="Validée").reduce((a,l)=>a+ldays(l),0);
 return{acq,rel:+e.reliquat||0,taken,planned,solde:Math.round((acq+(+e.reliquat||0)-taken-planned)*10)/10,rec}}
const onLeave=(eid,date)=>S.leaves.find(l=>l.empId===eid&&l.status==="Validée"&&date>=l.from&&date<=l.to);
const seniority=e=>{const d=-diff(e.start);if(d<0)return"arrive le "+fd(e.start);const y=Math.floor(d/365.25),m=Math.floor((d%365.25)/30.44);return y?`${y} an${y>1?"s":""}${m?" "+m+" mois":""}`:m?m+" mois":d+" jours"};
function weekMon(o){const d=new Date(today()+"T12:00:00");const k=(d.getDay()+6)%7;return off(-k+7*(o||0))}
function weekDays(o){const m=weekMon(o);return[0,1,2,3,4,5,6].map(i=>addDays(m,i))}
function shiftMin(s){let a=toMin(s.start),b=toMin(s.end);if(b<=a)b+=1440;return b-a-(b-a>=360?30:0)}
function punchMin(p){if(!p.in||!p.out)return 0;let a=toMin(p.in),b=toMin(p.out);if(b<=a)b+=1440;return b-a-(b-a>=360?30:0)}
function weekHours(eid,o){const days=weekDays(o);return S.punches.filter(p=>p.empId===eid&&days.includes(p.date)).reduce((a,p)=>a+punchMin(p),0)}
function presence(date){const sh=S.shifts.filter(s=>s.date===date);return sh.map(s=>{const p=S.punches.find(x=>x.empId===s.empId&&x.date===date);const lv=onLeave(s.empId,date);const late=p?toMin(p.in)-toMin(s.start):0;
 let st;if(lv)st="Absent·"+lv.type;else if(p&&p.out)st="Parti";else if(p)st=late>5?"Retard":"Présent";else if(date<today()||(date===today()&&toMin(nowHM())>toMin(s.start)+15))st="Non pointé";else st="À venir";return{s,p,lv,late,st}})}
function absRate(){const from=off(-90),days=workDays(from,today());const n=actives().length||1;
 const ab=S.leaves.filter(l=>l.status==="Validée"&&["Maladie","Absence imprévue","Sans solde"].includes(l.type)&&l.to>=from&&l.from<=today()).reduce((a,l)=>a+workDays(l.from<from?from:l.from,l.to>today()?today():l.to),0);
 return Math.round(ab/(n*days)*1000)/10}
function turnover(){const ex=S.emp.filter(e=>e.status==="Sorti"&&e.exit&&diff(e.exit)>=-365).length;const avg=actives().length+ex/2;return avg?Math.round(ex/avg*1000)/10:0}
const charged=v=>v*(1+(+S.settings.charges||0)/100);
function massMonth(ym){const st=ym+"-01",en=ym+"-28";return S.emp.filter(e=>e.start<=en&&(!e.exit||e.exit>=st)).reduce((a,e)=>a+(+e.salary||0),0)}
function months6(){const m=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);m.push(iso(d).slice(0,7))}return m}
function lastReview(eid){return S.reviews.filter(r=>r.empId===eid&&r.status==="Réalisé").sort((a,b)=>b.date.localeCompare(a.date))[0]}
function bdayIn(e){if(!e.birth)return 999;const t=today(),y=+t.slice(0,4);let d=y+e.birth.slice(4);if(d<t)d=(y+1)+e.birth.slice(4);return diff(d)}
function age(e){if(!e.birth)return"";const b=new Date(e.birth+"T12:00:00"),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function reminders(){const out=[],R=(cat,e,days,text,cls,acts)=>out.push({id:cat+e.id,cat,e,days,text,cls,acts});

  if(e.trial&&!e.trialOk){const d=diff(e.trial);if(d<=(+S.settings.remTrial||15)&&d>=-5)R("Période d'essai",e,d,d<0?`Période d'essai terminée depuis ${-d} j : confirmez l'embauche`:`Fin de période d'essai ${d?"dans "+d+" j":"aujourd'hui"} (${fd(e.trial)})`,d<=3?"p-red":"p-amber",[["trialok","Confirmer l'embauche"],["trialext","Prolonger"]])}
  if(e.end&&["CDD","Intérim","Alternance"].includes(e.contract)){const d=diff(e.end);if(d<=(+S.settings.remCdd||30)&&d>=-7)R("Fin de CDD",e,d,d<0?`CDD terminé depuis ${-d} j : régularisez`:`Fin de CDD ${d?"dans "+d+" j":"aujourd'hui"} (${fd(e.end)})`,d<=10?"p-red":"p-amber",[["renew","Renouveler"],["tocdi","Passer en CDI"],["endc","Préparer la sortie"]])}
  if(e.end&&e.contract==="Stage"){const d=diff(e.end);if(d<=45&&d>=-7)R("Fin de stage",e,d,`Fin de stage ${d?"dans "+d+" j":"aujourd'hui"} (${fd(e.end)})`,"p-blue",[["attest","Attestation de stage"],["endc","Préparer la sortie"]])}
  if(e.medical){const d=diff(e.medical);if(d<=30)R("Visite médicale",e,d,d<0?`Visite médicale en retard de ${-d} j`:`Visite médicale à prévoir ${d?"dans "+d+" j":"aujourd'hui"}`,d<0?"p-red":"p-amber",[["medtask","Programmer"],["medok","Visite faite"]])}
  const b=bdayIn(e);if(b<=7)R("Anniversaire",e,b,b?`Anniversaire dans ${b} j (${age(e)+1} ans)`:`Anniversaire aujourd'hui (${age(e)} ans) 🎉`,"p-gold",[["wish","Message de vœux"]]);
  const lr=lastReview(e.id),pl=S.reviews.some(r=>r.empId===e.id&&r.status==="Planifié");
  if(!pl&&-diff(e.start)>330&&(!lr||diff(lr.date)<-330))R("Entretien annuel",e,lr?365+diff(lr.date):0,lr?`Dernier entretien le ${fdy(lr.date)} : à planifier`:"Aucun entretien annuel : à planifier","p-blue",[["planrev","Planifier"]])});
 return out.sort((a,b)=>a.days-b.days)}

function sShift(id,date){const s=id?S.shifts.find(x=>x.id===id):{empId:"",date:date||selDay||today(),start:"09:00",end:"17:00",post:""};
 sheet(`<form class="stack" id="sf"><h2>${id?"Modifier le créneau":"Nouveau créneau"}</h2><label class="f">Salarié<select id="s-e">${empOpts(s.empId)}</select></label><label class="f">Date<input id="s-d" type="date" value="${s.date}" required></label><div class="grid2"><label class="f">Début<input id="s-s" type="time" value="${s.start}" required></label><label class="f">Fin<input id="s-en" type="time" value="${s.end}" required></label></div><div><div class="xs muted" style="margin-bottom:6px">Horaires types</div><div class="chips" style="margin:0;flex-wrap:wrap;overflow:visible">${stpl().map((t,i)=>`<button type="button" class="chip" data-act="stpl" data-v="${i}">${esc(t[0])} · ${t[1]}–${t[2]}</button>`).join("")}</div></div>
 <label class="f">Poste / mission<input id="s-p" value="${esc(s.post)}" placeholder="Matin, service du soir…"></label>
 ${id?"":`<div><div class="xs muted" style="margin-bottom:6px">Répéter aussi ce créneau le…</div><div class="chips" style="margin:0;flex-wrap:wrap;overflow:visible" id="s-rep">${(()=>{const m=addDays(s.date,-((new Date(s.date+"T12:00:00").getDay()+6)%7));return[0,1,2,3,4,5,6].map(i=>addDays(m,i))})().map(d=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" value="${d}" style="accent-color:var(--accent)">${JOURS[new Date(d+"T12:00:00").getDay()]} ${+d.slice(8)}</label>`).join("")}</div></div>`}
 <button class="btn primary" type="submit">Enregistrer</button>${id?`<button class="btn danger" type="button" data-act="delshift" data-id="${id}">Supprimer le créneau</button>`:""}</form>`);
 $("#sf").onsubmit=ev=>{ev.preventDefault();const o={empId:$("#s-e").value,date:$("#s-d").value,start:$("#s-s").value,end:$("#s-en").value,post:$("#s-p").value.trim()||"Poste"};
  if(onLeave(o.empId,o.date))toast("Attention : "+emp(o.empId).first+" est absent(e) ce jour-là");
  if(id)Object.assign(s,o);else S.shifts.push(Object.assign({id:uid()},o));
  let extra=0,skip=0;if(!id)[...document.querySelectorAll("#s-rep input:checked")].map(x=>x.value).filter(d=>d!==o.date).forEach(d=>{if(S.shifts.some(x=>x.empId===o.empId&&x.date===d)||onLeave(o.empId,d)){skip++;return}S.shifts.push(Object.assign({id:uid()},o,{date:d}));extra++});
  selDay=o.date;save();closeSheet();render();if(extra||skip)toast((extra+1)+" créneau"+(extra?"x":"")+" enregistré"+(extra?"s":"")+(skip?" · "+skip+" jour"+(skip>1?"s":"")+" ignoré"+(skip>1?"s":"")+" (déjà planifié ou absent)":" · le salarié les voit dans son planning"));else if(!onLeave(o.empId,o.date))toast("Créneau enregistré · le salarié le voit dans son planning")}}

const CMSG={
 "Reçu":c=>`Bonjour ${c.first},\n\nNous avons bien reçu votre candidature pour le poste de ${c.job} et vous en remercions. Notre équipe l'étudie avec attention et reviendra vers vous sous 10 jours.\n\nBien cordialement,\n${S.settings.owner}\n${S.settings.name}`,
 "Entretien":c=>`Bonjour ${c.first},\n\nVotre profil a retenu notre attention pour le poste de ${c.job}. Nous serions ravis de vous rencontrer le ${c.interview?fdy(c.interview):"[date]"} à ${c.itime||"[heure]"} à l'adresse suivante : ${S.settings.addr}.\n\nMerci de nous confirmer votre présence.\n\n${S.settings.owner}\n${S.settings.name}`,
 "Retenu":c=>`Bonjour ${c.first},\n\nNous avons le plaisir de vous annoncer que votre candidature au poste de ${c.job} est retenue. Bienvenue dans l'équipe ! Nous vous contactons très vite pour la date d'arrivée et la signature de votre contrat.\n\n${S.settings.owner}\n${S.settings.name}`,
 "Refusé":c=>`Bonjour ${c.first},\n\nNous vous remercions de l'intérêt porté à ${S.settings.name}. Après étude attentive, nous ne pouvons pas donner une suite favorable à votre candidature pour le poste de ${c.job}. Nous conservons votre CV et ne manquerons pas de vous recontacter si une opportunité correspond à votre profil.\n\nNous vous souhaitons une belle réussite.\n\n${S.settings.owner}\n${S.settings.name}`};
function sCand(id){const c=S.cands.find(x=>x.id===id);if(!c)return;const m=CMSG[c.stage](c);
 sheet(`<div class="stack"><div class="row"><span class="avatar" aria-hidden="true">${esc(c.first[0]+c.last[0])}</span><div class="grow"><h2>${esc(c.first+" "+c.last)}</h2><div class="xs muted">${esc(c.job)} · ${esc(c.source)} · ${c.ref}</div></div><span class="pill ${SCLS[c.stage]}">${c.stage}</span></div>
 <div class="card pad"><dl class="kv"><dt>Email</dt><dd style="user-select:all">${esc(c.email)}</dd><dt>Téléphone</dt><dd style="user-select:all">${esc(c.phone)}</dd><dt>Reçue le</dt><dd>${fdy(c.date)}</dd><dt>CV</dt><dd>📎 ${esc(c.cv)}${c.cvData?` · <a href="${c.cvData}" download="${esc(c.cv)}" style="color:var(--accent)">ouvrir</a>`:""}</dd></dl></div>
 ${c.letter?`<div class="card pad"><div class="eyebrow" style="margin-bottom:6px">Lettre de motivation</div><div class="small">${esc(c.letter)}</div></div>`:""}
 <div class="row between"><span class="eyebrow">Votre note</span><div class="stars" role="group" aria-label="Note">${[1,2,3,4,5].map(n=>`<button class="${n<=c.rating?"on":""}" data-act="crate" data-id="${id}" data-v="${n}" aria-label="${n} étoile${n>1?"s":""}">★</button>`).join("")}</div></div>
 <label class="f">Notes internes<textarea id="c-notes" rows="2" placeholder="Impressions, disponibilités, prétentions…">${esc(c.notes)}</textarea></label>
 <div class="eyebrow">Déplacer vers</div><div class="grid2">${STAGES.filter(s=>s!==c.stage).map(s=>`<button class="btn ${s==="Retenu"?"primary":s==="Refusé"?"danger":""}" data-act="cstage" data-id="${id}" data-v="${s}">${s==="Entretien"?"Convoquer en entretien":s}</button>`).join("")}</div>
 ${c.stage==="Entretien"?`<div class="grid2"><label class="f">Date d'entretien<input id="c-d" type="date" value="${c.interview||addDays(today(),3)}"></label><label class="f">Heure<input id="c-h" type="time" value="${c.itime||"10:00"}"></label></div><button class="btn sm" data-act="cdate" data-id="${id}">Enregistrer la date</button>`:""}
 <div class="eyebrow">Message prêt à envoyer (${c.stage.toLowerCase()})</div><textarea class="ta" id="msg">${esc(m)}</textarea>
 <div class="btns"><button class="btn primary" data-act="copymsg">Copier</button><a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent("Votre candidature · "+c.job+" · "+S.settings.name)}&body=${encodeURIComponent(m)}">Email</a><a class="btn" href="https://wa.me/${c.phone.replace(/\D/g,"")}?text=${encodeURIComponent(m)}" target="_blank" rel="noopener">WhatsApp</a></div>
 ${c.stage==="Retenu"&&!c.hired?`<button class="btn gold block" data-act="hire" data-id="${id}">Embaucher : créer le dossier salarié</button>`:c.hired?`<div class="note">Embauché(e) · dossier salarié créé.</div>`:""}</div>`);
 const n=$("#c-notes");if(n)n.onchange=()=>{c.notes=n.value;save();toast("Notes enregistrées")}}
function sJobs(){sheet(`<div class="stack"><div class="row between"><h2>Offres d'emploi</h2><button class="btn primary sm" data-act="jobedit">+ Nouvelle offre</button></div><div class="small muted">Cochez pour publier sur votre page carrières, touchez une offre pour la modifier.</div><div class="card list">${S.jobsOpen.map(j=>{const n=S.cands.filter(c=>c.job===j.title).length;const late=j.deadline&&j.deadline<today();return`<div class="item"><button class="grow" data-act="jobedit" data-id="${j.id}" style="background:none;border:0;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer"><div class="t">${esc(j.title)}</div><div class="xs muted">${j.contract} · ${esc(j.dept)} · ${n} candidat${n>1?"s":""}${j.deadline?` · ${late?"clôturée le":"jusqu'au"} ${fd(j.deadline)}`:""}</div></button><input type="checkbox" data-act="jobtog" data-id="${j.id}" ${j.open?"checked":""} style="width:20px;height:20px;accent-color:var(--accent)" aria-label="Publier ${esc(j.title)}"></div>`}).join("")||`<div class="empty">Aucune offre pour le moment.</div>`}</div>
 <button class="btn block" data-act="copycareer">Copier le lien de la page carrières</button></div>`)}
function sJobForm(id){const j=id?S.jobsOpen.find(x=>x.id===id):{title:"",contract:"CDI",dept:DEPTS[0],loc:S.settings.city,salary:"",hours:"",desc:"",profile:"",deadline:"",open:true};
 sheet(`<form class="stack" id="jf"><h2>${id?"Modifier l'offre":"Nouvelle offre"}</h2><label class="f">Intitulé du poste<input id="j-t" required value="${esc(j.title)}" placeholder="Réceptionniste, comptable, infirmier…"></label>
 <div class="grid2"><label class="f">Contrat<select id="j-c">${opts(CONTRATS,j.contract)}</select></label><label class="f">Service<select id="j-d">${opts(DEPTS.includes(j.dept)?DEPTS:[j.dept,...DEPTS],j.dept)}</select></label></div>
 <div class="grid2"><label class="f">Lieu<input id="j-l" value="${esc(j.loc||"")}"></label><label class="f">Salaire (facultatif)<input id="j-s" value="${esc(j.salary||"")}" placeholder="Selon profil"></label></div>
 <div class="grid2"><label class="f">Horaires<input id="j-h" value="${esc(j.hours||"")}" placeholder="Temps plein, 3x8, week-ends…"></label><label class="f">Date limite<input id="j-dl" type="date" value="${j.deadline||""}"></label></div>
 <label class="f">Missions<textarea id="j-x" rows="3" required placeholder="Ce que la personne fera au quotidien">${esc(j.desc||"")}</textarea></label>
 <label class="f">Profil recherché<textarea id="j-p" rows="2" placeholder="Expérience, langues, qualités…">${esc(j.profile||"")}</textarea></label>
 <label class="ck"><input type="checkbox" id="j-o" ${j.open?"checked":""}>Publier sur la page carrières</label>
 <button class="btn primary" type="submit">${id?"Enregistrer les modifications":"Publier l'offre"}</button>${id?`<button class="btn danger" type="button" data-act="jobdel" data-id="${id}">Supprimer l'offre</button>`:""}<button class="btn" type="button" data-act="jobs">Retour aux offres</button></form>`);
 $("#jf").onsubmit=ev=>{ev.preventDefault();const g=k=>$("#j-"+k).value.trim();const o={title:g("t"),contract:$("#j-c").value,dept:$("#j-d").value,loc:g("l"),salary:g("s"),hours:g("h"),deadline:$("#j-dl").value,desc:g("x"),profile:g("p"),open:$("#j-o").checked};
  if(id){const old=j.title;Object.assign(j,o);if(old!==o.title)S.cands.forEach(c=>{if(c.job===old)c.job=o.title})}else S.jobsOpen.push(Object.assign({id:uid()},o));save();render();sJobs();toast(id?"Offre modifiée":o.open?"Offre publiée sur votre page carrières":"Offre enregistrée (non publiée)")}}

/* ---------- DOCUMENTS ---------- */
function sNewDoc(){sheet(`<div class="stack"><h2>Nouveau document</h2><div class="small muted">Rempli automatiquement avec le dossier du salarié, prêt à signer en ligne.</div><div class="card list">${[["attestation","Attestation de travail","En 1 clic, sur demande du salarié"],["contrat","Contrat de travail","CDI, CDD, stage"],["avenant","Avenant au contrat","Poste, salaire, horaires, renouvellement"],["bulletin","Fiche de paie","Calculée automatiquement dans l'onglet Paie"],["explication","Demande d'explication","Le salarié répond et signe dans l'application"],["avertissement","Avertissement","Remis et signé électroniquement"],["note","Note de service","Diffusée à tous ou à un service, avec accusé de lecture"],["certificat","Certificat de travail","À la fin du contrat"]].map(([k,t,s])=>`<button class="item" data-act="mkdoc" data-t="${k}"><span class="grow"><div class="t">${t}</div><div class="xs muted">${s}</div></span><span aria-hidden="true">›</span></button>`).join("")}</div></div>`)}
function sDocForm(type,eid,pre){pre=pre||{};const e=eid?emp(eid):actives()[0];const T=DOCT[type][0];let f="";
 if(type!=="note")f+=`<label class="f">Salarié<select id="d-e">${type==="certificat"?S.emp.map(x=>`<option value="${x.id}" ${x.id===(eid||"")?"selected":""}>${esc(full(x))}${x.status==="Sorti"?" (sorti)":""}</option>`).join(""):empOpts(eid)}</select></label>`;
 if(type==="attestation")f+=`<label class="f">Motif de la demande (facultatif)<input id="d-motif" value="${esc(pre.motif||"")}" placeholder="dossier de location, banque, visa…"></label>`;
 if(type==="contrat")f+=`<div class="grid2"><label class="f">Type<select id="d-ct">${opts(["CDI","CDD","Stage"],pre.ctype||(e.contract==="CDD"||e.contract==="Stage"?e.contract:"CDI"))}</select></label><label class="f">Période d'essai<input id="d-tr" value="${esc(pre.trialTxt||"2 mois")}"></label></div><div class="grid2"><label class="f">Début<input id="d-s" type="date" value="${pre.cstart||e.start||today()}"></label><label class="f">Fin (CDD, stage)<input id="d-en" type="date" value="${pre.cend!=null?pre.cend:e.end||""}"></label></div><label class="f">Motif du CDD<input id="d-mo" value="${esc(pre.motif||e.motif||"")}"></label><label class="f">Clauses particulières (facultatif)<textarea id="d-cl" rows="3" placeholder="Prime, avantage en nature, horaires spécifiques…">${esc(pre.clauses||"")}</textarea></label>${S.settings.clauses?`<div class="xs muted">Vos clauses d'entreprise (Réglages) sont ajoutées automatiquement.</div>`:""}`;
 if(type==="avenant")f+=`<label class="f">Objet de l'avenant<select id="d-ob2">${opts(["Changement de poste","Augmentation de salaire","Modification des horaires","Renouvellement de CDD","Autre modification"],pre.objet||"Augmentation de salaire")}</select></label><label class="f">Date d'effet<input id="d-ef" type="date" value="${pre.effet||addDays(today(),7)}" required></label>
 <div class="grid2"><label class="f">Poste<input id="d-np" value="${esc(pre.job||e.job)}"></label><label class="f">Salaire mensuel brut<input id="d-ns" type="number" value="${pre.salary||e.salary||""}"></label></div><label class="f">Nouvelle date de fin (CDD, stage)<input id="d-ne" type="date" value="${pre.end!=null?pre.end:e.end||""}"></label><label class="f">Précisions (facultatif)<textarea id="d-tx" rows="3" placeholder="Ex. : nouveaux horaires du lundi au vendredi, 8 h – 16 h">${esc(pre.txt||"")}</textarea></label><div class="xs muted">Une fois signé par le salarié, son dossier est mis à jour automatiquement.</div>`;
 if(type==="explication")f+=`<label class="f">Date des faits<input id="d-fd" type="date" value="${off(-1)}"></label><label class="f">Faits constatés<textarea id="d-faits" rows="3" required placeholder="Décrivez les faits de façon précise et neutre"></textarea></label><label class="f">Délai de réponse<select id="d-del"><option value="48">48 heures</option><option value="72" selected>72 heures</option><option value="120">5 jours</option></select></label>`;
 if(type==="avertissement")f+=`<label class="f">Faits reprochés<textarea id="d-faits" rows="3" required></textarea></label><label class="f">Obligation non respectée<input id="d-ob" placeholder="ponctualité, règlement intérieur art. 6…" value="le règlement intérieur"></label>`;
 if(type==="note")f+=`<label class="f">Objet<input id="d-obj" required></label><label class="f">Destinataires<select id="d-dest">${opts(["Tous",...DEPTS],"Tous")}</select></label><label class="f">Date d'effet<input id="d-eff" type="date" value="${today()}"></label><label class="f">Contenu<textarea id="d-body" rows="5" required></textarea></label>`;
 if(type==="certificat")f+=`<label class="f">Date de fin de contrat<input id="d-ex" type="date" value="${e.exit||e.end||today()}"></label>`;
 sheet(`<form class="stack" id="df"><h2>${pre.editId?"Modifier · "+T:T}</h2>${f}<button class="btn primary" type="submit">${pre.editId?"Enregistrer les modifications":"Créer le document"}</button><div class="xs muted" style="text-align:center">Modèles adaptés au droit du travail de votre pays dans la version complète.</div></form>`);
 $("#df").onsubmit=ev=>{ev.preventDefault();const v=k=>{const x=$("#d-"+k);return x?x.value.trim():""};const p=DOCT[type][1];const d={id:uid(),type,num:nextNum(p),empId:type==="note"?null:v("e"),date:today()};
  if(type==="attestation")Object.assign(d,{motif:v("motif"),status:"Délivrée"});
  if(type==="certificat"){Object.assign(d,{exit:v("ex"),status:"Délivrée"})}
  if(type==="contrat")Object.assign(d,{ctype:v("ct"),trialTxt:v("tr"),cstart:v("s"),cend:v("en"),motif:v("mo"),clauses:v("cl"),status:"À signer"});
  if(type==="avenant")Object.assign(d,{objet:v("ob2"),effet:v("ef"),job:v("np"),salary:+v("ns")||0,end:v("ne"),txt:v("tx"),status:"À signer"});
  if(pre.editId){const o=S.docs.find(x=>x.id===pre.editId);const keep={id:o.id,num:o.num,date:o.date};Object.keys(d).forEach(k=>{if(!(k in keep))o[k]=d[k]});log(DOCT[type][0]+" "+o.num+" modifié");save();render();sDoc(o.id);toast("Modifié · le salarié voit la nouvelle version à signer");return}
  if(type==="explication")Object.assign(d,{faits:v("faits"),factsDate:v("fd"),delay:+v("del"),status:"À répondre"});
  if(type==="avertissement")Object.assign(d,{faits:v("faits"),oblig:v("ob"),status:"À signer"});
  if(type==="note")Object.assign(d,{objet:v("obj"),dest:v("dest"),effet:v("eff"),body:v("body"),status:"Diffusée",reads:[]});
  if(pre.reqId){const r=S.docReq.find(x=>x.id===pre.reqId);if(r)r.status="Délivrée"}
  S.docs.push(d);log(DOCT[type][0]+" "+d.num);save();tick("doc");render();sDoc(d.id);toast(type==="note"?"Note diffusée · chaque salarié confirme sa lecture":["attestation","certificat"].includes(type)?"Document prêt · envoyé dans l'espace du salarié":"Envoyé au salarié pour signature")}}

function paperHead(d,title){const e=d.empId?emp(d.empId):null;return`<div class="band"></div>
 <div class="row between" style="align-items:flex-start;gap:8px"><div style="min-width:0"><b style="font-size:13.5px;color:#1E5B41">${esc(S.settings.name)}</b><div style="color:#6b7a72;font-size:10.5px">${esc(S.settings.addr)}<br>${esc(S.settings.phone)} · ${esc(S.settings.email)}<br>${esc(S.settings.siret)}</div></div><div class="logo">${esc(S.settings.name[0])}</div></div>
 <div class="title" style="margin-top:14px">${title}</div><div style="font-size:10.5px;color:#6b7a72">N° ${d.num} · ${esc(S.settings.city)}, le ${fdy(d.date)}</div>
 ${e?`<div class="lbl">Salarié</div><b>${esc(full(e))}</b><div style="color:#555;font-size:11.5px">${esc(e.job)} · ${esc(e.dept)}</div>`:""}`}
function sigs(d,empLabel){return`<div class="sigs"><div class="sig">Pour ${esc(S.settings.name)}<div style="font-family:var(--display);font-size:15px;color:#1E5B41;margin-top:10px">${esc(S.settings.owner)}</div><div>${esc(S.settings.role)}</div></div>${empLabel===false?"":`<div class="sig">${empLabel||"Signature du salarié"}${d.sig?`<img src="${d.sig}" alt="Signature du salarié"><div>Signé le ${fdy(d.signedAt)}</div>`:d.signedAt?`<div style="margin-top:14px;color:#1E5B41;font-weight:700">Signé électroniquement le ${fdy(d.signedAt)}</div>`:`<div style="margin-top:14px">En attente de signature</div>`}</div>`}</div>`}
const ctrLabel=t=>t==="CDI"?"à durée indéterminée":t==="CDD"?"à durée déterminée":"de stage";
function paper(d){const e=d.empId?emp(d.empId):null;let b="";const s=S.settings;

 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.addEventListener("pointerdown",e=>{draw=true;last=p(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
 cv.addEventListener("pointermove",e=>{if(!draw)return;const q=p(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(q[0],q[1]);x.stroke();last=q;has=true});

  case"lcancel":{const l=S.leaves.find(x=>x.id===id);l.status="Refusée";save();closeSheet();render();toast("Absence annulée");break}
  case"shift":sShift(id);break; case"delshift":S.shifts=S.shifts.filter(s=>s.id!==id);save();closeSheet();render();toast("Créneau supprimé");break;
  case"copynext":case"copyweek":{const src=a==="copynext"?weekDays(weekOff):weekDays(weekOff-1),shift=a==="copynext"?7:7,dst=a==="copynext"?weekDays(weekOff+1):weekDays(weekOff);let n=0;src.forEach(d=>S.shifts.filter(s=>s.date===d).forEach(s=>{const nd=addDays(d,shift);if(S.shifts.some(x=>x.empId===s.empId&&x.date===nd))return;const emp_=emp(s.empId);if(emp_.status!=="Actif"||(emp_.end&&emp_.end<nd))return;S.shifts.push({...s,id:uid(),date:nd});n++}));save();if(a==="copynext"){weekOff++;selDay=""}render();toast(n?pl(n,"créneau copié","créneaux copiés"):"Rien à copier");break}
  case"shareplan":{const d=selDay;const t=`Planning du ${JOURSL[new Date(d+"T12:00:00").getDay()]} ${fdy(d)} · ${S.settings.name}\n\n`+S.shifts.filter(s=>s.date===d).sort((x,y)=>x.start.localeCompare(y.start)).map(s=>`${s.start}–${s.end} · ${full(emp(s.empId))} (${s.post})`).join("\n")+"\n\nChaque salarié voit aussi son planning dans l'application.";sheet(`<div class="stack"><h2>Envoyer le planning</h2><textarea class="ta" id="msg" style="min-height:220px">${esc(t)}</textarea><div class="btns"><button class="btn primary" data-act="copymsg">Copier</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">WhatsApp</a></div></div>`);break}
  case"cand":sCand(id);break;
  case"crate":{const c=S.cands.find(x=>x.id===id);c.rating=+el.dataset.v;save();sCand(id);render();break}
  case"cstage":{const c=S.cands.find(x=>x.id===id);c.stage=el.dataset.v;if(c.stage==="Entretien"&&!c.interview){c.interview=addDays(today(),3);c.itime="10:00"}recTab=c.stage;save();render();sCand(id);toast("Déplacé vers « "+c.stage+" » · message prêt ci-dessous");break}
  case"cdate":{const c=S.cands.find(x=>x.id===id);c.interview=$("#c-d").value;c.itime=$("#c-h").value;save();render();sCand(id);toast("Date d'entretien enregistrée");break}
  case"hire":{const c=S.cands.find(x=>x.id===id);const dp=(S.jobsOpen.find(j=>j.title===c.job)||{}).dept||DEPTS[1];sEmpForm(null,{first:c.first,last:c.last,job:c.job,dept:dp,email:c.email,phone:c.phone,start:addDays(today(),14),trial:addDays(today(),74),candId:c.id});break}
  case"jobs":sJobs();break; case"jobedit":sJobForm(id);break;
  case"jobdel":S.jobsOpen=S.jobsOpen.filter(x=>x.id!==id);save();render();sJobs();toast("Offre supprimée");break;
  case"stpl":{const t=stpl()[+el.dataset.v];$("#s-s").value=t[1];$("#s-en").value=t[2];const pp=$("#s-p");if(pp&&!pp.value)pp.value=t[0];break}
  case"copycareer":copyText("https://www.sackoconcept.com/rhpro/demo/#c-offres");break;
  case"newdoc":sNewDoc();break;
  case"mkdoc":if(el.dataset.t==="bulletin"){closeSheet();go("paie");break}sDocForm(el.dataset.t,id);break;
  case"editdoc":{const d=S.docs.find(x=>x.id===id);sDocForm(d.type,d.empId,Object.assign({},d,{editId:d.id}));break}
  case"doc":sDoc(id);break;
  case"docreq":{const r=S.docReq.find(x=>x.id===id);if(r.status!=="Nouvelle"){toast("Déjà délivrée");break}sDocForm("attestation",r.empId,{motif:r.motif,reqId:r.id});break}
  case"signdoc":sSign(id,false);break; case"answer":sSign(id,true);break;
  case"read":{const d=S.docs.find(x=>x.id===id);d.reads=d.reads||[];if(!d.reads.includes(me))d.reads.push(me);save();render();sDoc(id);toast("Lecture confirmée");break}
  case"nudge":toast("Rappel envoyé par notification et WhatsApp");break;
  case"closedex":{const d=S.docs.find(x=>x.id===id);d.status="Signé";save();render();sDoc(id);toast("Classé sans suite");break}
  case"print":window.print();break;
  case"copymsg":copyText($("#msg").value);break;
  case"review":sReview(id);break; case"planrev":sReview(null,id||actives()[0].id);break;
  case"msg":sMsg(id);break;
  case"reply":{const m=S.msgs.find(x=>x.id===id);const r=$("#m-r").value.trim();if(!r){toast("Écrivez votre réponse");break}m.reply=r;m.status="Résolu";m.repliedAt=today();save();render();sMsg(id);toast("Réponse envoyée dans l'espace du salarié");break}
  case"incok":{const i=S.incidents.find(x=>x.id===id);i.status="Traité";save();render();toast("Signalement traité");break}
  case"xok":case"xno":case"xpaid":{const x=S.expenses.find(y=>y.id===id);x.status=a==="xok"?"Validée":a==="xno"?"Refusée":"Remboursée";save();render();toast(a==="xok"?"Validée · ajoutée à l'export de paie":a==="xno"?"Note de frais refusée":"Marquée remboursée");break}
  case"trialok":{const x=E();x.trialOk=true;save();render();if($("#layer").innerHTML)sEmp(id);toast("Embauche confirmée à l'issue de l'essai");break}
  case"trialext":{const x=E();x.trial=addDays(x.trial||today(),30);save();render();if($("#layer").innerHTML)sEmp(id);toast("Période d'essai prolongée d'un mois · pensez à l'avenant signé");break}
  case"renew":{const x=E();const ne=addDays(x.end,90);sDocForm("contrat",id,{ctype:"CDD",cstart:addDays(x.end,1),cend:ne,trialTxt:"sans objet",motif:x.motif});x.end=ne;save();render();break}
  case"tocdi":{const x=E();x.contract="CDI";x.end="";save();render();sDocForm("contrat",id,{ctype:"CDI",cstart:today(),cend:"",trialTxt:"sans objet"});toast("Passé en CDI · signez le nouveau contrat");break}
  case"endc":sExit(id);break;
  case"attest":sDocForm("attestation",id,{motif:"fin de stage"});break;
  case"medtask":{const x=E();S.tasks.push({id:uid(),title:"Prendre rendez-vous visite médicale · "+full(x),date:today(),time:nowHM(),prio:"Haute",done:false,notified:true});save();render();toast("Ajouté à vos tâches du jour");break}
  case"medok":{const x=E();x.medical=addDays(today(),730);save();render();if($("#layer").innerHTML)sEmp(id);toast("Visite enregistrée · prochain rappel dans 2 ans");break}
  case"wish":{const x=E();const t=`Joyeux anniversaire ${x.first} ! 🎉 Toute l'équipe de ${S.settings.name} vous souhaite une très belle journée. Merci pour votre engagement.\n\n${S.settings.owner}`;sheet(`<div class="stack"><h2>Message de vœux</h2><textarea class="ta" id="msg">${esc(t)}</textarea><div class="btns"><button class="btn primary" data-act="copymsg">Copier</button><a class="btn" href="https://wa.me/${x.phone.replace(/\D/g,"")}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">WhatsApp</a></div></div>`);break}
  case"import":sImport();break; case"doimport":doImport();break;
  case"tpl":download("modele-import-salaries.csv",csv([IMP.cols,IMP.ex]));toast("Modèle téléchargé · ouvrez-le avec Excel");break;
  case"exportpaie":exportPaie();break; case"exportemp":exportEmp();break;
  case"reset":if(confirm("Remettre la démo à zéro ? Vos essais seront effacés.")){S=seed();syncDepts();save();closeSheet();go("accueil");render();toast("Démo réinitialisée")}break;
  case"punch":doPunch();break;
  case"ereq":eReqTab=el.dataset.v;go("e-demandes");break;
  case"ereqtab":eReqTab=el.dataset.v;render();break;
  case"apply":applyJob=el.dataset.v;lastRef=null;go("c-postuler");render();break;
  case"newapply":lastRef=null;render();break;
 }});
function checkReminders(){if(mode!=="admin")return;const now=nowHM(),t0=today();let hit=0;
 S.tasks.forEach(t=>{if(t.done||t.notified||t.date!==t0||t.time>now)return;t.notified=true;hit++;toast("⏰ Rappel : "+t.title);
  try{if("Notification"in window&&Notification.permission==="granted")new Notification("RHPro · rappel",{body:t.time+" · "+t.title,icon:LOGO})}catch(e){}});
 if(hit){save();render()}}
setInterval(checkReminders,30000);

const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp||!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(sp){if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2400)}}
view=location.hash.slice(1);
syncMode();
render();setTimeout(checkReminders,3000);

})();
</script>
