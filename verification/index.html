<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vérification d'un devis · SACKO CONCEPT</title>
<link rel="icon" href="../assets/sacko-logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../sacko-config.js"></script>
<style>
:root{--blue:#1D5FD1;--ink:#0F1B2D;--muted:#5E6B80;--line:#E3E9F2;--green:#14915A;--red:#D2362B;--amber:#B86E00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(700px 400px at 80% 0%,#E3ECFC,transparent 70%),#F6F8FC;min-height:100vh}
.w{max-width:520px;margin:0 auto;padding:28px 18px 40px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:22px}.br img{width:42px}.br b{letter-spacing:.1em}.br small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(15,27,45,.07)}
h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.st{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin:6px 0 16px;font-weight:700}
.st .i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
.ok{background:#E2F5EC;color:var(--green)}.ok .i{background:var(--green)}
.wa{background:#FFF4DF;color:var(--amber)}.wa .i{background:#E08A00}
.ko{background:#FDECEA;color:var(--red)}.ko .i{background:var(--red)}
.st small{display:block;font-weight:500;font-size:13px;color:#33415A;margin-top:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:0;font-size:15px}dt{color:var(--muted)}dd{margin:0;font-weight:600;text-align:right}
dd.big{font-size:20px;color:var(--blue);font-weight:800}
form{display:grid;gap:10px;margin-top:6px}
input{font:16px Inter;border:1px solid #D5DEEB;border-radius:12px;padding:12px;width:100%}input:not(:placeholder-shown){text-transform:uppercase}
button{font:700 15px Inter;border:0;border-radius:12px;padding:13px;background:var(--blue);color:#fff;cursor:pointer}
.note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.ft{font-size:11px;color:#8A96A8;margin-top:22px;text-align:center;line-height:1.6}
</style>
</head>
<body><div class="w">
<div class="br"><img src="../assets/sacko-logo-96.png" alt=""><div><b>SACKO CONCEPT</b><small>Vérification d'un devis</small></div></div>
<div class="card" id="c"></div>
<div class="ft">SACKO CONCEPT Bénin · RCCM RB/ABC/24 A 100536 · Abomey-Calavi<br>SACKO CONCEPT LLC · EIN 35-2950833 · Albuquerque, NM, États-Unis<br>+229 01 57 23 63 73 · contact@sackoconcept.com</div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fcfa=n=>(Math.round(+n||0)).toLocaleString("fr-FR").replace(/ | /g," ")+" F CFA";
const P=new URLSearchParams(location.search);
function form(msg){$("#c").innerHTML=`<h1>Vérifier un devis</h1><p class="note" style="margin-top:0">${msg||"Saisissez le numéro et le code de contrôle imprimés en bas de votre devis."}</p><form id="f"><input name="n" placeholder="N° du devis (ex. DEV-2026-001)" required><input name="k" placeholder="Code de contrôle (8 caractères)" required><button>Vérifier</button></form>`;
  $("#f").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);location.search="?"+new URLSearchParams({n:f.get("n").trim().toUpperCase(),k:f.get("k").trim().toUpperCase()})}}
function show(cls,icon,title,sub,d){
  $("#c").innerHTML=`<h1>Devis ${esc(d.n)}</h1><div class="st ${cls}"><span class="i">${icon}</span><div>${title}<small>${sub}</small></div></div>
  <dl>${d.c?`<dt>Client</dt><dd>${esc(d.c)}</dd>`:""}${d.f?`<dt>Formule</dt><dd>${esc(d.f)}</dd>`:""}${d.d?`<dt>Date</dt><dd>${esc(d.d)}</dd>`:""}${d.v?`<dt>Valable jusqu'au</dt><dd>${esc(d.v)}</dd>`:""}${d.t?`<dt>Montant total</dt><dd class="big">${fcfa(d.t)}</dd>`:""}</dl>
  <p class="note">Comparez ces informations avec votre document. <b>Si le montant ou le nom du client est différent, le devis a été modifié</b> : contactez-nous au +229 01 57 23 63 73 avant tout paiement.</p>`}
async function run(){
  const n=(P.get("n")||"").toUpperCase(),k=(P.get("k")||"").toUpperCase();
  if(!n||!k){form();return}
  const qr={n,c:P.get("c"),t:P.get("t"),d:P.get("d")};
  const url=window.SACKO_REGISTRE_URL;
  if(!url){if(qr.t)show("wa","✓","Informations du QR code","Ces données ont été inscrites dans le QR code par SACKO CONCEPT lors de l'émission du devis.",qr);else form("Ce devis ne peut pas être vérifié en ligne pour le moment. Contactez-nous au +229 01 57 23 63 73.");return}
  $("#c").innerHTML=`<h1>Vérification en cours…</h1>`;
  try{const r=await fetch(url+"?"+new URLSearchParams({action:"verifier",n,code:k}));const j=await r.json();
    if(j.trouve){const reg={n,c:j.client,t:j.total,d:j.date,f:j.formule,v:j.validite};
      const diff=qr.t&&(+qr.t!==+j.total||(qr.c&&qr.c!==j.client));
      if(j.statut&&j.statut!=="Valide")show("ko","!","Devis "+esc(j.statut).toLowerCase(),"Ce devis n'est plus valable. Contactez SACKO CONCEPT.",reg);
      else if(diff)show("ko","!","Attention : informations différentes","Le QR code ne correspond pas au registre. Ce sont les informations officielles ci-dessous qui font foi.",reg);
      else show("ok","✓","Devis authentique","Ce devis est bien inscrit dans le registre officiel de SACKO CONCEPT.",reg)}
    else show("ko","✕","Devis introuvable","Aucun devis ne correspond à ce numéro et à ce code dans notre registre. Ne payez pas et contactez-nous.",{n})}
  catch(e){if(qr.t)show("wa","✓","Informations du QR code","Le registre est momentanément injoignable. Voici les informations inscrites dans le QR code lors de l'émission.",qr);else form("Le registre est momentanément injoignable. Réessayez dans quelques minutes.")}
}
run();
</script>
</body></html>
