<style>
/* Layout: colonne d'application mobile (max 480px), barre d'onglets fixe en bas, feuilles qui montent du bas ; carte héros vert forêt, touches dorées pour le premium */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface2:#E7F1EB; --fg:#14302A; --muted:#5C7268; --line:#D6E4DB;
  --accent:#3FA877; --accent-ink:#FFFFFF; --accent-soft:#D5EFE1;
  --forest:#123D30; --forest2:#1C5A45; --on-forest:#EAF6EF;
  --gold:#B8892B; --gold-soft:#F6EBD2;
  --red:#C2412D; --red-soft:#FBE3DE; --amber:#A86A0C; --amber-soft:#FCEFD3; --blue:#2C63A8; --blue-soft:#E1ECF8;
  --shadow:0 1px 2px rgba(20,48,42,.05),0 8px 24px rgba(20,48,42,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1814; --surface:#14231D; --surface2:#1A2E26; --fg:#E3F0E9; --muted:#92AA9F; --line:#28403A;
  --accent:#5CC594; --accent-ink:#0A1913; --accent-soft:#1E3D30;
  --forest:#0F3528; --forest2:#17513E; --on-forest:#EAF6EF;
  --gold:#E2BC69; --gold-soft:#3A3019;
  --red:#F08A78; --red-soft:#3D2420; --amber:#E7B45A; --amber-soft:#3A2E17; --blue:#8DB6EA; --blue-soft:#1C2C40;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1814; --surface:#14231D; --surface2:#1A2E26; --fg:#E3F0E9; --muted:#92AA9F; --line:#28403A;
  --accent:#5CC594; --accent-ink:#0A1913; --accent-soft:#1E3D30;
  --forest:#0F3528; --forest2:#17513E; --on-forest:#EAF6EF;
  --gold:#E2BC69; --gold-soft:#3A3019;
  --red:#F08A78; --red-soft:#3D2420; --amber:#E7B45A; --amber-soft:#3A2E17; --blue:#8DB6EA; --blue-soft:#1C2C40;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:27px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600;font-family:var(--body);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;margin-bottom:14px}
.demo b{font-weight:700;color:var(--gold)}
.sclogo{width:22px;height:22px;border-radius:50%;flex:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:700 11px var(--body);display:grid;place-items:center;padding:0 5px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--forest);color:var(--on-forest);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;border:0;cursor:pointer;font-size:16px}
.av-s{width:36px;height:36px;border-radius:11px;font-size:14px;background:var(--surface2);color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hero{background:linear-gradient(145deg,var(--forest) 0%,var(--forest2) 100%);color:var(--on-forest);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(226,188,105,.35)}
.hero .eyebrow{color:var(--on-forest);opacity:.75}
.hero .big{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.hero .sub{display:flex;gap:16px;margin-top:10px;font-size:12.5px;opacity:.9;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:58px;margin-top:12px}
.bars i{flex:1;background:var(--on-forest);opacity:.28;border-radius:5px 5px 2px 2px;min-height:4px}
.bars i.on{opacity:1;background:var(--gold)}
.blabels{display:flex;gap:6px;margin-top:4px}.blabels span{flex:1;text-align:center;font-size:10.5px;opacity:.7}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);font:600 11.5px var(--body);cursor:pointer}
.qa svg{width:22px;height:22px;color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-family:var(--display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.alert .v{color:var(--red)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.static{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-green{background:var(--accent-soft);color:var(--accent)} .p-red{background:var(--red-soft);color:var(--red)}
.p-amber{background:var(--amber-soft);color:var(--amber)} .p-blue{background:var(--blue-soft);color:var(--blue)}
.p-grey{background:var(--surface2);color:var(--muted)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 14px;font:600 14px var(--body);cursor:pointer;background:var(--surface2);color:var(--fg);text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--forest);color:var(--on-forest)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:600 13px var(--body);white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.chip .n{font-size:11px;opacity:.75}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 14px;font:15px var(--body);min-width:0}
.fab{position:fixed;right:max(16px,calc(50vw - 224px),env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--forest);color:var(--on-forest);font:700 15px var(--body);box-shadow:0 10px 26px rgba(18,61,48,.35);cursor:pointer;z-index:15;display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:1;color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a.on{color:var(--accent)}
nav.tabs a .badge{top:0;right:calc(50% - 22px)}
nav.tabs svg{width:22px;height:22px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);color:var(--fg);border-radius:13px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px var(--body);cursor:pointer;box-shadow:var(--shadow)}
.day b{font-family:var(--display);font-size:18px}
.day.on{background:var(--forest);color:var(--on-forest)}
.day.today:not(.on){outline:2px solid var(--accent);outline-offset:-2px}
.day .m{width:5px;height:5px;border-radius:50%;background:var(--accent)} .day .m.off{background:transparent}
.job{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.job:first-child{border-top:0}
.job .h{font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(8,22,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:93%;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.line select,.line input,textarea.ta{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:15px var(--body);width:100%;min-width:0}
textarea.ta{min-height:130px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:grid;grid-template-columns:1fr 64px 34px;gap:6px;align-items:center}
.line.cl{grid-template-columns:1fr 78px 56px 34px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.access{background:var(--gold-soft);border-radius:10px;padding:8px 10px;font-size:12.5px}
@media print{body *{visibility:hidden!important}.paper,.paper *{visibility:visible!important}.paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;border-radius:0}.overlay{position:static;background:none}}
.x{border:0;background:var(--surface2);color:var(--fg);border-radius:8px;height:40px;cursor:pointer;font-size:16px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13.5px;cursor:pointer;color:var(--fg)}
.ck input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.tasks .ck{border-radius:0;border-width:0 0 1px;background:none;padding:10px 4px}
.paper{background:#FFFFFF;color:#1d2a25;border-radius:14px;padding:18px;box-shadow:var(--shadow);font-size:12.8px;overflow:hidden}
.paper .band{height:5px;background:#6BBF94;border-radius:4px;margin:-6px 0 14px}
.paper .tw{overflow-x:auto}
.paper table{width:100%;border-collapse:collapse;margin-top:12px}
.paper th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#6b7a72;border-bottom:1px solid #d5e4db;padding:6px 4px}
.paper td{padding:7px 4px;border-bottom:1px solid #edf3ef;vertical-align:top}
.paper .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .tot{width:auto;min-width:60%;margin-left:auto}
.paper .tot td{border:0;padding:3px 6px}
.paper .ttc td{background:#6BBF94;color:#fff;font-weight:700;padding:8px}
.paper .title{font-family:var(--display);font-size:19px;color:#7a7a7a;font-weight:800;letter-spacing:.02em}
.paper .lbl{font-size:10.5px;color:#6b7a72;text-transform:uppercase;letter-spacing:.05em;margin-top:12px}
.paper .art{margin-top:10px} .paper .art b{color:#1E5B41}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.paper .sig{border:1px solid #d5e4db;border-radius:8px;min-height:70px;padding:6px;font-size:10.5px;color:#6b7a72}
.paper .sig img{max-height:56px;display:block;margin-top:2px}
.paper .logo{width:42px;height:42px;border-radius:12px;background:#1E5B41;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(156px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:70;max-width:90%;text-align:center}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-top:1px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tools button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12.5px var(--body);color:var(--fg);cursor:pointer;position:relative}
.tools svg{width:24px;height:24px;color:var(--accent)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:32px;cursor:pointer;color:var(--line);padding:0}
.stars button.on{color:var(--gold)}
.meter{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:8px}
.meter.low i{background:var(--red)}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.chart .c{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .c b{font-size:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.chart .c i{width:100%;max-width:34px;background:var(--accent-soft);border-radius:6px 6px 3px 3px}
.chart .c.on i{background:var(--accent)}
.chart .c span{font-size:11px;color:var(--muted)}
canvas.sigpad{width:100%;height:180px;background:#fff;border:1px dashed var(--line);border-radius:14px;touch-action:none;display:block}
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--forest),var(--forest2));display:grid;place-items:center;color:var(--gold);font-family:var(--display);font-weight:800;font-size:24px;flex:none}
.role{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:18px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%;box-shadow:var(--shadow)}
.role .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.role svg{width:24px;height:24px}
.splash{position:fixed;inset:0;z-index:100;background:#0B0B0B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#E9D9AE;cursor:pointer;transition:opacity .5s}
.splash img{width:110px;height:110px;border-radius:50%;animation:glow 1.6s ease-out both}
.splash .p{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:fade .8s .5s forwards}
.splash .n{font-family:var(--display);font-size:36px;font-weight:800;color:#fff;opacity:0;animation:fade .8s 1s forwards}
.splash .n em{font-style:normal;color:#6BBF94}
@keyframes glow{from{transform:scale(.85);opacity:0;filter:brightness(.4)}to{transform:none;opacity:1;filter:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.splash img,.splash .p,.splash .n{animation:none;opacity:1}}
.pitch{background:linear-gradient(145deg,#0E0E0E,#1E1A12);color:#F2E6C6;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pitch .eyebrow{color:#E2BC69}
.note{background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.note svg{width:20px;height:20px;flex:none}

/* Modules v4 : inspections, QR, carte, clés */
.rate5{display:flex;gap:6px}.rate5 label{flex:1;position:relative}.rate5 input{position:absolute;opacity:0;pointer-events:none}
.rate5 span{display:block;text-align:center;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 14px var(--body);cursor:pointer;color:var(--fg)}
.rate5 input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate5 input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.qrpaper{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:14px}.qrbox svg{width:210px;height:210px}

function vAHeures(){const a=meAgent();const m=today().slice(0,7);const done=myJobs().filter(j=>j.date.slice(0,7)===m&&j.status==="Terminée").sort((x,y)=>y.date.localeCompare(x.date));const h=done.reduce((x,j)=>x+jobHours(j),0);const plan=myJobs().filter(j=>j.date.slice(0,7)===m).reduce((x,j)=>x+toH(j.end)-toH(j.start),0);const ab=S.absences.filter(x=>x.agent===a.name).sort((x,y)=>y.from.localeCompare(x.from));

function vASignal(){const a=meAgent();const l=S.incidents.filter(i=>i.agent===a.name).sort((x,y)=>y.date.localeCompare(x.date));return`${aHeader("Un souci sur le terrain ?","Signaler")}

 sheet(`<form class="stack" id="incf"><h2>Signaler un problème</h2>
 <label class="f">Intervention<select id="in-j">${(today_.length?today_:myJobs().slice(-5)).map(j=>`<option value="${j.id}" ${j.id===jid?"selected":""}>${j.start} · ${esc(client(j.clientId).name)}</option>`).join("")}</select></label>

function checkin(jid,how){const j=S.jobs.find(x=>x.id===jid);let done=false;
 const rec=pos=>{if(done)return;done=true;j.checkin={time:nowHM(),method:how||"Bouton"};if(pos&&pos.coords){j.checkin.lat=+pos.coords.latitude.toFixed(5);j.checkin.lng=+pos.coords.longitude.toFixed(5)}j.status="En cours";log(j.clientId,`${first(j.agent)} arrivé(e) à ${j.checkin.time}${how==="QR"?" · QR code du site vérifié":""}${j.checkin.lat?" (position enregistrée)":""}`);save();render();toast("Arrivée pointée à "+j.checkin.time+(how==="QR"?" · site vérifié par QR":"")+(j.checkin.lat?" · position enregistrée":""))};
 try{if(navigator.geolocation){navigator.geolocation.getCurrentPosition(rec,()=>rec(null),{timeout:8000,maximumAge:60000,enableHighAccuracy:true});setTimeout(()=>rec(null),9000)}else rec(null)}catch(e){rec(null)}}

function initPad(cv){const r=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const x=cv.getContext("2d");x.scale(r,r);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#14302A";let draw=false,has=false,last=null;
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.addEventListener("pointerdown",e=>{draw=true;last=p(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
 cv.addEventListener("pointermove",e=>{if(!draw)return;const q=p(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(q[0],q[1]);x.stroke();last=q;has=true});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>draw=false));
 return{clear:()=>{x.clearRect(0,0,w,h);has=false},empty:()=>!has,data:()=>cv.toDataURL("image/png")}}

let taskWeekOff=0,taskDay="";
const PRIO={"Haute":"p-red","Normale":"p-blue","Basse":"p-grey"};
function taskRow(t){const late=!t.done&&(diff(t.date)<0||(diff(t.date)===0&&t.time<=nowHM()));
 return`<div class="item static"><input type="checkbox" ${t.done?"checked":""} data-act="tdone" data-id="${t.id}" aria-label="Marquer « ${esc(t.title)} » comme faite" style="width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer"><span class="grow"><div class="t" style="${t.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(t.title)}</div><div class="row xs wrap" style="gap:6px;margin-top:3px"><span class="num muted">${diff(t.date)===0?"":fd(t.date)+" · "}${t.time}</span><span class="pill ${PRIO[t.prio]}">${t.prio}</span>${t.repeat!=="none"?`<span class="pill p-gold">${t.repeat==="weekly"?"Chaque semaine":"Chaque jour"}</span>`:""}${late?`<span class="pill p-red">${diff(t.date)<0?"En retard":"Maintenant"}</span>`:""}</div></span><button class="x" style="width:36px" data-act="tdel" data-id="${t.id}" aria-label="Supprimer la tâche">×</button></div>`}
function vTaches(){const base=addDays(today(),taskWeekOff*7);const wd=(new Date(base+"T12:00:00").getDay()+6)%7;const mon=addDays(base,-wd);const days=[...Array(7)].map((_,i)=>addDays(mon,i));
 if(!days.includes(taskDay))taskDay=days.includes(today())?today():days[0];
 const l=S.tasks.filter(t=>t.date===taskDay).sort((a,b)=>(a.done-b.done)||a.time.localeCompare(b.time));
 const wk=S.tasks.filter(t=>days.includes(t.date));const late=S.tasks.filter(t=>!t.done&&diff(t.date)<0);
 let perm="unsupported";try{if("Notification"in window)perm=Notification.permission}catch(e){}
 return`${back("Tâches et rappels","Semaine du "+fd(mon))}
 ${perm==="granted"?`<div class="note" style="margin-bottom:12px">Rappels activés sur cet appareil : une notification s'affiche à l'heure de chaque tâche.</div>`:perm==="unsupported"?`<div class="note" style="margin-bottom:12px">Les rappels s'affichent dans l'application à l'heure prévue.</div>`:`<button class="btn dark block" style="margin-bottom:12px" data-act="notifperm">${svg("bell")} Activer les rappels sur ce téléphone</button>`}
 <div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="eyebrow">Cette semaine</div><div class="v">${wk.filter(t=>t.done).length}/${wk.length}</div><div class="xs muted">tâches faites</div></div><div class="kpi ${late.length?"alert":""}"><div class="eyebrow">En retard</div><div class="v">${late.length}</div><div class="xs muted">à reprogrammer ou faire</div></div></div>
 <div class="row between" style="margin-bottom:10px"><button class="btn sm" data-act="twk" data-v="-1">‹ Préc.</button><span class="small muted">Semaine du ${fd(mon)}</span><button class="btn sm" data-act="twk" data-v="1">Suiv. ›</button></div>
 <div class="week">${days.map(d=>{const dt=new Date(d+"T12:00:00");const n=S.tasks.filter(t=>t.date===d&&!t.done).length;return`<button class="day ${d===taskDay?"on":""} ${d===today()?"today":""}" data-act="tday" data-v="${d}">${JOURS[dt.getDay()]}<b>${dt.getDate()}</b><span class="m ${n?"":"off"}"></span></button>`}).join("")}</div>
 ${late.length&&taskDay===today()?`<div class="section"><h2>En retard</h2><div class="card list">${late.map(taskRow).join("")}</div></div>`:""}
 <div class="section"><div class="row between"><h2>${taskDay===today()?"Aujourd'hui":JOURS[new Date(taskDay+"T12:00:00").getDay()]+" "+fd(taskDay)}</h2><span class="small muted">${l.filter(t=>!t.done).length} à faire</span></div><div class="card list">${l.length?l.map(taskRow).join(""):`<div class="empty">Aucune tâche ce jour-là. Touchez « + Tâche ».</div>`}</div></div>`}

async function sQRScan(jid){const j=S.jobs.find(x=>x.id===jid);if(!j)return;const c=client(j.clientId),pl=jobPlace(j);
 sheet(`<div class="stack"><h2>Pointer avec le QR code</h2><div class="small muted">${esc(c.name)}${pl.name?" · "+esc(pl.name):""} · ${j.start}</div>

 if(!("BarcodeDetector" in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("#qh").textContent="Ouvrez l'appareil photo du téléphone et visez le QR code : le pointage s'ouvre tout seul. Ou tapez le code ci-dessous.";return}
 try{const det=new BarcodeDetector({formats:["qr_code"]});const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  const v=$("#qv");if(!v){st.getTracks().forEach(t=>t.stop());return}qrStream=st;v.srcObject=st;v.hidden=false;await v.play();

 catch(e){stopScan();const h=$("#qh");if(h)h.textContent="Caméra indisponible : tapez le code écrit sous le QR."}}

  case"copymsg":copyText($("#msg").value);break;
  case"copytpl":copyText(TPL[el.dataset.k][+el.dataset.i]({...TPLCTX,ent:S.settings.name}));break;
  case"relres":{const r=S.rel.find(x=>x.id===id);r.status="done";r.result=el.dataset.v;if(r.due>today())r.due=today();const c=S.clients.find(x=>x.id===r.clientId);log(r.clientId,`Relance${r.total>1?" "+r.step+"/"+r.total:""} (${RTYPE[r.type][0]}, ${r.channel}) : ${r.result}`);
   if(r.result==="Refus"){if(r.docId)S.rel.forEach(x=>{if(x.docId===r.docId&&x.status==="open")x.status="cancel"});else S.rel.forEach(x=>{if(x.clientId===r.clientId&&x.type===r.type&&x.status==="open")x.status="cancel"});if(r.type==="devis"){const d=S.docs.find(x=>x.id===r.docId);if(d)d.status="Refusé"}if(r.type==="prospect"&&c)c.status="Perdu"}
   if(r.result==="Rappeler plus tard")addRel(r.clientId,r.type,off(3),r.docId,r.step,r.total);
   if(r.result==="Intéressé"&&c&&c.status==="Prospect")c.status="Négociation";
   save();closeSheet();render();toast("Relance enregistrée dans l'historique");break}
  case"relpush":{const r=S.rel.find(x=>x.id===id);r.due=addDays(r.due<today()?today():r.due,2);save();closeSheet();render();toast("Reportée au "+fd(r.due));break}
  case"newdoc":sDocForm(el.dataset.type,id);break;
  case"newcontrat":sContrat(id);break; case"newvisite":sVisite(id);break; case"newjob":sNewJob(id);break; case"newrel":sNewRel(id);break;
  case"qa-devis":sDocForm("devis");break; case"qa-facture":sDocForm("facture");break; case"qa-job":sNewJob();break; case"qa-client":sNewClient();break;
  case"jobdone":sBon(id);break;
  case"jobcancel":{const j=S.jobs.find(x=>x.id===id);j.status="Annulée";log(j.clientId,"Intervention du "+fd(j.date)+" annulée");save();render();break}
  case"accept":{const d=D();acceptDevis(d);save();render();sDoc(id);toast("Devis accepté · relances arrêtées");break}
  case"refuse":{const d=D();d.status="Refusé";cancelRels(d.id);log(d.clientId,`Devis ${d.num} refusé`);save();render();sDoc(id);break}
  case"signdoc":sSign(id);break;
  case"deposit":{const d=D();const amt=Math.round(ht(d)*0.3*100)/100;const f={id:uid(),type:"facture",kind:"acompte",num:nextNum("facture"),clientId:d.clientId,date:today(),ref:d.num,lines:[{s:"Acompte 30 % sur devis "+d.num,u:"forfait",p:amt,q:1}],pays:[]};d.deposit=f.id;S.docs.push(f);seqFacture(f);log(d.clientId,`Facture d'acompte ${f.num} émise (${eur(ttc(f))})`);save();docTab="facture";render();sDoc(f.id);toast("Facture d'acompte émise");break}
  case"invoice":{const d=D();const lines=JSON.parse(JSON.stringify(d.lines)).map(l=>({...l,p:Math.round(l.p*(1-(d.remise||0)/100)*100)/100}));const dep=S.docs.find(x=>x.id===d.deposit);if(dep)lines.push({s:"Acompte déjà facturé ("+dep.num+")",u:"forfait",p:-ht(dep),q:1});
   const f={id:uid(),type:"facture",num:nextNum("facture"),clientId:d.clientId,date:today(),ref:d.num,lines,pays:[]};d.status="Facturé";S.docs.push(f);seqFacture(f);log(d.clientId,`Facture ${f.num} émise depuis ${d.num}`);save();docTab="facture";render();sDoc(f.id);toast("Facture "+f.num+" émise");break}
  case"tocontrat":sContrat(D().clientId);break; case"tojob":sNewJob(D().clientId);break;
  case"pay":sPay(id);break; case"cpay":sCPay(id);break;
  case"confirmpay":{const d=D();const p=d.pays.find(x=>x.id===el.dataset.p);p.ok=true;if(reste(d)<=0)cancelRels(d.id);log(d.clientId,`Paiement confirmé : ${eur(p.amount)}`);save();render();sDoc(id);toast("Paiement confirmé");break}
  case"remind":{const d=D();const r={type:"paiement",step:diff(due(d))<-7?2:1,clientId:d.clientId,docId:d.id};$("#extra").innerHTML=`<div class="stack"><textarea id="msg" class="ta" aria-label="Message de rappel">${esc(msgFor(r))}</textarea><button class="btn dark" data-act="copymsg">Copier le message</button></div>`;break}
  case"avoir":{const d=D();const av={id:uid(),type:"avoir",num:nextNum("avoir"),clientId:d.clientId,date:today(),ref:d.num,lines:JSON.parse(JSON.stringify(d.lines)),remise:d.remise||0};d.cancelled=true;cancelRels(d.id);S.docs.push(av);log(d.clientId,`Avoir ${av.num} émis sur ${d.num}`);save();render();sDoc(av.id);toast("Avoir émis · facture annulée");break}
  case"rate":sRate(id);break;
  case"planreq":{const r=S.requests.find(x=>x.id===id);sNewJob(r.clientId,r);break}
  case"refusereq":{const r=S.requests.find(x=>x.id===id);r.status="Refusée";log(r.clientId,"Demande d'intervention refusée");save();render();break}
  case"stk":{const s=S.stock.find(x=>x.id===id);s.qty=Math.max(0,s.qty+ +el.dataset.v);save();render();break}
  case"addstock":sAddStock();break;
  case"addagent":sheet(`<form class="stack" id="aaf"><h2>Nouvel agent</h2><label class="f">Nom<input id="aa-n" required></label><div class="grid2"><label class="f">Poste<input id="aa-r" value="Agent d'entretien"></label><label class="f">Taux horaire (${curSym()})<input id="aa-t" type="number" step="any" value="12.5"></label></div><button class="btn primary" type="submit">Ajouter</button></form>`);
   $("#aaf").onsubmit=ev=>{ev.preventDefault();S.team.push({id:uid(),name:$("#aa-n").value.trim(),role:$("#aa-r").value,rate:+$("#aa-t").value||0});save();closeSheet();render();toast("Agent ajouté")};break;
  case"addsvc":sheet(`<form class="stack" id="nsf"><h2>Nouvelle prestation</h2><label class="f">Nom<input id="v-n" required></label><div class="grid2"><label class="f">Unité<select id="v-u">${opts(["passage","heure","m²","forfait","unité"])}</select></label><label class="f">Prix HT<input id="v-p" type="number" step="any" required></label></div><button class="btn primary" type="submit">Ajouter</button></form>`);
   $("#nsf").onsubmit=ev=>{ev.preventDefault();S.catalog.push({name:$("#v-n").value.trim(),unit:$("#v-u").value,price:+$("#v-p").value||0});save();closeSheet();render();toast("Prestation ajoutée")};break;
  case"offer":sOffer();break;
  case"tkreply":{const t=S.tickets.find(x=>x.id===id);const v=($("#rep-"+id)||{}).value||"";if(!v.trim()){toast("Écrivez une réponse");break}t.reply=v.trim();t.status="Résolu";t.repliedAt=today();log(t.clientId,"Support : réponse envoyée ("+t.subject+")");save();render();toast("Réponse envoyée au client");break}
  case"tdone":{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;if(t.done&&t.repeat!=="none"&&!t.spawned){t.spawned=true;S.tasks.push({...t,id:uid(),date:addDays(t.date,t.repeat==="weekly"?7:1),done:false,notified:false,spawned:false})}save();render();if(t.done)toast(t.repeat!=="none"?"Faite · prochaine le "+fd(addDays(t.date,t.repeat==="weekly"?7:1)):"Tâche faite");break}
  case"tdel":{S.tasks=S.tasks.filter(x=>x.id!==id);save();render();toast("Tâche supprimée");break}
  case"tday":taskDay=el.dataset.v;render();break;
  case"twk":taskWeekOff+=+el.dataset.v;taskDay="";render();break;
  case"notifperm":try{Notification.requestPermission().then(()=>render(),()=>toast("Rappels non autorisés par le navigateur"))}catch(e){toast("Rappels non disponibles ici")}break;
  case"import":sImport(el.dataset.v);break; case"tpl":downloadTpl(el.dataset.v);break; case"doimport":doImport();break;
  case"reset":if(el.dataset.confirm){S=seed();migrate();save();filter="Tous";query="";weekOff=0;selDay=today();go("accueil");toast("Démo réinitialisée")}else{el.dataset.confirm="1";el.textContent="Touchez encore pour confirmer"}break;
 }
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2600)}
if(!handleQR()){view=location.hash.slice(1);render()}setTimeout(checkReminders,3000);
})();
</script>

<script src="../../sacko-config.js"></script>
<script src="../../sacko-track.js" defer></script>
<script src="../../sacko-lead.js" defer></script>
</body>
