@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.splash img,.splash .p,.splash .n{animation:none;opacity:1}}
.pitch{background:linear-gradient(145deg,#0E0E0E,#1E1A12);color:#F2E6C6;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pitch .eyebrow{color:#E2BC69}
.note{background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.note svg{width:20px;height:20px;flex:none}
button.kpi{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.paper p{margin:8px 0}
.sheet .paper{margin-top:4px}
input[type=file]{font:inherit;font-size:13px;color:var(--muted);width:100%;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:13px;margin-right:10px;padding:9px 14px;border:0;border-radius:10px;background:var(--forest);color:var(--on-forest);cursor:pointer}
input[type=file]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ptile{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.ptile:disabled{opacity:.5;cursor:not-allowed}
.ptile .ph{position:relative;aspect-ratio:1.5;border-radius:12px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.ptile .ph img{width:100%;height:100%;object-fit:cover}
.ptile .pn{font-weight:600;font-size:13.5px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .row{gap:6px}
.incart{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--forest);color:var(--gold);font:800 12px var(--body);display:grid;place-items:center;padding:0 6px}
.sold,.few{position:absolute;left:6px;bottom:6px;font:700 11px var(--body);padding:3px 8px;border-radius:99px}
.sold{background:var(--red);color:#fff}.few{background:var(--gold);color:#fff}
.thumb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.thumb.big{width:72px;height:72px;font-size:38px;border-radius:18px}
.thumb img{width:100%;height:100%;object-fit:cover}
.step{display:inline-flex;align-items:center;gap:8px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface2);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer}
.cartbar{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:14px -16px calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:18px 18px 0 0}
.cartbar .btn:disabled{opacity:.5}
.invq,.poq{width:70px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 8px;font:600 15px var(--body);text-align:center;flex:none}
.mark svg{width:26px;height:26px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
</style>
</head>

function readImg(f,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};img.src=r.result};r.readAsDataURL(f)}

function sImport(){return`<h2>Importer vos produits</h2><p class="small muted" style="margin:4px 0 0">Depuis Excel (.xlsx) ou CSV. Colonnes reconnues : nom, catégorie, prix d'achat, prix de vente, stock, seuil, code-barres.</p>

 <div class="note small" style="margin-top:12px">Dans la version achetée, nous importons aussi votre fichier pour vous : envoyez-le simplement sur WhatsApp.</div>`}
function importRows(rows){if(!rows.length){toast("Fichier vide");return}const h=rows[0].map(x=>norm(x));const ix=keys=>h.findIndex(x=>keys.some(k=>x.includes(k)));
 const iN=ix(["nom","produit","article","name"]),iC=ix(["categ"]),iB=ix(["achat","cout","buy"]),iS=ix(["vente","prix","sell","price"]),iQ=ix(["stock","quantite","qte"]),iM=ix(["seuil","min","alerte"]),iK=ix(["code","barre","ean"]);
 if(iN<0){toast("Colonne « nom » introuvable");return}let n=0;
 rows.slice(1).forEach(r=>{const name=String(r[iN]||"").trim();if(!name)return;const num=i=>i<0?0:+String(r[i]||"0").replace(/\s/g,"").replace(",",".")||0;const cat=iC>=0&&String(r[iC]||"").trim()?String(r[iC]).trim():S.settings.cats[0];if(!S.settings.cats.includes(cat))S.settings.cats.push(cat);
  const ex=S.products.find(p=>norm(p.name)===norm(name));const d={name,cat,buy:num(iB),sell:num(iS),min:iM>=0?num(iM):5,code:iK>=0?String(r[iK]||"").trim():""};
  if(ex){Object.assign(ex,d);if(iQ>=0)ex.stock=num(iQ)}else S.products.push({id:"p"+uid(),emoji:"📦",stock:iQ>=0?num(iQ):0,sup:S.sups[0].id,exp:"",desc:"",online:true,photo:"",...d});n++});
 save();closeSheet();render();toast(pl(n,"produit importé","produits importés"))}
function handleImport(f){const name=f.name.toLowerCase();const r=new FileReader();
 if(name.endsWith(".csv")){r.onload=()=>{const t=String(r.result).replace(/^﻿/,"");const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";importRows(t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const out=[];let cur="",qt=false;for(const ch of l){if(ch==='"')qt=!qt;else if(ch===sep&&!qt){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out}))};r.readAsText(f)}
 else{if(!window.XLSX){toast("Lecture Excel indisponible hors connexion : utilisez un CSV");return}r.onload=()=>{const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});importRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}))};r.readAsArrayBuffer(f)}}
document.addEventListener("change",e=>{if(e.target.id==="imp-file"&&e.target.files[0])handleImport(e.target.files[0]);
 if(e.target.id==="scan-cam"&&e.target.files[0]){const f=e.target.files[0];if("BarcodeDetector" in window){createImageBitmap(f).then(b=>new BarcodeDetector().detect(b)).then(r=>{if(r&&r[0])scanned(r[0].rawValue);else toast("Code non lu : saisissez-le")}).catch(()=>toast("Code non lu : saisissez-le"))}else toast("Lecture photo non disponible sur ce navigateur : saisissez le code")}});

function sNotifs(){const n=notifs();return`<h2>Alertes</h2><div class="card list" style="margin-top:12px">${n.map(x=>`<button class="item" ${x.go?`data-go="${x.go}"`:`data-act="${x.act}" data-id="${x.id}"`}><span class="pill ${x.c}" style="width:34px;height:34px;justify-content:center;padding:0">${svg(x.ic).replace('aria-hidden','style="width:18px;height:18px" aria-hidden')}</span><span class="grow"><span class="t" style="display:block">${esc(x.t)}</span><span class="xs muted">${esc(x.s)}</span></span></button>`).join("")||`<div class="empty">Aucune alerte 👌</div>`}</div>`}
function sOffer(){return`<div class="pitch"><div class="eyebrow">StockPro par SACKO CONCEPT</div><h2 style="color:#fff">Votre application de stock, à votre nom</h2><div class="small" style="opacity:.9">Nous la personnalisons avec votre logo, vos couleurs, vos produits importés et votre catalogue en ligne. Application web dès la formule Standard, Android et iPhone avec Premium.</div></div>
 <div class="stack" style="margin-top:12px"><a class="btn primary block" href="../">Voir les offres en euros</a><a class="btn block" href="../dollars/">Voir les offres en dollars</a><a class="btn block" href="../fcfa/">Voir les offres en francs CFA</a>${waBtn("15054642331","Bonjour Hawa, j'ai testé la démo StockPro et je souhaite un devis pour ma boutique.\nNom de la boutique : \nNombre de produits : \nPays : ","Demander mon devis sur WhatsApp","gold block")}</div>`}

/* ================= DÉMARRAGE ================= */
const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp||!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(sp){if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2400)}}
view=location.hash.slice(1);syncMode();render();
})();
