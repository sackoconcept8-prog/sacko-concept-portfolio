<style>

 ${isAbsent(a.name,t)?`<div class="note" style="margin-bottom:12px">You have approved time off today.</div>`:""}
 <div class="hero"><div class="eyebrow">My day</div><div class="big" style="font-size:28px">${l.length} job${l.length>1?"s":""}</div><div class="sub"><span>${l.reduce((x,j)=>x+toH(j.end)-toH(j.start),0)} h planned</span><span>${l.filter(j=>j.status==="Completed").length} completed</span></div></div>
 <div class="section">${l.length?l.map(agentCard).join(""):`<div class="card empty">No jobs today.</div>`}</div>`}
function vASemaine(){const days=[...Array(7)].map((_,i)=>off(i));return`${aHeader("Next 7 days","My schedule")}
 ${days.map(d=>{const l=myJobs().filter(j=>j.date===d).sort((x,y)=>x.start.localeCompare(y.start));return`<div class="section"><div class="row between"><h2>${d===today()?"Today":JOURS[new Date(d+"T12:00:00").getDay()]+" "+fd(d)}</h2>${isAbsent(meAgent().name,d)?`<span class="pill p-amber">Off</span>`:`<span class="small muted">${l.length} job${l.length>1?"s":""}</span>`}</div>${l.length?l.map(j=>{const c=client(j.clientId),pl=jobPlace(j);return`<div class="card pad row" style="gap:12px"><b class="num">${j.start}</b><span class="grow"><div class="t">${esc(c.name)}</div><div class="xs muted">${esc(pl.addr)}</div></span>${pill([j.status==="Completed"?"Done":"Planned",j.status==="Completed"?"p-green":"p-grey"])}</div>`}).join(""):""}</div>`}).join("")}`}
function vAHeures(){const a=meAgent();const m=today().slice(0,7);const done=myJobs().filter(j=>j.date.slice(0,7)===m&&j.status==="Completed").sort((x,y)=>y.date.localeCompare(x.date));const h=done.reduce((x,j)=>x+jobHours(j),0);const plan=myJobs().filter(j=>j.date.slice(0,7)===m).reduce((x,j)=>x+toH(j.end)-toH(j.start),0);const ab=S.absences.filter(x=>x.agent===a.name).sort((x,y)=>y.from.localeCompare(x.from));
 return`${aHeader("This month","My hours")}
 <div class="kpis"><div class="kpi"><div class="eyebrow">Hours worked</div><div class="v">${h.toFixed(1)} h</div><div class="xs muted">based on clock-in</div></div><div class="kpi"><div class="eyebrow">Planned this month</div><div class="v">${plan} h</div></div></div>
 <div class="section"><h2>My completed jobs</h2><div class="card list">${done.length?done.map(j=>`<div class="item static"><span class="grow"><div class="t">${esc(client(j.clientId).name)}</div><div class="xs muted num">${fd(j.date)} · ${j.checkin?j.checkin.time:j.start} → ${j.checkout?j.checkout.time:j.end}</div></span><b class="num small">${jobHours(j).toFixed(1)} h</b></div>`).join(""):`<div class="empty">Nothing this month.</div>`}</div></div>
 <div class="section"><h2>Request time off</h2><div class="card pad"><form class="stack" id="absf"><div class="grid2"><label class="f">From<input id="ab-f" type="date" value="${off(7)}" required></label><label class="f">To<input id="ab-t" type="date" value="${off(7)}" required></label></div><label class="f">Reason<select id="ab-r">${opts(["Vacation","Sick leave","Doctor's appointment","Family reason","Other"])}</select></label><button class="btn primary" type="submit">Send request</button></form></div></div>
 ${ab.length?`<div class="section"><h2>My requests</h2><div class="card list">${ab.map(x=>`<div class="item static"><span class="grow"><div class="t">${esc(x.reason)}</div><div class="xs muted">${x.from===x.to?fd(x.from):fd(x.from)+" → "+fd(x.to)}</div></span>${pill([x.status,x.status==="Approved"?"p-green":x.status==="Declined"?"p-grey":"p-amber"])}</div>`).join("")}</div></div>`:""}`}
function vASignal(){const a=meAgent();const l=S.incidents.filter(i=>i.agent===a.name).sort((x,y)=>y.date.localeCompare(x.date));return`${aHeader("An issue on site?","Report")}
 <button class="btn primary block" data-act="incident">Report a problem</button>
 <div class="xs muted" style="margin-top:8px">Missing supplies, breakage, client not home, no access: your manager is notified right away.</div>
 <div class="section"><h2>My reports</h2><div class="card list">${l.length?l.map(i=>`<div class="item static" style="align-items:flex-start"><span class="grow"><div class="t">${esc(i.type)}</div><div class="xs muted">${esc(client(i.clientId).name)} · ${fd(i.date)}</div><div class="small">${esc(i.msg)}</div></span>${pill([i.status==="Open"?"Sent":"Handled",i.status==="Open"?"p-blue":"p-green"])}</div>`).join(""):`<div class="empty">No reports.</div>`}</div></div>`}
function sIncident(jid){const a=meAgent();const today_=myJobs().filter(j=>j.date===today());let photo=null;
 sheet(`<form class="stack" id="incf"><h2>Report a problem</h2>
 <label class="f">Job<select id="in-j">${(today_.length?today_:myJobs().slice(-5)).map(j=>`<option value="${j.id}" ${j.id===jid?"selected":""}>${j.start} · ${esc(client(j.clientId).name)}</option>`).join("")}</select></label>
 <label class="f">Type<select id="in-t">${opts(["Missing supplies","Breakage or damage","Client not home","No access","Running late","Other"])}</select></label>
 <label class="f">Details<textarea id="in-m" rows="3" required placeholder="What's happening?"></textarea></label>
 <label class="btn" style="cursor:pointer">${svg("plus")} Add a photo<input type="file" id="in-p" accept="image/*" capture="environment" hidden></label><div id="in-prev"></div>
 <button class="btn primary" type="submit">Send to manager</button></form>`);
 $("#in-p").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await imgToData(f,560);$("#in-prev").innerHTML=`<img src="${photo}" alt="Preview" style="max-width:140px;border-radius:8px">`}catch(_){}};
 $("#incf").onsubmit=e=>{e.preventDefault();const j=S.jobs.find(x=>x.id===$("#in-j").value);const m=$("#in-m").value.trim();if(!m){toast("Describe the problem");return}
  S.incidents.push({id:uid(),agent:a.name,clientId:j?j.clientId:S.clients[0].id,jobId:j?j.id:null,date:today(),type:$("#in-t").value,msg:m,photo,status:"Open"});if(j)log(j.clientId,`Report from ${first(a.name)}: ${$("#in-t").value}`);save();closeSheet();render();toast("Report sent to your manager")}}
function checkin(jid){const j=S.jobs.find(x=>x.id===jid);let done=false;
 const rec=pos=>{if(done)return;done=true;j.checkin={time:nowHM()};if(pos&&pos.coords){j.checkin.lat=+pos.coords.latitude.toFixed(5);j.checkin.lng=+pos.coords.longitude.toFixed(5)}j.status="In progress";log(j.clientId,`${first(j.agent)} arrived at ${j.checkin.time}${j.checkin.lat?" (location saved)":""}`);save();render();toast("Clocked in at "+j.checkin.time+(j.checkin.lat?" · location saved":""))};
 try{if(navigator.geolocation){navigator.geolocation.getCurrentPosition(rec,()=>rec(null),{timeout:8000,maximumAge:60000,enableHighAccuracy:true});setTimeout(()=>rec(null),9000)}else rec(null)}catch(e){rec(null)}}
function sAMenu(){const a=meAgent();sheet(`<div class="stack"><div class="row"><div class="avatar" style="background:var(--gold);color:#fff">${esc(a.name[0])}</div><div class="grow"><h2>${esc(a.name)}</h2><div class="xs muted">${esc(a.role)} · ${esc(S.settings.name)}</div></div></div>
 <div class="card pad"><dl class="kv"><dt>Manager</dt><dd>${esc(S.settings.owner)}</dd><dt>Phone</dt><dd class="num" style="user-select:all">${esc(S.settings.phone)}</dd></dl></div>
 <a class="btn primary block" href="${waLink(S.settings.phone,"Hi, it's "+first(a.name)+".")}">Text my manager</a>
 <button class="btn block" data-act="switch">${svg("swap")} Back to manager space</button><button class="btn block" data-act="logout">Log out</button></div>`)}

/* ================= SHEETS ================= */
function sheet(html){$("#layer").innerHTML=`<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$("#layer").innerHTML=""}

function sClient(id){const c=S.clients.find(x=>x.id===id);if(!c)return;
 const docs=S.docs.filter(d=>d.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));const rels=openRels(id);const acts=S.act.filter(a=>a.clientId===id);
 const ca=S.docs.filter(d=>d.clientId===id&&d.type==="facture").reduce((a,f)=>a+paid(f),0);
 sheet(`<div class="stack"><div class="row"><div class="avatar">${esc(c.name[0])}</div><div class="grow"><h2>${esc(c.name)}</h2><div class="row wrap" style="gap:6px;margin-top:4px"><span class="pill ${STATUS[c.status]}">${c.status}</span><span class="pill p-grey">${esc(c.type)}</span></div></div></div>
 <div class="kpis"><div class="kpi"><div class="eyebrow">Revenue collected</div><div class="v" style="font-size:19px">${eur(ca)}</div></div><div class="kpi"><div class="eyebrow">Potential</div><div class="v" style="font-size:19px">${c.value?eur(c.value):"—"}</div><div class="xs muted">per month</div></div></div>
 <div class="card pad"><dl class="kv"><dt>Contact</dt><dd>${esc(c.contact)}</dd><dt>Phone</dt><dd class="num" style="user-select:all">${esc(c.phone)}</dd><dt>Email</dt><dd style="user-select:all">${esc(c.email||"—")}</dd><dt>Address</dt><dd>${esc(c.addr)}</dd>${c.access?`<dt>Access</dt><dd>${esc(c.access)}</dd>`:""}${c.notes?`<dt>Notes</dt><dd>${esc(c.notes)}</dd>`:""}</dl></div>
 <div class="row between"><span class="eyebrow">Service locations</span><button class="btn sm" data-act="addsite" data-id="${id}">+ Location</button></div>
 ${c.sites&&c.sites.length?`<div class="card list">${c.sites.map(st=>`<div class="item static" style="align-items:flex-start"><span class="grow"><div class="t">${esc(st.name)}</div><div class="xs muted">${esc(st.addr)}</div>${st.access?`<div class="access" style="margin-top:6px">${esc(st.access)}</div>`:""}</span></div>`).join("")}</div>`:`<div class="xs muted">Single location: the main address.</div>`}
 <label class="f">Status<select id="c-status">${opts(Object.keys(STATUS),c.status)}</select></label>
 <div class="btns"><button class="btn primary" data-act="newdoc" data-type="devis" data-id="${id}">Quote</button><button class="btn" data-act="newdoc" data-type="facture" data-id="${id}">Invoice</button><button class="btn" data-act="newcontrat" data-id="${id}">Contract</button><button class="btn" data-act="newvisite" data-id="${id}">Site visit</button><button class="btn" data-act="newjob" data-id="${id}">Schedule</button><button class="btn" data-act="newrel" data-id="${id}">Follow-up</button></div>
 <div class="eyebrow" style="margin-top:6px">Upcoming follow-ups</div><div class="card list">${rels.length?rels.map(relItem).join(""):`<div class="empty">No follow-ups planned.</div>`}</div>
 ${docs.length?`<div class="eyebrow">Documents</div><div class="card list">${docs.map(docItem).join("")}</div>`:""}
 <div class="eyebrow">History</div><form class="row" id="notef"><input id="note" class="search" placeholder="Add a note (call, visit…)" aria-label="Note"><button class="btn primary" type="submit">OK</button></form>
 <div class="card pad"><div class="timeline">${acts.length?acts.map(a=>`<div class="tl"><i></i><div><div class="small">${esc(a.text)}</div><div class="xs muted">${fdy(a.date)}</div></div></div>`).join(""):`<div class="empty">No history yet.</div>`}</div></div></div>`);
 $("#c-status").onchange=e=>{c.status=e.target.value;log(id,"Status changed: "+c.status);save();render();sClient(id)};
 $("#notef").onsubmit=e=>{e.preventDefault();const v=$("#note").value.trim();if(!v)return;log(id,v);save();sClient(id);toast("Note added")};
}

function sRel(id){const r=S.rel.find(x=>x.id===id);if(!r)return;const c=client(r.clientId);const d=S.docs.find(x=>x.id===r.docId);const[tl,tc]=RTYPE[r.type];
 sheet(`<div class="stack"><div><h2>${esc(c.name)}</h2><div class="row wrap" style="gap:6px;margin-top:4px"><span class="pill ${tc}">${tl}</span>${r.total>1?`<span class="pill p-grey">Follow-up ${r.step}/${r.total}</span>`:""}${pill(relState(r))}</div></div>
 ${d?`<button class="item card" data-act="doc" data-id="${d.id}"><span class="grow"><div class="t">${d.num}</div><div class="xs muted">${fd(d.date)}</div></span><b class="num small">${eur(d.type==="facture"?reste(d):ttc(d))}</b>${pill(dState(d))}</button>`:""}
 <div class="card pad"><dl class="kv"><dt>Contact</dt><dd>${esc(c.contact)}</dd><dt>Phone</dt><dd class="num" style="user-select:all">${esc(c.phone)}</dd><dt>Email</dt><dd style="user-select:all">${esc(c.email||"—")}</dd></dl></div>
 ${r.status==="open"?`<label class="f">Channel<select id="r-ch">${opts(["Email","SMS","WhatsApp","Call","Visit"],r.channel)}</select></label>
 <label class="f">Message (editable)<textarea id="msg" class="ta">${esc(msgFor(r))}</textarea></label>
 <div class="grid2"><a class="btn primary" id="r-mail" href="#">Send by email</a><a class="btn" id="r-wa" href="#">Send by SMS</a></div>
 <button class="btn dark block" data-act="copymsg">Copy message</button>
 <div class="eyebrow">Follow-up result</div>
 <div class="btns"><button class="btn primary" data-act="relres" data-id="${r.id}" data-v="Interested">Interested</button><button class="btn" data-act="relres" data-id="${r.id}" data-v="No answer">No answer</button><button class="btn" data-act="relres" data-id="${r.id}" data-v="Call back later">Call back</button><button class="btn danger" data-act="relres" data-id="${r.id}" data-v="Declined">Declined</button></div>
 <button class="btn block" data-act="relpush" data-id="${r.id}">Postpone 2 days</button>`:`<div class="note">Follow-up ${r.status==="done"?"done":"cancelled"}${r.result?" · "+esc(r.result):""}.</div>`}
 <button class="btn block" data-act="client" data-id="${c.id}">Open client profile</button></div>`);
 const ch=$("#r-ch");if(ch)ch.onchange=e=>{r.channel=e.target.value;save()};
 const upd=()=>{const m=$("#msg");if(!m)return;const w=$("#r-wa"),ml=$("#r-mail");if(w)w.href=waLink(c.phone,m.value);if(ml)ml.href="mailto:"+(c.email||"")+"?subject="+encodeURIComponent(S.settings.name)+"&body="+encodeURIComponent(m.value)};upd();const mm=$("#msg");if(mm)mm.addEventListener("input",upd);
}

 <label class="f">Name or company<input id="n-name" required></label>

function sNewRel(cid){sheet(`<form class="stack" id="nrf"><h2>Schedule a follow-up</h2><label class="f">Client<select id="nr-c">${clientOpts(cid)}</select></label>
 <div class="grid2"><label class="f">Type<select id="nr-t">${Object.entries(RTYPE).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></label><label class="f">Date<input id="nr-d" type="date" value="${off(1)}"></label></div>

function sNewJob(cid,req){sheet(`<form class="stack" id="njf"><h2>Schedule a job</h2>
 <label class="f">Client<select id="j-c">${clientOpts(cid)}</select></label>
 <label class="f" id="j-site-w">Location<select id="j-site"></select></label>
 <label class="f">Service<select id="j-s">${opts(S.catalog.map(s=>s.name),req?req.service:"")}</select></label>
 <div class="grid2"><label class="f">Date<input id="j-d" type="date" value="${req?req.wanted:selDay||today()}" required></label><label class="f">Cleaner<select id="j-a">${opts(S.team.map(a=>a.name))}</select></label></div>
 <div class="grid2"><label class="f">Start<input id="j-st" type="time" value="09:00" required></label><label class="f">End<input id="j-en" type="time" value="11:00" required></label></div>
 <label class="f">Repeat<select id="j-r"><option value="1">Just once</option><option value="4">Weekly · 4 weeks</option><option value="8">Weekly · 8 weeks</option><option value="12">Weekly · 12 weeks</option></select></label>
 <button class="btn primary" type="submit">Schedule</button></form>`);
 const fillSites=()=>{const c=client($("#j-c").value);const ss=c.sites||[];$("#j-site-w").hidden=!ss.length;$("#j-site").innerHTML=ss.map((x,i)=>`<option value="${i}">${esc(x.name)} · ${esc(x.addr)}</option>`).join("")};fillSites();$("#j-c").onchange=fillSites;
 $("#njf").onsubmit=e=>{e.preventDefault();const d0=$("#j-d").value;if($("#j-en").value<=$("#j-st").value){toast("End time must be after start time");return}const n=+$("#j-r").value;for(let i=0;i<n;i++)S.jobs.push({id:uid(),clientId:$("#j-c").value,service:$("#j-s").value,date:addDays(d0,i*7),agent:$("#j-a").value,start:$("#j-st").value,end:$("#j-en").value,status:"Scheduled",site:$("#j-site-w").hidden?undefined:+$("#j-site").value});
  if(isAbsent($("#j-a").value,d0))toast("Heads up: this cleaner is off that day");
  if(req){req.status="Scheduled";log(req.clientId,"Request scheduled for "+fd(d0))}else log($("#j-c").value,(n>1?n+" jobs scheduled starting ":"Job scheduled for ")+fd(d0));
  selDay=d0;const wdT=(new Date(today()+"T12:00:00").getDay()+6)%7;weekOff=Math.floor((diff(d0)+wdT)/7);save();closeSheet();go("planning");toast(n>1?n+" jobs scheduled":"Job scheduled")}}

 sheet(`<form class="stack" id="ndf"><h2>${isF?"New invoice":"New quote"}</h2>
 <label class="f">Client<select id="d-c">${clientOpts(cid)}</select></label>
 <div class="row between"><span class="eyebrow">Services</span><span class="eyebrow">Quantity</span></div>

function initPad(cv){const r=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const x=cv.getContext("2d");x.scale(r,r);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#14302A";let draw=false,has=false,last=null;
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.addEventListener("pointerdown",e=>{draw=true;last=p(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
 cv.addEventListener("pointermove",e=>{if(!draw)return;const q=p(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(q[0],q[1]);x.stroke();last=q;has=true});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>draw=false));
 return{clear:()=>{x.clearRect(0,0,w,h);has=false},empty:()=>!has,data:()=>cv.toDataURL("image/png")}}

const IMPORT={
 clients:{title:"Import your clients",cols:["Name","Contact","Phone","Email","Address","Type","Status","Monthly potential"],ex:["Grand Atlantic Hotel","Mark Davis","(555) 123-4567","contact@grandatlantic.com","300 Ocean Dr, Miami, FL","Retail","Lead","540"],

  map:{name:["service","name","description","item"],unit:["unit","uom"],price:["price","rate","amount","cost"]}}};
const norm=s=>String(s??"").trim().toLowerCase();
function parseCSV(t){t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"";const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":(first.includes("\t")?"\t":",");
 const rows=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=ch}
 if(cur!==""||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()!==""))}
function mapRows(kind,rows){const spec=IMPORT[kind].map;const head=rows[0].map(norm);const idx={};
 for(const[k,al]of Object.entries(spec)){const i=head.findIndex(h=>al.some(a=>h===a||h.startsWith(a)));if(i>=0)idx[k]=i}
 const hasHead=Object.keys(idx).length>0;const body=hasHead?rows.slice(1):rows;
 if(!hasHead){Object.keys(spec).forEach((k,i)=>idx[k]=i)}
 return body.map(r=>{const o={};for(const k in idx)o[k]=String(r[idx[k]]??"").trim();return o}).filter(o=>o.name)}

function sImport(kind){const I=IMPORT[kind];pending=null;
 sheet(`<div class="stack"><h2>${I.title}</h2><div class="small muted">Excel file (.xlsx) or CSV. The first row holds the column titles, in any order.</div>

 <button class="btn" data-act="tpl" data-v="${kind}">Download the template</button>
 <label class="f">Choose your file<input type="file" id="imp-file" accept=".csv,.xlsx,.xls,text/csv"></label>
 <div id="imp-prev"></div>
 <div class="note">In the full version, SACKO CONCEPT imports your data for you: just send your file.</div></div>`);
 $("#imp-file").onchange=async e=>{const f=e.target.files[0];if(!f)return;let rows=[];
  try{if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX){toast("Excel reading unavailable here: save the file as CSV");return}const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""})}else rows=parseCSV(await f.text())}catch(err){toast("Unreadable file: check the format");return}
  if(!rows.length){toast("The file is empty");return}
  const items=mapRows(kind,rows);pending={kind,items};

function doImport(){if(!pending)return;const{kind,items}=pending;let n=0;
 if(kind==="clients"){const ST=Object.keys(STATUS),TY=["Residential","Business","HOA","Retail","Public sector"];
  items.forEach(o=>{if(S.clients.some(c=>norm(c.name)===norm(o.name)))return;const st=ST.find(x=>norm(x)===norm(o.status))||"Lead";const ty=TY.find(x=>norm(x)===norm(o.type))||"Business";

 if(f){const lab=f[0]||{devis:"Quote",facture:"Invoice",contrat:"Contract",bon:"Schedule",visite:"Visit"}[docTab];$("#fab").innerHTML=`<span>+</span>${lab}`}
 const q=$("#q");if(q)q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
 const sf=$("#setf");if(sf)sf.onsubmit=e=>{e.preventDefault();const g=k=>$("#s-"+k).value;Object.assign(S.settings,{name:g("name").trim()||S.settings.name,owner:g("owner"),tva:+g("tva")||0,addr:g("addr"),phone:g("phone"),email:g("email"),siret:g("siret"),delay:+g("delay")||30,iban:g("iban"),currency:g("cur"),m2:+g("m2")||0.04});Object.keys(fmtCache).forEach(k=>delete fmtCache[k]);save();render();toast("Settings saved")};
 const af=$("#absf");if(af)af.onsubmit=e=>{e.preventDefault();const f=$("#ab-f").value,t=$("#ab-t").value;if(t<f){toast("End date must be after start date");return}S.absences.push({id:uid(),agent:meAgent().name,from:f,to:t,reason:$("#ab-r").value,status:"Pending"});save();render();toast("Request sent to your manager")};
 const rf=$("#reqf");if(rf)rf.onsubmit=e=>{e.preventDefault();S.requests.push({id:uid(),clientId:me,date:today(),wanted:$("#r-d").value,service:$("#r-s").value,notes:$("#r-n").value.trim(),status:"New"});log(me,"Cleaning request sent: "+$("#r-s").value);save();render();toast("Request sent to "+S.settings.name)};
 const tf=$("#tkf");if(tf)tf.onsubmit=e=>{e.preventDefault();const m=$("#tk-m").value.trim();if(!m){toast("Write your message");return}S.tickets.push({id:uid(),clientId:me,date:today(),subject:$("#tk-s").value,msg:m,urgent:$("#tk-u").checked,status:"Open",reply:""});log(me,"Support message: "+$("#tk-s").value);save();render();toast("Message sent · "+S.settings.name+" will reply soon")};
 $$("[data-price]").forEach(inp=>inp.onchange=e=>{S.catalog[+e.target.dataset.price].price=+e.target.value||0;save();toast("Price updated")});
}
let keepSheet=false;
function go(v){if(location.hash!=="#"+v){keepSheet=true;location.hash=v}else{view=v;render();scrollTo(0,0)}}
function route(){view=location.hash.slice(1);if(!keepSheet)closeSheet();keepSheet=false;render();scrollTo(0,0)}
addEventListener("hashchange",route);

$("#fab").onclick=()=>{const f=FAB[view];if(!f)return;if(f[1]==="task")sNewTask();else if(f[1]==="client")sNewClient();else if(f[1]==="job")sNewJob();else if(f[1]==="rel")sNewRel();
 else if(docTab==="contrat")sContrat();else if(docTab==="visite")sVisite();else if(docTab==="bon")go("planning");else sDocForm(docTab)};

document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){closeSheet();go(g.dataset.go);return}
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(a==="close"){if(e.target===el)closeSheet();return}
 const D=()=>S.docs.find(x=>x.id===id);
 switch(a){
  case"close-btn":closeSheet();break;
  case"login-admin":mode="admin";me=null;saveUI();go("accueil");break;
  case"login-client":mode="client";me=$("#login-c").value;saveUI();go("c-accueil");break;
  case"switch":closeSheet();if(mode==="admin"){mode="client";me=S.clients.find(c=>c.id===me)?me:S.clients[0].id;saveUI();go("c-accueil")}else{mode="admin";saveUI();go("accueil")}break;
  case"switchagent":closeSheet();mode="agent";me=S.team[0].id;saveUI();go("a-jour");break;
  case"login-agent":mode="agent";me=$("#login-a").value;saveUI();go("a-jour");break;
  case"amenu":sAMenu();break;
  case"checkin":checkin(id);break;
  case"ajobdone":sBon(id);break;
  case"incident":sIncident(id);break;
  case"incok":{const i=S.incidents.find(x=>x.id===id);i.status="Handled";save();render();toast("Report handled");break}
  case"absok":case"absno":{const a=S.absences.find(x=>x.id===id);a.status=el.dataset.act==="absok"?"Approved":"Declined";save();render();toast(a.status==="Approved"?"Time off approved · check replacements in the schedule":"Time off declined");break}
  case"reassign":{const j=S.jobs.find(x=>x.id===id);const free=S.team.filter(a=>a.name!==j.agent&&!isAbsent(a.name,j.date));sheet(`<div class="stack"><h2>Replace ${esc(j.agent)}</h2><div class="small muted">${fd(j.date)} · ${j.start}–${j.end} · ${esc(client(j.clientId).name)}</div><div class="card list">${free.map(a=>{const busy=S.jobs.filter(x=>x.agent===a.name&&x.date===j.date&&x.status!=="Cancelled").length;return`<button class="item" data-act="doreassign" data-id="${j.id}" data-v="${esc(a.name)}"><div class="avatar av-s">${esc(a.name[0])}</div><span class="grow"><div class="t">${esc(a.name)}</div><div class="xs muted">${busy} job${busy>1?"s":""} that day</div></span><span aria-hidden="true">›</span></button>`}).join("")||`<div class="empty">No cleaner available.</div>`}</div></div>`);break}
  case"doreassign":{const j=S.jobs.find(x=>x.id===id);const old=j.agent;j.agent=el.dataset.v;log(j.clientId,`Job on ${fd(j.date)}: ${first(old)} replaced by ${first(j.agent)}`);save();closeSheet();render();toast(first(j.agent)+" will handle the job");break}
  case"print":try{window.print()}catch(e){toast("Printing unavailable here")}break;
  case"devisvisite":{const v=D();const pm={"One-off":1,"Once a week":4,"2–3 times a week":10,"Every day":22}[v.freq]||4;const pp=Math.max(40,Math.round(v.surface*(S.settings.m2||0.04)));const cat=n=>S.catalog.find(x=>x.name===n);const L=[{s:`${v.locaux} cleaning (${(+v.surface).toLocaleString("en-US")} sq ft) · per visit`,p:pp,q:pm}];
   if(v.sanitaires>2)L.push({s:`Additional restrooms (${v.sanitaires-2})`,p:10,q:(v.sanitaires-2)*pm});
   if((v.besoins||[]).includes("Windows"))L.push({s:"Window cleaning (monthly)",p:(cat("Window cleaning")||{price:8}).price,q:Math.max(1,Math.round(v.surface/150))});
   if((v.besoins||[]).includes("Disinfection"))L.push({s:"Full disinfection (monthly)",p:(cat("Full disinfection")||{price:220}).price,q:1});
   if((v.besoins||[]).includes("Carpet"))L.push({s:"Carpet shampooing (quarterly)",p:(cat("Carpet shampooing")||{price:0.6}).price,q:Math.round(v.surface*0.3)});
   sDocForm("devis",v.clientId,L);break}
  case"addsite":{const c=S.clients.find(x=>x.id===id);sheet(`<form class="stack" id="stf"><h2>New location · ${esc(c.name)}</h2><label class="f">Location name<input id="st-n" required placeholder="E.g. Warehouse, North branch…"></label><label class="f">Address<input id="st-a" required></label><label class="f">Access &amp; instructions<textarea id="st-c" rows="2" placeholder="Code, keys, contact person, hours…"></textarea></label><button class="btn primary" type="submit">Add location</button></form>`);
   $("#stf").onsubmit=ev=>{ev.preventDefault();c.sites=c.sites||[];if(!c.sites.length)c.sites.push({name:"Main location",addr:c.addr,access:c.access||""});c.sites.push({name:$("#st-n").value.trim(),addr:$("#st-a").value.trim(),access:$("#st-c").value.trim()});log(c.id,"Location added: "+$("#st-n").value.trim());save();sClient(c.id);toast("Location added")};break}
  case"logout":closeSheet();mode=null;saveUI();if(location.hash)location.hash="";render();break;
  case"menu":sMenu();break; case"cmenu":sCMenu();break; case"notifs":sNotifs();break;
  case"notifgo":closeSheet();if(el.dataset.tab)docTab=el.dataset.tab;if(el.dataset.go2==="relances")relTab="retard";go(el.dataset.go2);break;
  case"client":sClient(id);break;
  case"filter":filter=el.dataset.v;render();break;
  case"day":selDay=el.dataset.v;render();break;
  case"wk":weekOff+=+el.dataset.v;selDay="";render();break;
  case"reltab":relTab=el.dataset.v;render();break;
  case"doctab":docTab=el.dataset.v;render();break;
  case"doc":sDoc(id);break;
  case"rel":sRel(id);break;
  case"copymsg":copyText($("#msg").value);break;
  case"copytpl":copyText(TPL[el.dataset.k][+el.dataset.i]({...TPLCTX,ent:S.settings.name}));break;
  case"relres":{const r=S.rel.find(x=>x.id===id);r.status="done";r.result=el.dataset.v;if(r.due>today())r.due=today();const c=S.clients.find(x=>x.id===r.clientId);log(r.clientId,`Follow-up${r.total>1?" "+r.step+"/"+r.total:""} (${RTYPE[r.type][0]}, ${r.channel}): ${r.result}`);
   if(r.result==="Declined"){if(r.docId)S.rel.forEach(x=>{if(x.docId===r.docId&&x.status==="open")x.status="cancel"});else S.rel.forEach(x=>{if(x.clientId===r.clientId&&x.type===r.type&&x.status==="open")x.status="cancel"});if(r.type==="devis"){const d=S.docs.find(x=>x.id===r.docId);if(d)d.status="Declined"}if(r.type==="prospect"&&c)c.status="Lost"}
   if(r.result==="Call back later")addRel(r.clientId,r.type,off(3),r.docId,r.step,r.total);
   if(r.result==="Interested"&&c&&c.status==="Lead")c.status="Negotiation";
   save();closeSheet();render();toast("Follow-up saved to history");break}
  case"relpush":{const r=S.rel.find(x=>x.id===id);r.due=addDays(r.due<today()?today():r.due,2);save();closeSheet();render();toast("Postponed to "+fd(r.due));break}
  case"newdoc":sDocForm(el.dataset.type,id);break;
  case"newcontrat":sContrat(id);break; case"newvisite":sVisite(id);break; case"newjob":sNewJob(id);break; case"newrel":sNewRel(id);break;
  case"qa-devis":sDocForm("devis");break; case"qa-facture":sDocForm("facture");break; case"qa-job":sNewJob();break; case"qa-client":sNewClient();break;
  case"jobdone":sBon(id);break;
  case"jobcancel":{const j=S.jobs.find(x=>x.id===id);j.status="Cancelled";log(j.clientId,"Job on "+fd(j.date)+" cancelled");save();render();break}
  case"accept":{const d=D();acceptDevis(d);save();render();sDoc(id);toast("Quote accepted · follow-ups stopped");break}
  case"refuse":{const d=D();d.status="Declined";cancelRels(d.id);log(d.clientId,`Quote ${d.num} declined`);save();render();sDoc(id);break}
  case"signdoc":sSign(id);break;
  case"deposit":{const d=D();const amt=Math.round(ht(d)*0.3*100)/100;const f={id:uid(),type:"facture",kind:"acompte",num:nextNum("facture"),clientId:d.clientId,date:today(),ref:d.num,lines:[{s:"30% deposit on quote "+d.num,u:"flat rate",p:amt,q:1}],pays:[]};d.deposit=f.id;S.docs.push(f);seqFacture(f);log(d.clientId,`Deposit invoice ${f.num} issued (${eur(ttc(f))})`);save();docTab="facture";render();sDoc(f.id);toast("Deposit invoice issued");break}
  case"invoice":{const d=D();const lines=JSON.parse(JSON.stringify(d.lines)).map(l=>({...l,p:Math.round(l.p*(1-(d.remise||0)/100)*100)/100}));const dep=S.docs.find(x=>x.id===d.deposit);if(dep)lines.push({s:"Deposit already invoiced ("+dep.num+")",u:"flat rate",p:-ht(dep),q:1});
   const f={id:uid(),type:"facture",num:nextNum("facture"),clientId:d.clientId,date:today(),ref:d.num,lines,pays:[]};d.status="Invoiced";S.docs.push(f);seqFacture(f);log(d.clientId,`Invoice ${f.num} issued from ${d.num}`);save();docTab="facture";render();sDoc(f.id);toast("Invoice "+f.num+" issued");break}
  case"tocontrat":sContrat(D().clientId);break; case"tojob":sNewJob(D().clientId);break;
  case"pay":sPay(id);break; case"cpay":sCPay(id);break;
  case"confirmpay":{const d=D();const p=d.pays.find(x=>x.id===el.dataset.p);p.ok=true;if(reste(d)<=0)cancelRels(d.id);log(d.clientId,`Payment confirmed: ${eur(p.amount)}`);save();render();sDoc(id);toast("Payment confirmed");break}
  case"remind":{const d=D();const r={type:"paiement",step:diff(due(d))<-7?2:1,clientId:d.clientId,docId:d.id};$("#extra").innerHTML=`<div class="stack"><textarea id="msg" class="ta" aria-label="Reminder message">${esc(msgFor(r))}</textarea><button class="btn dark" data-act="copymsg">Copy message</button></div>`;break}
  case"avoir":{const d=D();const av={id:uid(),type:"avoir",num:nextNum("avoir"),clientId:d.clientId,date:today(),ref:d.num,lines:JSON.parse(JSON.stringify(d.lines)),remise:d.remise||0};d.cancelled=true;cancelRels(d.id);S.docs.push(av);log(d.clientId,`Credit note ${av.num} issued for ${d.num}`);save();render();sDoc(av.id);toast("Credit note issued · invoice cancelled");break}
  case"rate":sRate(id);break;
  case"planreq":{const r=S.requests.find(x=>x.id===id);sNewJob(r.clientId,r);break}
  case"refusereq":{const r=S.requests.find(x=>x.id===id);r.status="Declined";log(r.clientId,"Cleaning request declined");save();render();break}
  case"stk":{const s=S.stock.find(x=>x.id===id);s.qty=Math.max(0,s.qty+ +el.dataset.v);save();render();break}
  case"addstock":sAddStock();break;
  case"addagent":sheet(`<form class="stack" id="aaf"><h2>New cleaner</h2><label class="f">Name<input id="aa-n" required></label><div class="grid2"><label class="f">Role<input id="aa-r" value="Cleaner"></label><label class="f">Hourly rate (${curSym()})<input id="aa-t" type="number" step="any" value="18"></label></div><button class="btn primary" type="submit">Add</button></form>`);
   $("#aaf").onsubmit=ev=>{ev.preventDefault();S.team.push({id:uid(),name:$("#aa-n").value.trim(),role:$("#aa-r").value,rate:+$("#aa-t").value||0});save();closeSheet();render();toast("Cleaner added")};break;
  case"addsvc":sheet(`<form class="stack" id="nsf"><h2>New service</h2><label class="f">Name<input id="v-n" required></label><div class="grid2"><label class="f">Unit<select id="v-u">${opts(["visit","hour","sq ft","flat rate","unit"])}</select></label><label class="f">Price excl. tax<input id="v-p" type="number" step="any" required></label></div><button class="btn primary" type="submit">Add</button></form>`);
   $("#nsf").onsubmit=ev=>{ev.preventDefault();S.catalog.push({name:$("#v-n").value.trim(),unit:$("#v-u").value,price:+$("#v-p").value||0});save();closeSheet();render();toast("Service added")};break;
  case"offer":sOffer();break;
  case"tkreply":{const t=S.tickets.find(x=>x.id===id);const v=($("#rep-"+id)||{}).value||"";if(!v.trim()){toast("Write a reply");break}t.reply=v.trim();t.status="Resolved";t.repliedAt=today();log(t.clientId,"Support: reply sent ("+t.subject+")");save();render();toast("Reply sent to the client");break}
  case"tdone":{const t=S.tasks.find(x=>x.id===id);t.done=!t.done;if(t.done&&t.repeat!=="none"&&!t.spawned){t.spawned=true;S.tasks.push({...t,id:uid(),date:addDays(t.date,t.repeat==="weekly"?7:1),done:false,notified:false,spawned:false})}save();render();if(t.done)toast(t.repeat!=="none"?"Done · next one on "+fd(addDays(t.date,t.repeat==="weekly"?7:1)):"Task done");break}
  case"tdel":{S.tasks=S.tasks.filter(x=>x.id!==id);save();render();toast("Task deleted");break}
  case"tday":taskDay=el.dataset.v;render();break;
  case"twk":taskWeekOff+=+el.dataset.v;taskDay="";render();break;
  case"notifperm":try{Notification.requestPermission().then(()=>render(),()=>toast("Reminders blocked by the browser"))}catch(e){toast("Reminders unavailable here")}break;
  case"import":sImport(el.dataset.v);break; case"tpl":downloadTpl(el.dataset.v);break; case"doimport":doImport();break;
  case"reset":if(el.dataset.confirm){S=seed();save();filter="All";query="";weekOff=0;selDay=today();go("accueil");toast("Demo reset")}else{el.dataset.confirm="1";el.textContent="Tap again to confirm"}break;
 }
});
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2600)}
view=location.hash.slice(1);render();setTimeout(checkReminders,3000);
})();
</script>
