.splash .n{font-family:var(--display);font-size:36px;font-weight:800;color:#fff;opacity:0;animation:fade .8s 1s forwards}
.splash .n em{font-style:normal;color:#6BBF94}
@keyframes glow{from{transform:scale(.85);opacity:0;filter:brightness(.4)}to{transform:none;opacity:1;filter:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.splash img,.splash .p,.splash .n{animation:none;opacity:1}}
.pitch{background:linear-gradient(145deg,#0E0E0E,#1E1A12);color:#F2E6C6;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pitch .eyebrow{color:#E2BC69}
.note{background:var(--gold-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px}
.note svg{width:20px;height:20px;flex:none}
button.kpi{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.paper p{margin:8px 0}
.sheet .paper{margin-top:4px}
input[type=file]{font:inherit;font-size:13px;color:var(--muted);width:100%;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:13px;margin-right:10px;padding:9px 14px;border:0;border-radius:10px;background:var(--forest);color:var(--on-forest);cursor:pointer}
input[type=file]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};

const emp=id=>S.emp.find(e=>e.id===id)||{first:"?",last:"",job:"",dept:"",contract:"",id:""};
const full=e=>e.first+" "+e.last;
const ini=e=>(e.first[0]||"")+(e.last[0]||"");
const actives=()=>S.emp.filter(e=>e.status==="Active");
function workDays(f,t){let n=0,d=f;const wd=S.settings.wd||5;let guard=0;while(d<=t&&guard<400){const k=new Date(d+"T12:00:00").getDay();if(k!==0&&(wd===6||k!==6))n++;d=addDays(d,1);guard++}return n}
const ldays=l=>l.half?0.5:workDays(l.from,l.to);
function bal(e){const y=today().slice(0,4)+"-01-01";const from=e.start>y?e.start:y;
 const months=Math.max(0,Math.floor((new Date(today()+"T12:00:00")-new Date(from+"T12:00:00"))/(864e5*30.44)));
 const acq=Math.min(months*(+S.settings.cp||1.25),(+S.settings.cp||1.25)*12);
 const L=S.leaves.filter(l=>l.empId===e.id&&l.type==="Paid time off"&&l.status==="Approved"&&l.from>=y);
 const taken=L.filter(l=>l.from<=today()).reduce((a,l)=>a+ldays(l),0),planned=L.filter(l=>l.from>today()).reduce((a,l)=>a+ldays(l),0);
 const rec=S.leaves.filter(l=>l.empId===e.id&&l.type==="Comp time"&&l.status==="Approved").reduce((a,l)=>a+ldays(l),0);
 return{acq,rel:+e.reliquat||0,taken,planned,solde:Math.round((acq+(+e.reliquat||0)-taken-planned)*10)/10,rec}}
const onLeave=(eid,date)=>S.leaves.find(l=>l.empId===eid&&l.status==="Approved"&&date>=l.from&&date<=l.to);
const seniority=e=>{const d=-diff(e.start);if(d<0)return"starts "+fd(e.start);const y=Math.floor(d/365.25),m=Math.floor((d%365.25)/30.44);return y?`${y} yr${y>1?"s":""}${m?" "+m+" mo":""}`:m?m+" mo":d+" days"};
function weekMon(o){const d=new Date(today()+"T12:00:00");const k=(d.getDay()+6)%7;return off(-k+7*(o||0))}
function weekDays(o){const m=weekMon(o);return[0,1,2,3,4,5,6].map(i=>addDays(m,i))}
function shiftMin(s){let a=toMin(s.start),b=toMin(s.end);if(b<=a)b+=1440;return b-a-(b-a>=360?30:0)}
function punchMin(p){if(!p.in||!p.out)return 0;let a=toMin(p.in),b=toMin(p.out);if(b<=a)b+=1440;return b-a-(b-a>=360?30:0)}
function weekHours(eid,o){const days=weekDays(o);return S.punches.filter(p=>p.empId===eid&&days.includes(p.date)).reduce((a,p)=>a+punchMin(p),0)}
function presence(date){const sh=S.shifts.filter(s=>s.date===date);return sh.map(s=>{const p=S.punches.find(x=>x.empId===s.empId&&x.date===date);const lv=onLeave(s.empId,date);const late=p?toMin(p.in)-toMin(s.start):0;
 let st;if(lv)st="Absent·"+lv.type;else if(p&&p.out)st="Left";else if(p)st=late>5?"Late":"Present";else if(date<today()||(date===today()&&toMin(nowHM())>toMin(s.start)+15))st="No clock-in";else st="Upcoming";return{s,p,lv,late,st}})}
function absRate(){const from=off(-90),days=workDays(from,today());const n=actives().length||1;
 const ab=S.leaves.filter(l=>l.status==="Approved"&&ABST.includes(l.type)&&l.to>=from&&l.from<=today()).reduce((a,l)=>a+workDays(l.from<from?from:l.from,l.to>today()?today():l.to),0);
 return Math.round(ab/(n*days)*1000)/10}
function turnover(){const ex=S.emp.filter(e=>e.status==="Former"&&e.exit&&diff(e.exit)>=-365).length;const avg=actives().length+ex/2;return avg?Math.round(ex/avg*1000)/10:0}
const charged=v=>v*(1+(+S.settings.charges||0)/100);
function massMonth(ym){const st=ym+"-01",en=ym+"-28";return S.emp.filter(e=>e.start<=en&&(!e.exit||e.exit>=st)).reduce((a,e)=>a+(+e.salary||0),0)}
function months6(){const m=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);m.push(iso(d).slice(0,7))}return m}
function lastReview(eid){return S.reviews.filter(r=>r.empId===eid&&r.status==="Completed").sort((a,b)=>b.date.localeCompare(a.date))[0]}
function bdayIn(e){if(!e.birth)return 999;const t=today(),y=+t.slice(0,4);let d=y+e.birth.slice(4);if(d<t)d=(y+1)+e.birth.slice(4);return diff(d)}
function age(e){if(!e.birth)return"";const b=new Date(e.birth+"T12:00:00"),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
function reminders(){const out=[],R=(cat,e,days,text,cls,acts)=>out.push({id:cat+e.id,cat,e,days,text,cls,acts});
 actives().forEach(e=>{
  if(e.trial&&!e.trialOk){const d=diff(e.trial);if(d<=(+S.settings.remTrial||15)&&d>=-5)R("Probation",e,d,d<0?`Probation ended ${-d} d ago: confirm the hire`:`Probation ends ${d?"in "+d+" d":"today"} (${fd(e.trial)})`,d<=3?"p-red":"p-amber",[["trialok","Confirm hire"],["trialext","Extend"]])}
  if(e.end&&["Seasonal","Temp","Part-time"].includes(e.contract)){const d=diff(e.end);if(d<=(+S.settings.remCdd||30)&&d>=-7)R("Contract end",e,d,d<0?`Contract ended ${-d} d ago: take action`:`Contract ends ${d?"in "+d+" d":"today"} (${fd(e.end)})`,d<=10?"p-red":"p-amber",[["renew","Renew"],["tocdi","Convert to full-time"],["endc","Prepare offboarding"]])}
  if(e.end&&e.contract==="Internship"){const d=diff(e.end);if(d<=45&&d>=-7)R("Internship end",e,d,`Internship ends ${d?"in "+d+" d":"today"} (${fd(e.end)})`,"p-blue",[["attest","Internship certificate"],["endc","Prepare offboarding"]])}
  if(e.medical){const d=diff(e.medical);if(d<=30)R("Certification",e,d,d<0?`Safety certification overdue by ${-d} d`:`Safety certification renewal due ${d?"in "+d+" d":"today"}`,d<0?"p-red":"p-amber",[["medtask","Schedule"],["medok","Renewed"]])}
  const b=bdayIn(e);if(b<=7)R("Birthday",e,b,b?`Birthday in ${b} d (turning ${age(e)+1})`:`Birthday today (${age(e)}) 🎉`,"p-gold",[["wish","Birthday message"]]);
  const lr=lastReview(e.id),pl=S.reviews.some(r=>r.empId===e.id&&r.status==="Scheduled");
  if(!pl&&-diff(e.start)>330&&(!lr||diff(lr.date)<-330))R("Annual review",e,lr?365+diff(lr.date):0,lr?`Last review on ${fdy(lr.date)}: schedule the next one`:"No annual review yet: schedule one","p-blue",[["planrev","Schedule"]])});
 return out.sort((a,b)=>a.days-b.days)}

 <div class="xs muted">The employee is notified automatically in their space${l.status==="Pending"?" as soon as you decide":""}.</div></div>`)}
function sNewLeave(eid,kind){const ab=kind==="abs";sheet(`<form class="stack" id="lf"><h2>${ab?"Log an absence":"Log time off"}</h2><label class="f">Employee<select id="l-e">${empOpts(eid)}</select></label><label class="f">Type<select id="l-t">${opts(ab?ABST:CONGES,ab?"Sick leave":"Paid time off")}</select></label><div class="grid2"><label class="f">From<input id="l-f" type="date" value="${today()}" required></label><label class="f">To<input id="l-to" type="date" value="${today()}" required></label></div><label class="f">Reason / comment<input id="l-r"></label><label class="f">${ab?"Supporting document (doctor's note…)":"Supporting document · optional"}<input id="l-j" type="file"></label>${ab?`<label class="ck"><input type="checkbox" id="l-u">Unexcused absence (deducted from pay)</label>`:""}<button class="btn primary" type="submit">${ab?"Log the absence":"Log the time off (approved)"}</button></form>`);
 $("#lf").onsubmit=ev=>{ev.preventDefault();const f=$("#l-f").value,t=$("#l-to").value;if(t<f){toast("End date must be after start date");return}const j=$("#l-j").files[0];S.leaves.push({id:uid(),empId:$("#l-e").value,type:$("#l-t").value,from:f,to:t,status:"Approved",reason:$("#l-r").value,justif:j?j.name:"",unj:ab&&$("#l-u").checked,date:today()});save();closeSheet();render();toast(ab?"Absence logged · schedule and payroll updated":"Time off logged · schedule and balances updated")}}

function sShift(id,date){const s=id?S.shifts.find(x=>x.id===id):{empId:"",date:date||selDay||today(),start:"09:00",end:"17:00",post:""};
 sheet(`<form class="stack" id="sf"><h2>${id?"Edit shift":"New shift"}</h2><label class="f">Employee<select id="s-e">${empOpts(s.empId)}</select></label><label class="f">Date<input id="s-d" type="date" value="${s.date}" required></label><div class="grid2"><label class="f">Start<input id="s-s" type="time" value="${s.start}" required></label><label class="f">End<input id="s-en" type="time" value="${s.end}" required></label></div><div><div class="xs muted" style="margin-bottom:6px">Shift templates</div><div class="chips" style="margin:0;flex-wrap:wrap;overflow:visible">${stpl().map((t,i)=>`<button type="button" class="chip" data-act="stpl" data-v="${i}">${esc(t[0])} · ${t[1]}–${t[2]}</button>`).join("")}</div></div>
 <label class="f">Position / task<input id="s-p" value="${esc(s.post)}" placeholder="Morning, dinner service…"></label>
 ${id?"":`<div><div class="xs muted" style="margin-bottom:6px">Also repeat this shift on…</div><div class="chips" style="margin:0;flex-wrap:wrap;overflow:visible" id="s-rep">${(()=>{const m=addDays(s.date,-((new Date(s.date+"T12:00:00").getDay()+6)%7));return[0,1,2,3,4,5,6].map(i=>addDays(m,i))})().map(d=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" value="${d}" style="accent-color:var(--accent)">${JOURS[new Date(d+"T12:00:00").getDay()]} ${+d.slice(8)}</label>`).join("")}</div></div>`}
 <button class="btn primary" type="submit">Save</button>${id?`<button class="btn danger" type="button" data-act="delshift" data-id="${id}">Delete shift</button>`:""}</form>`);
 $("#sf").onsubmit=ev=>{ev.preventDefault();const o={empId:$("#s-e").value,date:$("#s-d").value,start:$("#s-s").value,end:$("#s-en").value,post:$("#s-p").value.trim()||"Shift"};
  if(onLeave(o.empId,o.date))toast("Heads up: "+emp(o.empId).first+" is off that day");
  if(id)Object.assign(s,o);else S.shifts.push(Object.assign({id:uid()},o));
  let extra=0,skip=0;if(!id)[...document.querySelectorAll("#s-rep input:checked")].map(x=>x.value).filter(d=>d!==o.date).forEach(d=>{if(S.shifts.some(x=>x.empId===o.empId&&x.date===d)||onLeave(o.empId,d)){skip++;return}S.shifts.push(Object.assign({id:uid()},o,{date:d}));extra++});
  selDay=o.date;save();closeSheet();render();if(extra||skip)toast((extra+1)+" shift"+(extra?"s":"")+" saved"+(skip?" · "+skip+" day"+(skip>1?"s":"")+" skipped (already scheduled or off)":" · the employee sees them in their schedule"));else if(!onLeave(o.empId,o.date))toast("Shift saved · the employee sees it in their schedule")}}

const CMSG={
 "Received":c=>`Hi ${c.first},\n\nThank you for applying for the ${c.job} position. We have received your application and our team is reviewing it carefully. We'll get back to you within 10 days.\n\nBest regards,\n${S.settings.owner}\n${S.settings.name}`,
 "Interview":c=>`Hi ${c.first},\n\nYour profile caught our attention for the ${c.job} position. We'd love to meet you on ${c.interview?fdy(c.interview):"[date]"} at ${c.itime||"[time]"} at the following address: ${S.settings.addr}.\n\nPlease confirm that you can attend.\n\n${S.settings.owner}\n${S.settings.name}`,
 "Hired":c=>`Hi ${c.first},\n\nWe're happy to let you know that you've been selected for the ${c.job} position. Welcome to the team! We'll be in touch very soon about your start date and your employment agreement.\n\n${S.settings.owner}\n${S.settings.name}`,
 "Rejected":c=>`Hi ${c.first},\n\nThank you for your interest in ${S.settings.name}. After careful review, we will not be moving forward with your application for the ${c.job} position. We'll keep your resume on file and will reach out if a suitable opportunity opens up.\n\nWe wish you every success.\n\n${S.settings.owner}\n${S.settings.name}`};

 sheet(`<div class="stack"><div class="row"><span class="avatar" aria-hidden="true">${esc(c.first[0]+c.last[0])}</span><div class="grow"><h2>${esc(c.first+" "+c.last)}</h2><div class="xs muted">${esc(c.job)} · ${esc(c.source)} · ${c.ref}</div></div><span class="pill ${SCLS[c.stage]}">${c.stage}</span></div>
 <div class="card pad"><dl class="kv"><dt>Email</dt><dd style="user-select:all">${esc(c.email)}</dd><dt>Phone</dt><dd style="user-select:all">${esc(c.phone)}</dd><dt>Received</dt><dd>${fdy(c.date)}</dd><dt>Resume</dt><dd>📎 ${esc(c.cv)}${c.cvData?` · <a href="${c.cvData}" download="${esc(c.cv)}" style="color:var(--accent)">open</a>`:""}</dd></dl></div>
 ${c.letter?`<div class="card pad"><div class="eyebrow" style="margin-bottom:6px">Cover letter</div><div class="small">${esc(c.letter)}</div></div>`:""}
 <div class="row between"><span class="eyebrow">Your rating</span><div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button class="${n<=c.rating?"on":""}" data-act="crate" data-id="${id}" data-v="${n}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div></div>
 <label class="f">Internal notes<textarea id="c-notes" rows="2" placeholder="Impressions, availability, salary expectations…">${esc(c.notes)}</textarea></label>
 <div class="eyebrow">Move to</div><div class="grid2">${STAGES.filter(s=>s!==c.stage).map(s=>`<button class="btn ${s==="Hired"?"primary":s==="Rejected"?"danger":""}" data-act="cstage" data-id="${id}" data-v="${s}">${s==="Interview"?"Invite to interview":s}</button>`).join("")}</div>
 ${c.stage==="Interview"?`<div class="grid2"><label class="f">Interview date<input id="c-d" type="date" value="${c.interview||addDays(today(),3)}"></label><label class="f">Time<input id="c-h" type="time" value="${c.itime||"10:00"}"></label></div><button class="btn sm" data-act="cdate" data-id="${id}">Save the date</button>`:""}
 <div class="eyebrow">Ready-to-send message (${c.stage.toLowerCase()})</div><textarea class="ta" id="msg">${esc(m)}</textarea>
 <div class="btns"><button class="btn primary" data-act="copymsg">Copy</button><a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent("Your application · "+c.job+" · "+S.settings.name)}&body=${encodeURIComponent(m)}">Email</a><a class="btn" href="sms:${c.phone.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(m)}">SMS</a></div>
 ${c.stage==="Hired"&&!c.hired?`<button class="btn gold block" data-act="hire" data-id="${id}">Hire: create the employee record</button>`:c.hired?`<div class="note">Hired · employee record created.</div>`:""}</div>`);
 const n=$("#c-notes");if(n)n.onchange=()=>{c.notes=n.value;save();toast("Notes saved")}}
function sJobs(){sheet(`<div class="stack"><div class="row between"><h2>Job posts</h2><button class="btn primary sm" data-act="jobedit">+ New job post</button></div><div class="small muted">Check to publish on your careers page, tap a post to edit it.</div><div class="card list">${S.jobsOpen.map(j=>{const n=S.cands.filter(c=>c.job===j.title).length;const late=j.deadline&&j.deadline<today();return`<div class="item"><button class="grow" data-act="jobedit" data-id="${j.id}" style="background:none;border:0;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer"><div class="t">${esc(j.title)}</div><div class="xs muted">${j.contract} · ${esc(j.dept)} · ${n} candidate${n>1?"s":""}${j.deadline?` · ${late?"closed":"until"} ${fd(j.deadline)}`:""}</div></button><input type="checkbox" data-act="jobtog" data-id="${j.id}" ${j.open?"checked":""} style="width:20px;height:20px;accent-color:var(--accent)" aria-label="Publish ${esc(j.title)}"></div>`}).join("")||`<div class="empty">No job posts yet.</div>`}</div>
 <button class="btn block" data-act="copycareer">Copy the careers page link</button></div>`)}
function sJobForm(id){const j=id?S.jobsOpen.find(x=>x.id===id):{title:"",contract:"Full-time",dept:DEPTS[0],loc:S.settings.city,salary:"",hours:"",desc:"",profile:"",deadline:"",open:true};
 sheet(`<form class="stack" id="jf"><h2>${id?"Edit job post":"New job post"}</h2><label class="f">Job title<input id="j-t" required value="${esc(j.title)}" placeholder="Front desk agent, accountant, nurse…"></label>
 <div class="grid2"><label class="f">Employment type<select id="j-c">${opts(CONTRATS,j.contract)}</select></label><label class="f">Department<select id="j-d">${opts(DEPTS.includes(j.dept)?DEPTS:[j.dept,...DEPTS],j.dept)}</select></label></div>
 <div class="grid2"><label class="f">Location<input id="j-l" value="${esc(j.loc||"")}"></label><label class="f">Pay (optional)<input id="j-s" value="${esc(j.salary||"")}" placeholder="Based on experience"></label></div>
 <div class="grid2"><label class="f">Hours<input id="j-h" value="${esc(j.hours||"")}" placeholder="Full-time, rotating shifts, weekends…"></label><label class="f">Deadline<input id="j-dl" type="date" value="${j.deadline||""}"></label></div>
 <label class="f">Responsibilities<textarea id="j-x" rows="3" required placeholder="What the person will do day to day">${esc(j.desc||"")}</textarea></label>
 <label class="f">Requirements<textarea id="j-p" rows="2" placeholder="Experience, languages, qualities…">${esc(j.profile||"")}</textarea></label>
 <label class="ck"><input type="checkbox" id="j-o" ${j.open?"checked":""}>Publish on the careers page</label>

 $("#jf").onsubmit=ev=>{ev.preventDefault();const g=k=>$("#j-"+k).value.trim();const o={title:g("t"),contract:$("#j-c").value,dept:$("#j-d").value,loc:g("l"),salary:g("s"),hours:g("h"),deadline:$("#j-dl").value,desc:g("x"),profile:g("p"),open:$("#j-o").checked};
  if(id){const old=j.title;Object.assign(j,o);if(old!==o.title)S.cands.forEach(c=>{if(c.job===old)c.job=o.title})}else S.jobsOpen.push(Object.assign({id:uid()},o));save();render();sJobs();toast(id?"Job post updated":o.open?"Job post published on your careers page":"Job post saved (not published)")}}

/* ---------- DOCUMENTS ---------- */
function sNewDoc(){sheet(`<div class="stack"><h2>New document</h2><div class="small muted">Pre-filled from the employee record, ready to sign online.</div><div class="card list">${[["attestation","Employment verification letter","In 1 tap, when an employee asks"],["contrat","Employment agreement","Full-time, seasonal, internship"],["avenant","Contract amendment","Job, pay, hours, renewal"],["bulletin","Pay stub","Calculated automatically in the Payroll tab"],["explication","Request for explanation","The employee replies and signs in the app"],["avertissement","Written warning","Delivered and signed electronically"],["note","Memo","Sent to everyone or one department, with read receipts"],["certificat","Certificate of employment","At the end of employment"]].map(([k,t,s])=>`<button class="item" data-act="mkdoc" data-t="${k}"><span class="grow"><div class="t">${t}</div><div class="xs muted">${s}</div></span><span aria-hidden="true">›</span></button>`).join("")}</div></div>`)}
function sDocForm(type,eid,pre){pre=pre||{};const e=eid?emp(eid):actives()[0];const T=DOCT[type][0];let f="";
 if(type!=="note")f+=`<label class="f">Employee<select id="d-e">${type==="certificat"?S.emp.map(x=>`<option value="${x.id}" ${x.id===(eid||"")?"selected":""}>${esc(full(x))}${x.status==="Former"?" (former)":""}</option>`).join(""):empOpts(eid)}</select></label>`;
 if(type==="attestation")f+=`<label class="f">Purpose of the request (optional)<input id="d-motif" value="${esc(pre.motif||"")}" placeholder="apartment rental, bank, visa…"></label>`;
 if(type==="contrat")f+=`<div class="grid2"><label class="f">Type<select id="d-ct">${opts(["Full-time","Part-time","Seasonal","Internship"],pre.ctype||(["Part-time","Seasonal","Internship"].includes(e.contract)?e.contract:"Full-time"))}</select></label><label class="f">Probation period<input id="d-tr" value="${esc(pre.trialTxt||"90 days")}"></label></div><div class="grid2"><label class="f">Start<input id="d-s" type="date" value="${pre.cstart||e.start||today()}"></label><label class="f">End (seasonal, internship)<input id="d-en" type="date" value="${pre.cend!=null?pre.cend:e.end||""}"></label></div><label class="f">Reason for fixed term<input id="d-mo" value="${esc(pre.motif||e.motif||"")}"></label><label class="f">Special clauses (optional)<textarea id="d-cl" rows="3" placeholder="Bonus, benefits, specific hours…">${esc(pre.clauses||"")}</textarea></label>${S.settings.clauses?`<div class="xs muted">Your company clauses (Settings) are added automatically.</div>`:""}`;
 if(type==="avenant")f+=`<label class="f">Purpose of the amendment<select id="d-ob2">${opts(["Job change","Pay raise","Schedule change","Contract renewal","Other change"],pre.objet||"Pay raise")}</select></label><label class="f">Effective date<input id="d-ef" type="date" value="${pre.effet||addDays(today(),7)}" required></label>
 <div class="grid2"><label class="f">Job title<input id="d-np" value="${esc(pre.job||e.job)}"></label><label class="f">Monthly gross salary<input id="d-ns" type="number" value="${pre.salary||e.salary||""}"></label></div><label class="f">New end date (seasonal, internship)<input id="d-ne" type="date" value="${pre.end!=null?pre.end:e.end||""}"></label><label class="f">Details (optional)<textarea id="d-tx" rows="3" placeholder="E.g. new hours Monday to Friday, 8 am – 4 pm">${esc(pre.txt||"")}</textarea></label><div class="xs muted">Once the employee signs, their record is updated automatically.</div>`;
 if(type==="explication")f+=`<label class="f">Date of the facts<input id="d-fd" type="date" value="${off(-1)}"></label><label class="f">Facts observed<textarea id="d-faits" rows="3" required placeholder="Describe the facts precisely and neutrally"></textarea></label><label class="f">Reply deadline<select id="d-del"><option value="48">48 hours</option><option value="72" selected>72 hours</option><option value="120">5 days</option></select></label>`;
 if(type==="avertissement")f+=`<label class="f">Facts<textarea id="d-faits" rows="3" required></textarea></label><label class="f">Policy not followed<input id="d-ob" placeholder="punctuality, employee handbook section 6…" value="the employee handbook"></label>`;
 if(type==="note")f+=`<label class="f">Subject<input id="d-obj" required></label><label class="f">Recipients<select id="d-dest">${opts(["All",...DEPTS],"All")}</select></label><label class="f">Effective date<input id="d-eff" type="date" value="${today()}"></label><label class="f">Content<textarea id="d-body" rows="5" required></textarea></label>`;
 if(type==="certificat")f+=`<label class="f">Employment end date<input id="d-ex" type="date" value="${e.exit||e.end||today()}"></label>`;
 sheet(`<form class="stack" id="df"><h2>${pre.editId?"Edit · "+T:T}</h2>${f}<button class="btn primary" type="submit">${pre.editId?"Save changes":"Create document"}</button><div class="xs muted" style="text-align:center">Templates adapted to your state's and country's labor laws in the full version.</div></form>`);
 $("#df").onsubmit=ev=>{ev.preventDefault();const v=k=>{const x=$("#d-"+k);return x?x.value.trim():""};const p=DOCT[type][1];const d={id:uid(),type,num:nextNum(p),empId:type==="note"?null:v("e"),date:today()};
  if(type==="attestation")Object.assign(d,{motif:v("motif"),status:"Issued"});
  if(type==="certificat"){Object.assign(d,{exit:v("ex"),status:"Issued"})}
  if(type==="contrat")Object.assign(d,{ctype:v("ct"),trialTxt:v("tr"),cstart:v("s"),cend:v("en"),motif:v("mo"),clauses:v("cl"),status:"To sign"});
  if(type==="avenant")Object.assign(d,{objet:v("ob2"),effet:v("ef"),job:v("np"),salary:+v("ns")||0,end:v("ne"),txt:v("tx"),status:"To sign"});
  if(pre.editId){const o=S.docs.find(x=>x.id===pre.editId);const keep={id:o.id,num:o.num,date:o.date};Object.keys(d).forEach(k=>{if(!(k in keep))o[k]=d[k]});log(DOCT[type][0]+" "+o.num+" edited");save();render();sDoc(o.id);toast("Edited · the employee sees the new version to sign");return}
  if(type==="explication")Object.assign(d,{faits:v("faits"),factsDate:v("fd"),delay:+v("del"),status:"Awaiting reply"});
  if(type==="avertissement")Object.assign(d,{faits:v("faits"),oblig:v("ob"),status:"To sign"});
  if(type==="note")Object.assign(d,{objet:v("obj"),dest:v("dest"),effet:v("eff"),body:v("body"),status:"Published",reads:[]});
  if(pre.reqId){const r=S.docReq.find(x=>x.id===pre.reqId);if(r)r.status="Issued"}
  S.docs.push(d);log(DOCT[type][0]+" "+d.num);save();tick("doc");render();sDoc(d.id);toast(type==="note"?"Memo published · each employee confirms they've read it":["attestation","certificat"].includes(type)?"Document ready · sent to the employee's space":"Sent to the employee for signature")}}

function paperHead(d,title){const e=d.empId?emp(d.empId):null;return`<div class="band"></div>
 <div class="row between" style="align-items:flex-start;gap:8px"><div style="min-width:0"><b style="font-size:13.5px;color:#1E5B41">${esc(S.settings.name)}</b><div style="color:#6b7a72;font-size:10.5px">${esc(S.settings.addr)}<br>${esc(S.settings.phone)} · ${esc(S.settings.email)}<br>${esc(S.settings.siret)}</div></div><div class="logo">${esc(S.settings.name[0])}</div></div>
 <div class="title" style="margin-top:14px">${title}</div><div style="font-size:10.5px;color:#6b7a72">No. ${d.num} · ${esc(S.settings.city)}, ${fdy(d.date)}</div>
 ${e?`<div class="lbl">Employee</div><b>${esc(full(e))}</b><div style="color:#555;font-size:11.5px">${esc(e.job)} · ${esc(e.dept)}</div>`:""}`}
function sigs(d,empLabel){return`<div class="sigs"><div class="sig">For ${esc(S.settings.name)}<div style="font-family:var(--display);font-size:15px;color:#1E5B41;margin-top:10px">${esc(S.settings.owner)}</div><div>${esc(S.settings.role)}</div></div>${empLabel===false?"":`<div class="sig">${empLabel||"Employee signature"}${d.sig?`<img src="${d.sig}" alt="Employee signature"><div>Signed on ${fdy(d.signedAt)}</div>`:d.signedAt?`<div style="margin-top:14px;color:#1E5B41;font-weight:700">Signed electronically on ${fdy(d.signedAt)}</div>`:`<div style="margin-top:14px">Awaiting signature</div>`}</div>`}</div>`}
const ctrLabel=t=>t==="Full-time"?"full-time, at-will":t==="Internship"?"internship":t.toLowerCase();
function paper(d){const e=d.empId?emp(d.empId):null;let b="";const s=S.settings;
 if(d.type==="attestation")b=paperHead(d,"EMPLOYMENT VERIFICATION LETTER")+`<p style="margin-top:14px;line-height:1.6">I, the undersigned, <b>${esc(s.owner)}</b>, ${esc(s.role)} of ${esc(s.name)}, confirm that <b>${esc(full(e))}</b> ${e.status==="Former"?"was":"has been"} employed by our company since <b>${fdy(e.start)}</b> as <b>${esc(e.job)}</b>, in a ${ctrLabel(e.contract)} position${e.end&&e.contract!=="Full-time"?" ending "+fdy(e.end):""}${e.status==="Former"?", until "+fdy(e.exit):""}.</p><p style="line-height:1.6">This letter is issued at the employee's request${d.motif?" for "+esc(d.motif):""}, for all lawful purposes.</p>`+sigs(d,false);
 else if(d.type==="certificat")b=paperHead(d,"CERTIFICATE OF EMPLOYMENT")+`<p style="margin-top:14px;line-height:1.6">I, the undersigned, <b>${esc(s.owner)}</b>, ${esc(s.role)} of ${esc(s.name)}, certify that <b>${esc(full(e))}</b> was employed by our company from <b>${fdy(e.start)}</b> to <b>${fdy(d.exit)}</b> as <b>${esc(e.job)}</b>.</p><p style="line-height:1.6">The employee leaves free of any commitment to us. We wish them every success in their future career.</p>`+sigs(d,false);
 else if(d.type==="avertissement")b=paperHead(d,"WRITTEN WARNING")+`<div class="lbl">Subject</div><b>Notice of written warning</b><p style="line-height:1.6">We have observed the following: ${esc(d.faits)}</p><p style="line-height:1.6">This is a breach of ${esc(d.oblig)}. This letter serves as a written warning, which will be placed in your personnel file.</p><p style="line-height:1.6">We ask that you make sure this does not happen again. Otherwise, further disciplinary action may be considered.</p>`+sigs(d,"Acknowledged by the employee");
 else if(d.type==="explication")b=paperHead(d,"REQUEST FOR EXPLANATION")+`<p style="margin-top:12px;line-height:1.6">On ${fdy(d.factsDate)}, the following was observed: ${esc(d.faits)}</p><p style="line-height:1.6">Please provide your written explanation within <b>${d.delay>=96?Math.round(d.delay/24)+" days":d.delay+" hours"}</b> of receiving this notice. You can reply directly in your employee space.</p><div class="lbl">Employee's reply</div><div style="border:1px solid #d5e4db;border-radius:8px;padding:8px;min-height:50px;font-size:12px;color:#333">${d.reponse?esc(d.reponse)+`<div style="color:#6b7a72;font-size:10.5px;margin-top:4px">Replied on ${fdy(d.repliedAt)}</div>`:`<span style="color:#9aa">Awaiting reply · due ${fdy(addDays(d.date,Math.ceil(d.delay/24)))}</span>`}</div>`+sigs(d);
 else if(d.type==="note"){const T=noteTargets(d);b=paperHead(d,"MEMO")+`<div class="lbl">To</div><b>${d.dest==="All"?"All staff":esc(d.dest)+" department"}</b><div class="lbl">Subject</div><b>${esc(d.objet)}</b><div class="lbl">Effective date</div>${fdy(d.effet)}<p style="line-height:1.6;margin-top:12px">${esc(d.body)}</p>`+sigs(d,false)+`<div class="lbl">Read receipts · ${(d.reads||[]).length}/${T.length}</div><div style="font-size:11.5px;line-height:1.7">${T.map(x=>((d.reads||[]).includes(x.id)?"✅ ":"⏳ ")+esc(full(x))).join("<br>")}</div>`}
 else if(d.type==="contrat"){const c=d.ctype;b=paperHead(d,c==="Internship"?"INTERNSHIP AGREEMENT":"EMPLOYMENT AGREEMENT · "+c.toUpperCase())+`<div class="lbl">Between</div>${esc(s.name)}, ${esc(s.addr)}, represented by ${esc(s.owner)}, ${esc(s.role)}, hereinafter “the Employer”,<div class="lbl">And</div>${esc(full(e))}${e.birth?", born "+fdy(e.birth):""}${e.addr?", residing at "+esc(e.addr):""}, hereinafter “${c==="Internship"?"the Intern":"the Employee"}”.
 <div class="art"><b>Section 1 · Position.</b> ${esc(full(e))} is hired as ${esc(e.job)} in the ${esc(e.dept)} department, starting ${fdy(d.cstart)}.</div>
 <div class="art"><b>Section 2 · Term.</b> ${c==="Full-time"||c==="Part-time"?"Employment is at-will: either party may end it at any time, with or without cause or notice, subject to applicable law.":c==="Seasonal"?`This is a fixed-term seasonal position from ${fdy(d.cstart)} to ${fdy(d.cend)}, for the following reason: ${esc(d.motif||"to be specified")}.`:`The internship runs from ${fdy(d.cstart)} to ${fdy(d.cend)}${e.school?", in partnership with "+esc(e.school):""}.`}</div>
 <div class="art"><b>Section 3 · Introductory period.</b> ${d.trialTxt&&d.trialTxt!=="not applicable"?`The first ${esc(d.trialTxt)} of employment are an introductory period.`:"Not applicable."}</div>
 <div class="art"><b>Section 4 · Compensation.</b> ${c==="Internship"?"The Intern receives a monthly stipend of ":"The Employee receives a monthly gross salary of "}${money(e.salary)}.</div>
 <div class="art"><b>Section 5 · Working hours.</b> ${s.hours} hours per week, according to the schedule shared in the app.</div>
 <div class="art"><b>Section 6 · Paid time off.</b> ${nf(s.cp)} days of paid time off earned per month worked.</div>
 <div class="art"><b>Section 7 · Obligations.</b> Compliance with the employee handbook, health and safety rules, and confidentiality of company and guest information.</div>
 <div class="art"><b>Section 8 · End of employment.</b> ${c==="Full-time"||c==="Part-time"?"Either party may end employment at any time, subject to applicable law. Two weeks' notice is appreciated.":"This agreement ends on the planned date unless renewed by an amendment signed by both parties."}</div>${S.settings.clauses||d.clauses?`<div class="art"><b>Section 9 · Special clauses.</b> ${esc([S.settings.clauses,d.clauses].filter(Boolean).join(" "))}</div>`:""}`+sigs(d)}
 else if(d.type==="avenant"){const ch=[d.job&&d.job!==d.oldJob?`Job title: ${esc(d.job)}`:"",d.salary?`Monthly gross salary: ${money(d.salary)}`:"",d.end?`End date: ${fdy(d.end)}`:""].filter(Boolean);
  b=paperHead(d,"EMPLOYMENT AGREEMENT AMENDMENT")+`<div class="lbl">Between</div>${esc(s.name)}, represented by ${esc(s.owner)}, ${esc(s.role)}, hereinafter “the Employer”,<div class="lbl">And</div>${esc(full(e))}, hereinafter “the Employee”.
 <div class="art"><b>Section 1 · Purpose.</b> This amendment concerns: ${esc((d.objet||"").toLowerCase())}. It takes effect on ${fdy(d.effet)}.</div>
 <div class="art"><b>Section 2 · New terms.</b> ${ch.length?"As of that date: "+ch.join(" · ")+".":""} ${esc(d.txt||"")}</div>
 <div class="art"><b>Section 3 · Other terms.</b> All other terms of the original agreement remain unchanged.</div>`+sigs(d)}
 else if(d.type==="entretien")b=reviewPaper(d);
 else if(d.type==="bulletin")b=payPaper(d.calc,d);
 return`<div class="paper">${b}<div style="font-size:9.5px;color:#9aa;margin-top:12px;text-align:center">Document generated with HRPro · time-stamped e-signature</div></div>`}
function shareText(d){const e=d.empId?emp(d.empId):null;const lab=d.type==="note"?"memo “"+d.objet+"”":DOCT[d.type][0].toLowerCase();
 return`Hi${e?" "+e.first:""}, a new document is waiting for you in your HRPro space: ${lab} (${d.num}).${["To sign","Awaiting reply"].includes(d.status)?" Please "+(d.status==="Awaiting reply"?"complete":"sign")+" it from your phone.":d.type==="note"?" Please confirm you've read it.":""}\n\n${S.settings.owner} · ${S.settings.name}`}
function sDoc(id){const d=S.docs.find(x=>x.id===id);if(!d)return;const A=mode==="admin";let act="";
 if(A){if(d.status==="To sign")act=`<button class="btn primary" data-act="signdoc" data-id="${id}">Get it signed now</button><button class="btn" data-act="nudge" data-id="${id}">Remind the employee</button>${["contrat","avenant"].includes(d.type)?`<button class="btn" data-act="editdoc" data-id="${id}">Edit</button>`:""}`;

  if(d.status==="Awaiting reply")act=`<button class="btn" data-act="nudge" data-id="${id}">Remind the employee</button>`;

  if(d.type==="note")act=`<button class="btn" data-act="nudge" data-id="${id}">Remind those who haven't read it</button>`}
 else{if(d.status==="To sign")act=`<button class="btn primary" data-act="signdoc" data-id="${id}">Sign</button>`;
  if(d.status==="Awaiting reply")act=`<button class="btn primary" data-act="answer" data-id="${id}">Reply and sign</button>`;
  if(d.type==="note"&&!(d.reads||[]).includes(me))act=`<button class="btn primary" data-act="read" data-id="${id}">I've read and understood</button>`}
 sheet(`<div class="stack"><div class="row between"><h2>${d.type==="note"?esc(d.objet):DOCT[d.type][0]}</h2><span class="pill ${DST[d.status]||"p-grey"}">${d.status}</span></div>${paper(d)}
 ${act?`<div class="btns">${act}</div>`:""}
 ${A?`<div class="eyebrow">Message to send</div><textarea class="ta" id="msg" style="min-height:90px">${esc(shareText(d))}</textarea><div class="btns"><button class="btn" data-act="copymsg">Copy message</button>${d.empId?`<a class="btn" href="sms:${emp(d.empId).phone.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(shareText(d))}">SMS</a><a class="btn" href="mailto:${esc(emp(d.empId).email||"")}?subject=${encodeURIComponent(d.num+" · "+S.settings.name)}&body=${encodeURIComponent(shareText(d))}">Email</a>`:""}<button class="btn" data-act="print">Print / PDF</button></div>`:`<button class="btn" data-act="print">Download as PDF</button>`}</div>`)}

function initPad(cv){const r=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const x=cv.getContext("2d");x.scale(r,r);x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#14302A";let draw=false,has=false,last=null;
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.addEventListener("pointerdown",e=>{draw=true;last=p(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
 cv.addEventListener("pointermove",e=>{if(!draw)return;const q=p(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(q[0],q[1]);x.stroke();last=q;has=true});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>draw=false));
 return{clear:()=>{x.clearRect(0,0,w,h);has=false},empty:()=>!has,data:()=>cv.toDataURL("image/png")}}
function sSign(id,withAnswer){const d=S.docs.find(x=>x.id===id);const e=emp(d.empId);
 sheet(`<div class="stack"><h2>${withAnswer?"Your reply":"E-signature"}</h2><div class="small muted">${DOCT[d.type][0]} ${d.num} · ${esc(full(e))}</div>
 ${withAnswer?`<div class="card pad small">${esc(d.faits)}</div><label class="f">Your explanation<textarea id="ans" rows="5" required placeholder="Explain the circumstances factually"></textarea></label>`:""}
 <label class="ck" style="background:var(--surface)"><input type="checkbox" id="agree">I have read the document${d.type==="avertissement"?" and acknowledge receipt":" and approve it"}</label>
 <canvas class="sigpad" id="pad" aria-label="Signature area"></canvas><div class="row between"><button class="btn sm" id="clr" type="button">Clear</button><span class="xs muted">Sign with your finger</span></div>
 <button class="btn primary block" id="dosign">Confirm my signature</button><div class="xs muted" style="text-align:center">Timestamp, name and device recorded as proof.</div></div>`);
 const pad=initPad($("#pad"));$("#clr").onclick=()=>pad.clear();
 $("#dosign").onclick=()=>{if(withAnswer){const a=$("#ans").value.trim();if(a.length<5){toast("Write your reply");return}d.reponse=a;d.repliedAt=today()}
  if(!$("#agree").checked){toast("Check the box to confirm you've read it");return}if(pad.empty()){toast("Sign inside the box");return}
  d.sig=pad.data();d.signedAt=today();d.status=withAnswer?"Replied":d.type==="avertissement"?"Delivered":"Signed";if(d.type==="avenant"){if(d.job)e.job=d.job;if(d.salary)e.salary=d.salary;if(d.end){e.end=d.end}log(full(e)+"'s record updated by amendment")}log(DOCT[d.type][0]+" "+d.num+" signed by "+full(e));save();if(mode==="emp")tick("sign");render();sDoc(id);toast(withAnswer?"Reply sent to HR":"Document signed")}}

function sReview(id,eid){const r=id?S.reviews.find(x=>x.id===id):null;
 if(!r||r.status==="Scheduled"){const R=r||{empId:eid,date:addDays(today(),7),time:"10:00"};const doing=!!r;
  sheet(`<form class="stack" id="rf"><h2>${doing?"Annual review":"Schedule a review"}</h2><label class="f">Employee<select id="r-e" ${doing?"disabled":""}>${empOpts(R.empId)}</select></label><div class="grid2"><label class="f">Date<input id="r-d" type="date" value="${R.date}"></label><label class="f">Time<input id="r-t" type="time" value="${R.time||"10:00"}"></label></div>
  ${doing?`<div class="eyebrow">Evaluation</div><div class="card pad stack" style="gap:12px">${CRIT.map((c,i)=>`<div><div class="small" style="font-weight:600">${c}</div><div class="stars" style="gap:2px">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=3?"on":""}" data-sc="${i}" data-v="${n}" style="font-size:26px" aria-label="${c}: ${n} out of 5">★</button>`).join("")}</div></div>`).join("")}</div>
  <label class="f">Achievements this year<textarea id="r-real" rows="2"></textarea></label><label class="f">Goals for next year<textarea id="r-obj" rows="2"></textarea></label><label class="f">Training needs<input id="r-form"></label><label class="f">Manager's comment<textarea id="r-com" rows="2"></textarea></label><button class="btn primary" type="submit">Complete the review</button>`:`<button class="btn primary" type="submit">Schedule and notify the employee</button>`}</form>`);
  const sc=[3,3,3,3,3];$$("[data-sc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sc,v=+b.dataset.v;sc[i]=v;$$(`[data-sc="${i}"]`).forEach(x=>x.classList.toggle("on",+x.dataset.v<=v))});
  $("#rf").onsubmit=ev=>{ev.preventDefault();if(doing){Object.assign(r,{status:"Completed",date:$("#r-d").value,scores:sc.slice(),real:$("#r-real").value,obj:$("#r-obj").value,form:$("#r-form").value,com:$("#r-com").value});save();render();sReview(r.id);toast("Review completed · summary sent to the employee")}
   else{S.reviews.push({id:uid(),empId:$("#r-e").value,date:$("#r-d").value,time:$("#r-t").value,status:"Scheduled"});save();closeSheet();render();toast("Review scheduled · the employee has been notified")}}}
 else{const e=emp(r.empId);sheet(`<div class="stack"><h2>Review summary</h2>${paper({type:"entretien",num:"AR-"+r.date.slice(0,4),date:r.date,empId:r.empId,r})}<button class="btn" data-act="print">Print / PDF</button></div>`)}}
function reviewPaper(d){const r=d.r;const avg=Math.round(r.scores.reduce((a,b)=>a+b,0)/r.scores.length*10)/10;return paperHead(d,"ANNUAL REVIEW")+`<div class="tw"><table><thead><tr><th>Criteria</th><th class="r">Rating</th></tr></thead><tbody>${CRIT.map((c,i)=>`<tr><td>${c}</td><td class="r" style="color:#B8892B">${"★".repeat(r.scores[i])}${"☆".repeat(5-r.scores[i])}</td></tr>`).join("")}<tr><td><b>Average</b></td><td class="r"><b>${avg} / 5</b></td></tr></tbody></table></div>${r.real?`<div class="lbl">Achievements</div>${esc(r.real)}`:""}<div class="lbl">Goals</div>${esc(r.obj||"—")}<div class="lbl">Training</div>${esc(r.form||"—")}<div class="lbl">Comment</div>${esc(r.com||"—")}`+sigs({signedAt:r.signedAt})}

const PAY0={dayBase:"ouvres",sick:100,lateTol:10,lateMode:"fixe",lateAmt:10,ot:50,transport:40,assid:50,ancPct:2,ancYears:3,ancMax:10,advMax:50,contribs:[["Federal and state income tax (est.)",12,0],["Social Security",6.2,6.2],["Medicare",1.45,1.45]]};
const PAYMODES=["Direct deposit","Pay card","Check","Cash"];
let payYm="";
function PR(){return Object.assign({},PAY0,S.settings.pay||{})}
function capF(t){return t?t[0].toUpperCase()+t.slice(1):t}
function ymEnd(ym){const[y,m]=ym.split("-").map(Number);return iso(new Date(y,m,0,12))}
function monthLabel(ym){return new Date(ym+"-15T12:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"})}
function payMonths(){const d=new Date(today()+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()-1);return[iso(d).slice(0,7),today().slice(0,7)]}
function monOf(d){const k=(new Date(d+"T12:00:00").getDay()+6)%7;return addDays(d,-k)}
function payEmps(ym){const st=ym+"-01",en=ymEnd(ym);return S.emp.filter(e=>e.start<=en&&(!e.exit||e.exit>=st)&&(+e.salary>0))}
function payCalc(e,ym){const r=PR(),st=ym+"-01",en=ymEnd(ym),sal=+e.salary||0,H=+S.settings.hours||40;
 const wdm=workDays(st,en)||1,day=r.dayBase==="26"?sal/26:r.dayBase==="30"?sal/30:sal/wdm,hour=sal/(H*52/12);
 const G=[],Rt=[],add=(arr,label,base,amt)=>{amt=Math.round(amt*100)/100;if(amt>0)arr.push({label,base,amt})};
 G.push({label:"Base salary",base:e.contract+" · "+H+" h / week",amt:sal});
 let out=0;if(e.start>st)out+=workDays(st,addDays(e.start,-1));if(e.exit&&e.exit<en)out+=workDays(addDays(e.exit,1),en);
 const yrs=Math.floor((new Date(en+"T12:00:00")-new Date(e.start+"T12:00:00"))/(365.25*864e5));const pct=Math.min(Math.floor(yrs/(+r.ancYears||1))*(+r.ancPct||0),+r.ancMax||0);
 if(pct>0)add(G,"Seniority bonus",yrs+" yrs · "+nf(pct)+"%",sal*pct/100);
 (e.primes||[]).forEach(x=>{if(+x.a)add(G,x.l||"Fixed bonus","employee's fixed bonus",+x.a)});
 if(+r.transport&&!e.noTransport)add(G,"Commuter allowance","monthly flat amount",+r.transport);
 const lv=f=>S.leaves.filter(l=>l.empId===e.id&&l.status==="Approved"&&l.to>=st&&l.from<=en&&f(l)).reduce((a,l)=>a+(l.half?0.5:workDays(l.from<st?st:l.from,l.to>en?en:l.to)),0);
 const unj=lv(l=>unjust(l)),sick=lv(l=>!isCong(l.type)&&!unjust(l)),ss=lv(l=>l.type==="Unpaid leave");
 const lates=S.shifts.filter(x=>x.empId===e.id&&x.date>=st&&x.date<=en&&!onLeave(e.id,x.date)).map(x=>{const pu=S.punches.find(y=>y.empId===e.id&&y.date===x.date);return pu?toMin(pu.in)-toMin(x.start):0}).filter(m=>m>(+r.lateTol||0));
 const W={};S.punches.filter(x=>x.empId===e.id&&x.date>=st&&x.date<=en).forEach(x=>{const k=monOf(x.date);W[k]=(W[k]||0)+punchMin(x)});
 const otMin=Object.values(W).reduce((a,m)=>a+Math.max(0,m-H*60),0);
 if(otMin)add(G,"Overtime",hm(otMin)+" × "+money(hour)+" + "+nf(r.ot)+"%",otMin/60*hour*(1+(+r.ot||0)/100));
 if(!unj&&!ss&&!lates.length&&!out&&+r.assid)add(G,"Attendance bonus","0 absences, 0 late arrivals",+r.assid);
 const A=((S.pay[ym]||{}).adj||{})[e.id]||{};if(+A.prime)add(G,A.label||"One-time bonus","manual entry",+A.prime);

  case"reply":{const m=S.msgs.find(x=>x.id===id);const r=$("#m-r").value.trim();if(!r){toast("Write your reply");break}m.reply=r;m.status="Resolved";m.repliedAt=today();save();render();sMsg(id);toast("Reply sent to the employee's space");break}
  case"incok":{const i=S.incidents.find(x=>x.id===id);i.status="Handled";save();render();toast("Report handled");break}
  case"xok":case"xno":case"xpaid":{const x=S.expenses.find(y=>y.id===id);x.status=a==="xok"?"Approved":a==="xno"?"Declined":"Reimbursed";save();render();toast(a==="xok"?"Approved · added to the payroll export":a==="xno"?"Expense declined":"Marked as reimbursed");break}
  case"trialok":{const x=E();x.trialOk=true;save();render();if($("#layer").innerHTML)sEmp(id);toast("Hire confirmed after probation");break}
  case"trialext":{const x=E();x.trial=addDays(x.trial||today(),30);save();render();if($("#layer").innerHTML)sEmp(id);toast("Probation extended by one month · remember the signed amendment");break}
  case"renew":{const x=E();const ne=addDays(x.end,90);sDocForm("contrat",id,{ctype:"Seasonal",cstart:addDays(x.end,1),cend:ne,trialTxt:"not applicable",motif:x.motif});x.end=ne;save();render();break}
  case"tocdi":{const x=E();x.contract="Full-time";x.end="";save();render();sDocForm("contrat",id,{ctype:"Full-time",cstart:today(),cend:"",trialTxt:"not applicable"});toast("Converted to full-time · sign the new agreement");break}
  case"endc":sExit(id);break;
  case"attest":sDocForm("attestation",id,{motif:"end of internship"});break;
  case"medtask":{const x=E();S.tasks.push({id:uid(),title:"Book safety certification renewal · "+full(x),date:today(),time:nowHM(),prio:"High",done:false,notified:true});save();render();toast("Added to today's tasks");break}
  case"medok":{const x=E();x.medical=addDays(today(),730);save();render();if($("#layer").innerHTML)sEmp(id);toast("Renewal recorded · next reminder in 2 years");break}
  case"wish":{const x=E();const t=`Happy birthday ${x.first}! 🎉 The whole ${S.settings.name} team wishes you a wonderful day. Thank you for everything you do.\n\n${S.settings.owner}`;sheet(`<div class="stack"><h2>Birthday message</h2><textarea class="ta" id="msg">${esc(t)}</textarea><div class="btns"><button class="btn primary" data-act="copymsg">Copy</button><a class="btn" href="sms:${x.phone.replace(/[^\d+]/g,"")}?&body=${encodeURIComponent(t)}">SMS</a></div></div>`);break}
  case"import":sImport();break; case"doimport":doImport();break;
  case"tpl":download("employee-import-template.csv",csv([IMP.cols,IMP.ex]));toast("Template downloaded · open it in Excel");break;
  case"exportpaie":exportPaie();break; case"exportemp":exportEmp();break;
  case"reset":if(confirm("Reset the demo? Your test data will be erased.")){S=seed();syncDepts();save();closeSheet();go("accueil");render();toast("Demo reset")}break;
  case"punch":doPunch();break;
  case"ereq":eReqTab=el.dataset.v;go("e-demandes");break;
  case"ereqtab":eReqTab=el.dataset.v;render();break;
  case"apply":applyJob=el.dataset.v;lastRef=null;go("c-postuler");render();break;
  case"newapply":lastRef=null;render();break;
 }});
function checkReminders(){if(mode!=="admin")return;const now=nowHM(),t0=today();let hit=0;
 S.tasks.forEach(t=>{if(t.done||t.notified||t.date!==t0||t.time>now)return;t.notified=true;hit++;toast("⏰ Reminder: "+t.title);
  try{if("Notification"in window&&Notification.permission==="granted")new Notification("HRPro · reminder",{body:t.time+" · "+t.title,icon:LOGO})}catch(e){}});
 if(hit){save();render()}}
setInterval(checkReminders,30000);

const sp=$("#splash");let shown=false;try{shown=sessionStorage.getItem(KEY+"-splash")==="1"}catch(e){}
const hideSplash=()=>{if(!sp||!sp.isConnected)return;sp.style.opacity="0";setTimeout(()=>sp.remove(),500);try{sessionStorage.setItem(KEY+"-splash","1")}catch(e){}};
if(sp){if(shown)sp.remove();else{sp.onclick=hideSplash;setTimeout(hideSplash,2400)}}
view=location.hash.slice(1);
syncMode();
render();setTimeout(checkReminders,3000);

})();
</script>

<script src="../../sacko-track.js" defer></script>
