<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cockpit · SACKO CONCEPT</title>
<link rel="icon" href="../assets/sacko-logo-vert-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f5;--card:#fff;--ink:#1c2a22;--muted:#66756c;--line:#dce7e0;--gold:#217346;--gold-d:#185c37;--gold-l:#e5f2ea;--green:#2e7d55;--green-l:#e4f3ea;--red:#b83a3a;--red-l:#fbe9e9;--amber:#a86a12;--amber-l:#fbf0d9;--blue:#2c5fa8;--blue-l:#e6eefa;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}.btn.pri:hover{background:var(--gold-d)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-l)}
textarea.input{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.field{margin-bottom:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1 1 160px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.p-green{background:var(--green-l);color:var(--green)}.p-red{background:var(--red-l);color:var(--red)}.p-amber{background:var(--amber-l);color:var(--amber)}.p-blue{background:var(--blue-l);color:var(--blue)}.p-grey{background:#e9efeb;color:var(--muted)}
/* connexion */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;width:100%;max-width:400px;box-shadow:0 18px 50px -30px rgba(20,70,40,.35)}
.mono{width:54px;height:54px;border-radius:14px;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",serif;font-weight:700;font-size:22px;margin-bottom:16px}
.err{background:var(--red-l);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* application */
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto}
.brand .mono{width:40px;height:40px;margin:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold-l);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;object-fit:cover}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;line-height:0}.avbtn:hover .av,.avbtn:focus-visible .av{box-shadow:0 0 0 3px var(--gold-l)}
.bigav{width:120px;height:120px;font-size:38px;margin:0 auto 14px}
img.mono{background:none;border-radius:50%;object-fit:cover;display:block}
.login-card img.mono{width:84px;height:84px;margin:0 auto 14px}
.login-card{text-align:center}.login-card .field{text-align:left}
nav.tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
nav.tabs button{white-space:nowrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tools .input{flex:1 1 150px;width:auto}.tools .q{flex:3 1 220px}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}.line:last-child{border-bottom:0}.line .grow{flex:1 1 160px;min-width:0}
.tile.warn b{color:var(--amber)}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-size:24px;white-space:nowrap;font-family:"Playfair Display",serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ag-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--gold-l);display:grid;place-items:center;font-weight:700;color:var(--gold-d);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.ag-name{font-weight:700;font-size:16px;line-height:1.25}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:10px 0 14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
/* fenêtre */
#modal{position:fixed;inset:0;background:rgba(20,40,30,.42);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;z-index:20}
#modal.on{display:flex}
.box{background:#fff;border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
.box.wide{max-width:820px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.box-h h2{font-size:20px}
.box-b{padding:18px 20px}
.box-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1}
.sec{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-d);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.checks input{accent-color:var(--gold);width:16px;height:16px}
.acc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.acc .grow{flex:1 1 160px;min-width:0}
.ticket{border-left:4px solid var(--gold)}
.ticket p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
pre.log{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:var(--red)}
@media(max-width:560px){.head h1{font-size:23px}.grid{grid-template-columns:1fr}.brand span{display:none}}
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="login-form">
    <img class="mono" src="../assets/sacko-logo-vert-512.png" alt="SACKO CONCEPT">
    <h1 style="font-size:26px">Cockpit SACKO CONCEPT</h1>
    <p class="muted sm" style="margin:4px 0 20px">Espace réservé à l'administration SACKO CONCEPT.</p>
    <div class="err hide" id="login-err"></div>
    <div class="field"><label class="f" for="l-email">Adresse e-mail</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label class="f" for="l-pass">Mot de passe</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" id="l-btn" style="width:100%;padding:12px">Se connecter</button>
  </form>
</section>

<div id="app" class="hide">
  <header class="top"><div class="top-in">
    <div class="brand"><img class="mono" src="../assets/sacko-logo-vert-96.png" alt=""><span>Cockpit SACKO CONCEPT</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="agences" class="on">Agences</button>
      <button data-tab="paiements">Paiements</button>
      <button data-tab="support">Support <span id="nb-tickets"></span></button>
      <button data-tab="erreurs">Erreurs</button>
      <button data-tab="reglages">Réglages</button>
    </nav>
    <button class="btn sm" id="logout">Déconnexion</button>
  </div></header>
  <main id="main"></main>
</div>

<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://bwiihwrdgnaqfbizudpx.supabase.co";
const SB_KEY="sb_publishable_8u8N-9EmQBMgvftQDSPpKA_97yA5AT6";
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=d=>d?new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
const isoDay=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const slugify=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
let tT;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(tT);tT=setTimeout(()=>t.className="",3200)}
function modal(title,body,foot,wide){$("#box").className="box"+(wide?" wide":"");$("#box").innerHTML=`<div class="box-h"><h2>${title}</h2><button class="x" id="m-x" aria-label="Fermer">×</button></div><div class="box-b">${body}</div>${foot?`<div class="box-f">${foot}</div>`:""}`;$("#modal").classList.add("on");$("#m-x").onclick=closeModal;$("#modal").scrollTop=0}
function closeModal(){$("#modal").classList.remove("on");$("#box").innerHTML=""}
async function busy(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(e.message||"Une erreur est survenue",true)}finally{if(btn)btn.disabled=false}}
const must=r=>{if(r.error)throw new Error(r.error.message);return r.data};

const OFFRES={essai:"Essai gratuit",mensuel:"Mensuel",annuel:"Annuel",licence:"Licence"};
const ROLES={dg:"Direction (accès complet)",rh:"Ressources humaines",superviseur:"Superviseur",agent:"Agent",client:"Client"};
const titre=c=>c.fonction?esc(c.fonction)+" · "+ROLES[c.role]:(ROLES[c.role]||esc(c.role));
const MODULES={planning:"Planning",pointage:"Pointage",conges:"Congés et absences",documents:"Documents RH",messagerie:"Messagerie",paie:"Paie",materiel:"Matériel et stock",facturation:"Facturation",rapports:"Rapports",main_courante:"Main courante",rondes:"Rondes",supervision:"Supervision",espace_client:"Espace client",sos:"Alerte SOS"};

const photoUrl=p=>p?sb.storage.from("photos_profils").getPublicUrl(p).data.publicUrl:"";
const initiales=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const avatar=c=>c.photo_url?`<img class="av" src="${esc(photoUrl(c.photo_url))}" alt="">`:`<span class="av">${esc(initiales(c.nom_complet))}</span>`;
function reduire(file){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const c=Math.min(im.width,im.height),cv=document.createElement("canvas");cv.width=cv.height=400;
    cv.getContext("2d").drawImage(im,(im.width-c)/2,(im.height-c)/2,c,c,0,0,400,400);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?ok(b):ko(new Error("Photo illisible.")),"image/jpeg",.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("Ce fichier n'est pas une photo lisible."))};im.src=u})}
let agences=[],tab="agences",filtre={q:"",etat:"",offre:""};
let reglages={tarif_mensuel:100000,tarif_annuel:null,devise:"F CFA",whatsapp_support:"",message_relance:""};
const MODES=["Espèces","Mobile Money","Virement bancaire","Carte / Stripe","PayPal","Autre"];
const fm=n=>Math.round(+n||0).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" "+(reglages.devise||"F CFA");
const waLien=(tel,msg)=>"https://wa.me/"+String(tel||"").replace(/\D/g,"")+"?text="+encodeURIComponent(msg);
const relance=a=>(reglages.message_relance||"Bonjour, l'accès de {agence} arrive à échéance le {date}.").replace(/\{agence\}/g,a.nom_agence).replace(/\{date\}/g,fd(a.date_expiration));
const tarifDe=a=>+a.prix_convenu||(a.type_offre==="annuel"?+reglages.tarif_annuel:+reglages.tarif_mensuel)||0;
function etat(a){
  if(a.statut_abonnement!=="actif")return{k:"suspendu",l:"Suspendu",c:"p-red"};
  const j=Math.ceil((new Date(a.date_expiration)-Date.now())/864e5);
  if(j<=0)return{k:"expire",l:"Expiré",c:"p-red"};
  if(j<=7)return{k:"bientot",l:"Expire dans "+j+" j",c:"p-amber"};
  return{k:"actif",l:"Actif",c:"p-green"};
}

/* ---------- connexion ---------- */
function showLogin(msg){$("#app").classList.add("hide");$("#login").classList.remove("hide");const e=$("#login-err");e.textContent=msg||"";e.classList.toggle("hide",!msg)}
$("#login-form").onsubmit=ev=>{ev.preventDefault();busy($("#l-btn"),async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value});
  if(error)return showLogin("E-mail ou mot de passe incorrect.");
  $("#l-pass").value="";await entrer();
})};
async function entrer(){
  const r=await sb.rpc("contexte");
  if(r.error||!r.data||!r.data.connecte||r.data.profil.role!=="super_admin"||!r.data.acces_ouvert){await sb.auth.signOut();return showLogin("Cet espace est réservé à l'administration SACKO CONCEPT.")}
  const rg=await sb.from("reglages_plateforme").select("*").maybeSingle();if(rg.data)reglages=rg.data;
  $("#login").classList.add("hide");$("#app").classList.remove("hide");await ouvrir("agences");
}
$("#logout").onclick=async()=>{await sb.auth.signOut();showLogin()};
$("#tabs").onclick=e=>{const b=e.target.closest("button[data-tab]");if(b)ouvrir(b.dataset.tab)};
async function ouvrir(t){tab=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#main").innerHTML='<p class="muted">Chargement…</p>';
  try{await({agences:vAgences,paiements:vPaiements,support:vSupport,erreurs:vErreurs,reglages:vReglages}[t])()}catch(e){$("#main").innerHTML=`<div class="empty">Chargement impossible : ${esc(e.message)}</div>`}}

/* ---------- agences ---------- */
async function vAgences(){
  agences=must(await sb.rpc("cockpit_resume"))||[];
  const d=new Date(),debut=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
  const mois=(must(await sb.from("paiements_abonnement").select("montant").gte("paye_le",debut))||[]).reduce((t,x)=>t+(+x.montant||0),0);
  const n=k=>agences.filter(a=>k.includes(etat(a).k)).length;
  const tk=agences.reduce((t,a)=>t+(+a.tickets_ouverts||0),0);$("#nb-tickets").textContent=tk?"("+tk+")":"";
  $("#main").innerHTML=`<div class="head"><div><h1>Agences clientes</h1><p class="muted sm" style="margin:2px 0 0">Créez une agence, gérez son abonnement et coupez l'accès en un clic.</p></div><div class="actions"><button class="btn" id="csv">Exporter (Excel)</button><button class="btn pri" id="new-ag">+ Nouvelle agence</button></div></div>
  <div class="tiles"><div class="tile"><b>${agences.length}</b><span class="muted sm">Agences</span></div><div class="tile"><b>${n(["actif","bientot"])}</b><span class="muted sm">Accès ouvert</span></div><div class="tile"><b>${agences.filter(a=>a.type_offre==="essai").length}</b><span class="muted sm">En essai</span></div><div class="tile ${n(["bientot","expire"])?"warn":""}"><b>${n(["bientot","expire"])}</b><span class="muted sm">À relancer</span></div><div class="tile"><b>${n(["suspendu"])}</b><span class="muted sm">Suspendues</span></div><div class="tile"><b>${agences.reduce((t,a)=>t+(+a.nb_agents||0),0)}</b><span class="muted sm">Agents gérés</span></div><div class="tile" style="grid-column:span 2"><b>${fm(mois)}</b><span class="muted sm">Encaissé ce mois</span></div></div>
  <div class="tools"><input class="input q" id="fq" type="search" placeholder="Rechercher une agence, une ville…" value="${esc(filtre.q)}"><select class="input" id="fe"><option value="">Tous les états</option><option value="actif">Accès ouvert</option><option value="relance">À relancer</option><option value="suspendu">Suspendues</option></select><select class="input" id="fo"><option value="">Toutes les offres</option>${Object.entries(OFFRES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
  <div id="liste"></div>`;
  $("#fe").value=filtre.etat;$("#fo").value=filtre.offre;
  $("#fq").oninput=e=>{filtre.q=e.target.value;listeAgences()};$("#fe").onchange=e=>{filtre.etat=e.target.value;listeAgences()};$("#fo").onchange=e=>{filtre.offre=e.target.value;listeAgences()};
  $("#new-ag").onclick=nouvelleAgence;$("#csv").onclick=exporter;listeAgences();
}
function listeAgences(){
  const q=slugify(filtre.q);
  const l=agences.filter(a=>{const k=etat(a).k;
    if(q&&!slugify([a.nom_agence,a.ville,a.pays,a.email_dg].join(" ")).includes(q))return false;
    if(filtre.offre&&a.type_offre!==filtre.offre)return false;
    if(filtre.etat==="actif"&&!["actif","bientot"].includes(k))return false;
    if(filtre.etat==="relance"&&!["bientot","expire"].includes(k))return false;
    if(filtre.etat==="suspendu"&&k!=="suspendu")return false;return true});
  const z=$("#liste");
  z.innerHTML=l.length?`<div class="grid">${l.map(carte).join("")}</div>`:`<div class="empty">${agences.length?"Aucune agence ne correspond à votre recherche.":"Aucune agence pour le moment.<br>Cliquez sur « Nouvelle agence » pour créer la première."}</div>`;
  z.querySelectorAll("[data-fiche]").forEach(b=>b.onclick=()=>fiche(b.dataset.fiche));
  z.querySelectorAll("[data-bascule]").forEach(b=>b.onclick=()=>bascule(b.dataset.bascule,b));
  z.querySelectorAll("[data-payer]").forEach(b=>b.onclick=()=>paiement(agences.find(x=>x.id===b.dataset.payer),closeModal));
}
function carte(a){const e=etat(a);
  return `<div class="card"><div class="ag-top"><div class="logo">${a.logo_url?`<img src="${esc(a.logo_url)}" alt="">`:esc((a.nom_agence||"?").slice(0,2).toUpperCase())}</div><div style="min-width:0"><div class="ag-name">${esc(a.nom_agence)}</div><div class="muted xs">${esc([a.ville,a.pays].filter(Boolean).join(", ")||"—")}</div></div></div>
  <span class="pill ${e.c}">${e.l}</span> <span class="pill p-blue">${OFFRES[a.type_offre]||esc(a.type_offre)}</span>${+a.tickets_ouverts?` <span class="pill p-amber">${+a.tickets_ouverts} demande(s)</span>`:""}

function exporter(){
  const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const L=[["Agence","Ville","Pays","Téléphone","E-mail","Offre","État","Fin de l'accès","Agents","Agents max","Sites","Total payé","Dernier paiement"]].concat(agences.map(a=>[a.nom_agence,a.ville,a.pays,a.telephone,a.email_dg,OFFRES[a.type_offre],etat(a).l,isoDay(a.date_expiration),a.nb_agents,a.nb_agents_max,a.nb_sites,a.total_paye,a.dernier_paiement||""]));
  const u=URL.createObjectURL(new Blob(["﻿"+L.map(r=>r.map(c).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
  const l=document.createElement("a");l.href=u;l.download="agences-sacko-concept-"+isoDay(Date.now())+".csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Fichier téléchargé");
}

const nrm=x=>String(x??"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
const pad2=n=>String(n).padStart(2,"0");
function xDate(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+6*3600e3);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
  if(typeof v==="number"&&v>10000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate())}
  const t=String(v??"").trim();let m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){const y=+m[3]<100?(+m[3]>40?1900:2000)+ +m[3]:+m[3];if(+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31)return y+"-"+pad2(+m[2])+"-"+pad2(+m[1])}
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+"-"+pad2(+m[2])+"-"+pad2(+m[3]):null}
const xNum=v=>{if(typeof v==="number")return v;const n=parseFloat(String(v??"").replace(/[^\d,.\-]/g,"").replace(",","."));return isNaN(n)?0:n};
const xTxt=v=>{const t=String(v??"").trim();return t||null};
function xSheet(wb,key,first,cols){const name=wb.SheetNames.find(n=>nrm(n).includes(key));if(!name)return [];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:true}),hi=rows.findIndex(r=>r.some(c=>nrm(c).startsWith(first)));if(hi<0)return [];
  const H=rows[hi].map(nrm),ix={};Object.entries(cols).forEach(([k,t])=>{ix[k]=H.findIndex(t)});
  return rows.slice(hi+1).filter(r=>r.some(c=>String(c??"").trim()!=="")).map(r=>{const o={};Object.keys(cols).forEach(k=>{const v=ix[k]<0?"":r[ix[k]];o[k]=typeof v==="string"?v.trim():v});return o})}
function chargerXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=ok;sc.onerror=()=>ko(new Error("Lecteur Excel indisponible. Vérifiez votre connexion Internet."));document.head.appendChild(sc)})}
const JOURS_X=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
async function importerExcel(a,file){
  modal("Import · "+esc(a.nom_agence),`<p class="muted">Lecture du fichier…</p>`,"");
  try{await chargerXLSX();const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array",cellDates:true}),grades=(a.parametres&&a.parametres.grades)||[];
    const S=xSheet(wb,"site","nom du site",{nom:h=>h.startsWith("nom du site"),type:h=>h.startsWith("type"),adr:h=>h.startsWith("adresse"),ville:h=>h==="ville",j:h=>h.includes("de jour"),n:h=>h.includes("de nuit"),mt:h=>h.includes("contrat"),cn:h=>h.startsWith("responsable"),ct:h=>h.startsWith("telephone"),ce:h=>h.startsWith("email")||h.startsWith("e-mail"),pts:h=>h.includes("ronde"),cons:h=>h.startsWith("consignes")})
      .filter(r=>xTxt(r.nom)&&!nrm(r.nom).startsWith("banque x "));
    const A=xSheet(wb,"agent","matricule",{mat:h=>h.startsWith("matricule"),nom:h=>h==="nom",pre:h=>h.startsWith("prenom"),gr:h=>h.startsWith("grade"),tel:h=>h.startsWith("telephone"),emb:h=>h.includes("embauche"),nais:h=>h.includes("naissance"),site:h=>h.startsWith("site"),poste:h=>h.startsWith("poste"),rep:h=>h.includes("repos"),sal:h=>h.includes("salaire"),ss:h=>h.includes("securite sociale")||h.includes("cnss"),carte:h=>h.includes("carte"),urg:h=>h.includes("urgence"),sang:h=>h.includes("sanguin")})
      .filter(r=>(xTxt(r.nom)||xTxt(r.pre))&&!(nrm(r.mat)==="ag-0001"&&nrm(r.nom)==="kouassi"));
    const M=xSheet(wb,"materiel","article",{nom:h=>h.startsWith("article"),cat:h=>h.startsWith("categorie"),q:h=>h.includes("quantite"),s:h=>h.includes("seuil"),p:h=>h.includes("prix")})
      .filter(r=>xTxt(r.nom)&&!(nrm(r.nom)==="talkie-walkie"&&xNum(r.q)===18&&xNum(r.s)===10&&xNum(r.p)===35000));

    modal("Import · "+esc(a.nom_agence),`<p>Le fichier contient :</p><ul><li><b>${S.length}</b> site(s)</li><li><b>${A.length}</b> agent(s)${A.length>a.nb_agents_max?` <span class="pill p-red">au-delà de la limite de ${a.nb_agents_max}</span>`:""}</li><li><b>${M.length}</b> article(s) de matériel</li></ul><p class="muted sm">Les sites, agents (par matricule) et articles déjà présents seront mis à jour. Rien ne sera supprimé.</p>`,
      `<button class="btn" id="im-no">Annuler</button><button class="btn pri" id="im-ok">Importer</button>`);
    $("#im-no").onclick=()=>fiche(a.id);
    $("#im-ok").onclick=()=>busy($("#im-ok"),async()=>{$("#im-ok").textContent="Import en cours…";const warn=[],res={s:0,a:0,m:0};
      const [es,ea,em]=await Promise.all([sb.from("sites").select("id,nom").eq("agence_id",a.id).then(must),sb.from("agents").select("id,matricule,nom,prenom").eq("agence_id",a.id).then(must),sb.from("stock_articles").select("id,nom").eq("agence_id",a.id).then(must)]);
      for(const r of S){const d={nom:xTxt(r.nom),type:xTxt(r.type),adresse:xTxt(r.adr),ville:xTxt(r.ville),besoins:{J:Math.max(0,Math.round(xNum(r.j))),N:Math.max(0,Math.round(xNum(r.n)))},montant_contrat:Math.max(0,Math.round(xNum(r.mt))),contact_nom:xTxt(r.cn),contact_telephone:xTxt(r.ct),contact_email:xTxt(r.ce),points_ronde:String(r.pts||"").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean),consignes:xTxt(r.cons)};
        const ex=es.find(x=>nrm(x.nom)===nrm(d.nom));const q=ex?await sb.from("sites").update(d).eq("id",ex.id):await sb.from("sites").insert({...d,agence_id:a.id}).select("id,nom").single();
        if(q.error)warn.push("Site « "+d.nom+" » : "+q.error.message);else{res.s++;if(!ex)es.push(q.data)}}
      let num=[...ea.map(x=>x.matricule),...A.map(r=>xTxt(r.mat))].reduce((m,x)=>{const k=/(\d+)\s*$/.exec(x||"");return k?Math.max(m,+k[1]):m},0);
      for(const r of A){const nom=xTxt(r.nom)||xTxt(r.pre),pre=xTxt(r.nom)?xTxt(r.pre):null,po=nrm(r.poste);let grade=grades.find(g=>nrm(g)===nrm(r.gr))||xTxt(r.gr)||"Agent de sécurité",site=null,poste=null;
        const sn=xTxt(r.site);if(sn){const st=es.find(x=>nrm(x.nom)===nrm(sn));if(st){site=st.id;poste=po.startsWith("n")?"N":"J"}else warn.push(nom+" "+(pre||"")+" : site « "+sn+" » introuvable, agent laissé sans affectation")}
        if(po.startsWith("v")){site=null;poste=null}

        const ri=JOURS_X.indexOf(nrm(r.rep)),mat=xTxt(r.mat)||(parNom?parNom.matricule:"AS-"+String(++num).padStart(4,"0"));
        const d={matricule:mat,nom,prenom:pre,grade,telephone:xTxt(r.tel),date_embauche:xDate(r.emb),date_naissance:xDate(r.nais),site_id:site,poste,jour_repos:ri<0?null:ri,salaire_base:Math.max(0,Math.round(xNum(r.sal))),num_securite_sociale:xTxt(r.ss),carte_pro_expiration:xDate(r.carte),contact_urgence:xTxt(r.urg),groupe_sanguin:xTxt(r.sang)};
        const ex=parNom||ea.find(x=>nrm(x.matricule)===nrm(mat));
        const q=ex?await sb.from("agents").update(d).eq("id",ex.id):await sb.from("agents").insert({...d,agence_id:a.id}).select("id,matricule,nom,prenom").single();
        if(q.error)warn.push((nom+" "+(pre||"")).trim()+" : "+(/Nombre maximum/.test(q.error.message)?"limite d'agents de l'offre atteinte":q.error.message));else{res.a++;if(!ex)ea.push(q.data)}}
      for(const r of M){const d={nom:xTxt(r.nom),categorie:xTxt(r.cat),quantite:Math.max(0,Math.round(xNum(r.q))),seuil:Math.max(0,Math.round(xNum(r.s))),prix_unitaire:Math.max(0,Math.round(xNum(r.p)))};

  <div class="field"><label class="f">Votre numéro WhatsApp de support <span class="muted" style="font-weight:400">(avec l'indicatif, ex. +229…)</span></label><input class="input" id="r-wa" value="${esc(r.whatsapp_support)}"></div>
  <div class="field"><label class="f">Message de relance <span class="muted" style="font-weight:400">· {agence} et {date} sont remplacés automatiquement</span></label><textarea class="input" id="r-msg">${esc(r.message_relance)}</textarea></div>
  <button class="btn pri" id="r-ok">Enregistrer les réglages</button></div>
  <div class="card"><div class="sec">Mon mot de passe</div>
  <div class="row"><div class="field"><label class="f">Nouveau mot de passe (8 caractères minimum)</label><input class="input" id="r-p1" type="password" autocomplete="new-password"></div><div class="field"><label class="f">Confirmez-le</label><input class="input" id="r-p2" type="password" autocomplete="new-password"></div></div>
  <button class="btn" id="r-pok">Changer mon mot de passe</button></div>`;
  $("#r-ok").onclick=()=>busy($("#r-ok"),async()=>{
    const v={id:true,tarif_mensuel:+$("#r-tm").value||0,tarif_annuel:$("#r-ta").value===""?null:+$("#r-ta").value,devise:$("#r-dev").value.trim()||"F CFA",whatsapp_support:$("#r-wa").value.trim()||null,message_relance:$("#r-msg").value.trim()||reglages.message_relance,updated_at:new Date().toISOString()};
    must(await sb.from("reglages_plateforme").upsert(v));reglages={...reglages,...v};toast("Réglages enregistrés")});
  $("#r-pok").onclick=()=>busy($("#r-pok"),async()=>{
    const a=$("#r-p1").value;if(a.length<8)throw new Error("Le mot de passe doit contenir au moins 8 caractères.");
    if(a!==$("#r-p2").value)throw new Error("Les deux mots de passe ne sont pas identiques.");
    const r2=await sb.auth.updateUser({password:a});if(r2.error)throw new Error(r2.error.message);
    $("#r-p1").value=$("#r-p2").value="";toast("Mot de passe changé")});
}

/* ---------- démarrage ---------- */
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)await entrer();else showLogin()})();
</script>
</body>
</html>
